    audience: external
    origin: both
    origin_codes: [token-credentialed, no role code]
    tier: external
    scope: tenant
    devices: [phone, desktop]
    environment: home
    top_jobs:
      - Open a proposal from a one-time link, read what it covers, and accept it with a signature or a typed attestation.
      - Confirm a will-call collection against a printed code, with a typed name and an explicit affirmative.
