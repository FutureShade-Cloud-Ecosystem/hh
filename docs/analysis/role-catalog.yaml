      - hardscapeos_dibbits/backend/migrations/0204_yard_landing_retires_its_takeover.sql

  - id: procurement_manager
    label: Procurement Manager
    audience: internal
    origin: hardscapeos
    origin_codes: [PROCUREMENT_MANAGER]
    tier: 2
    scope: branch
    devices: [desktop]
    environment: office
    top_jobs:
      - Draft and place purchase orders and read where each one got to.
      - Close the gaps the yard reports between what was sold and what is on hand.
      - Watch landed cost and the weighted average behind it.
    micro_apps: [buying-and-stock, manager-home, house-messages]
    sources:
      - hardscapeos_dibbits/app/src/purchasing-console.ts
      - hardscapeos_dibbits/app/src/inventory-home.ts
      - hardscapeos_dibbits/backend/internal/identity/rbac.go

  - id: payables_receivables
    label: Payables and Receivables
    audience: internal
    origin: hardscapeos
    origin_codes: [PAYABLES_RECEIVABLES]
    tier: 2
    scope: global
    devices: [desktop]
    environment: office
    top_jobs:
      - Enter the vendor bill, read the three-way match and post it or name the variance.
      - "Work the receivables console: aging, credit holds, statements, the bounced-payment queue."
      - Run a collections campaign against what is past due.
    micro_apps: [money-desk, buying-and-stock, house-messages]
    sources:
      - hardscapeos_dibbits/app/src/purchasing-console.ts
      - hardscapeos_dibbits/app/src/ar-console.ts
      - hardscapeos_dibbits/backend/internal/identity/rbac.go

  # ── Internal, tier 3 ────────────────────────────────────────────────────────────────────────
