# Launcher sections are surfaces the launcher (and later the Shade's operator mode) renders over hh's
# org-scoped operator endpoints. They are listed here so their replaces: coverage still holds; they are
# not micro-apps and do not become manifest frontends (DECISIONS.md D4).
launcher_sections:
  - id: operator-console
    name: Operator Console
    owner: "the launcher session (S3-L), per DECISIONS.md D4; not an hh micro-app and not a manifest frontend"
    audience: operator
    roles: [fb_operator, super_admin, dealer_admin]
    devices: [desktop]
    kit: dashboard
    brand: fb-tokens
    shell: fb-launcher
    offline:
      mode: none
      scopes: []
      conflict_policy: {}
    three_jobs:
      - Read and write the platform floor a dealer's override is overriding (the key roster whose read is staff-wide and whose write the server marks).
      - Hold the LLM credential, which is validated before it is stored and has no route back out, and set the per-account cap.
      - Mint a demo session per role against a demo deployment, without touching a dealer's own data.
    shared_entities:
      - "dealer config: write; read by dealer-admin and every external micro-app"
      - "credential: write only; never returned by any route"
      - "usage counter: read; counted per contractor account"
    replaces:
      hardscapeos: [admin/hotkeys, demo.html]
      hhpro: ["admin.html (credential and usage half)", "server/admin-store.ts"]
    sources:
      - hardscapeos_dibbits/app/src/nav-access.ts
      - hardscapeos_dibbits/app/demo.html
      - hardscapeos_dibbits/app/src/_demo.ts
      - hh_pro_dibbits/server/admin-store.ts
      - hh_pro_dibbits/CLAUDE.md

