    tier: 3
    scope: branch
    devices: [phone]
    environment: truck
    top_jobs:
      - Read the run in stop order and move a stop through its lifecycle.
      - Capture proof of delivery at the stop, or record a could-not-deliver with its handback sentence.
      - Close out the run from the end-of-run summary.
