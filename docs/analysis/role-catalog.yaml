  # ── Operator ────────────────────────────────────────────────────────────────────────────────
  - id: fb_operator
    label: FutureBuild Operator
    audience: internal
    origin: new
    origin_codes: [operator]
    tier: 1
    scope: global
    devices: [desktop]
    environment: office
    top_jobs:
      - Provision an org and intersect the app manifest with that org's capability manifest.
      - Hold the platform floor a dealer's own override is overriding, and write it.
