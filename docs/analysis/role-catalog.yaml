    audience: internal
    origin: hardscapeos
    origin_codes: [INSIDE_SALES]
    tier: 3
    scope: branch
    devices: [desktop, tablet, kiosk]
    environment: counter
    top_jobs:
      - "Ring a sale at the till: scan or search, resolve the customer, take the tender, hand over the receipt."
