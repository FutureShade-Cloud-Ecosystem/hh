      - hardscapeos_dibbits/app/src/_demo.ts
      - hardscapeos_dibbits/app/demo.html
      - hh_pro_dibbits/server/admin-store.ts

micro_apps:
  - id: counter-till
    name: Counter Till
    audience: internal
    roles: [inside_sales, sales_manager, branch_manager, outside_sales]
    devices: [desktop, tablet, kiosk]
    kit: scan-and-confirm
    brand: fb-tokens
    shell: hh-work
    offline:
      mode: read_cache_only
      scopes: [customers, products, price_matrix, parked_tickets, invoices, warranty_claims]
      conflict_policy: {}
      note: "DECISIONS.md D5: the till has no outbox; tenders, payments and every money-moving action resolve online."
    three_jobs:
      - "Ring a sale: scan or search, resolve the customer, take the tender, hand over the receipt."
      - Find an invoice and act on it (print, email, take a cheque).
      - Take a return, or capture a warranty claim from the person standing there.
    shared_entities:
      - "order: write; handed to yard-pick as a pick ticket"
      - "invoice: write; read by money-desk and by pro-pay"
      - "customer: read from dealer-admin"
      - "quote: read from quote-desk, converted here"
      - "warranty_claim: write; handed to manager-home for the board"
    replaces:
      hardscapeos: [sales/pos, sales/invoices, sales/returns, "warranty/warranty (claim capture and detail)"]
      hhpro: []
    sources:
      - hardscapeos_dibbits/app/src/pos-terminal.ts
      - hardscapeos_dibbits/app/src/nav-access.ts
      - hardscapeos_dibbits/app/src/app-shell.ts
      - hardscapeos_dibbits/app/src/warranty-surface.ts

  - id: quote-desk
    name: Quote Desk
    audience: internal
    roles: [inside_sales, outside_sales, sales_manager]
    devices: [tablet, desktop, phone]
    kit: guided-flow
    brand: fb-tokens
    shell: hh-work
    offline:
      mode: read_cache_plus_outbox
      scopes: [products, price_matrix, customers, quotes]
      conflict_policy:
        quotes: last_write_wins_by_field
        price_matrix: server_wins
    three_jobs:
      - Browse the catalogue and size the job (how much of this for a patio of this area).
      - Build the quote, and meet the margin guard when the price falls below the floor.
      - Send the quote to the customer on a share link, then convert the accepted one to an order.
    shared_entities:
      - "quote: write; handed to public-desk by share token and to counter-till for conversion"
      - "product: read from dealer-admin"
      - "approval_request: write; handed to manager-home when margin is below floor"
      - "order: write on conversion; handed to dispatch-board"
    replaces:
      hardscapeos: [sales/catalogue, sales/calculator, sales/quote, sales/quotes]
      hhpro: []
    sources:
      - hardscapeos_dibbits/app/src/dashboard-nav.ts
      - hardscapeos_dibbits/app/src/nav-access.ts
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/docs/contractor-portal-plan.md

  - id: yard-pick
