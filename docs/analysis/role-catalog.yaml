    audience: internal
    origin: hardscapeos
    origin_codes: [YARD_TEAM]
    tier: 3
    scope: branch
    devices: [tablet, phone, kiosk]
    environment: yard
    top_jobs:
      - Take the next pick ticket, pick it, weigh it and stage it.
