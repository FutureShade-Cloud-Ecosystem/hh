dropped:
  - what: "index.html (the ERP shell document)"
    reason: "It is not a micro-app: its chrome, launcher, tab strip, hash router and per-role landing become the shared shell-chrome package the hh-work and hh-field shells load (DECISIONS.md D2)."
    path: hardscapeos_dibbits/app/src/app-shell.ts
  - what: admin/account
    reason: "My Account is shell chrome, not a micro-app. Context 4.5 puts org, user, app switcher, sync state and notifications in identical chrome across every shell."
    path: hardscapeos_dibbits/app/src/account-settings.ts
