# Origin: `analysis/role-catalog.yaml` in `futurebuildai/hh_pro_dibbits` at commit 829d387baec93556ffa0e9242f4091e9be9544ec (read only source).
# Copied into `hh/docs/analysis/` by Session HH-2 lane HH-2.5; content below this header is unchanged except the `public-desk` roles line, amended by D23.
# This copy is the live role catalog from D23 onward; the copy in hh_pro_dibbits is frozen at the close of HH-1.
# In-body `analysis/...` paths resolve to `docs/analysis/...` in this copy.

# Role and micro-app catalog for the unified Hardscape House app (HH-1, lane L4).
#
# Derived read-only from two repositories:
#   hardscapeos_dibbits  the dealer ERP (Go modular monolith + Lit 3, six Vite entries)
#   hh_pro_dibbits       the contractor procurement portal (React over a framework-free core)
#
# It replaces the three-frontend sketch in FUTURESHADE-CONTEXT.md section 4.3 (yard, counter, pro)
# with the roles and surfaces that actually exist in the two codebases. Structure follows section 4.5:
# micro-app per role, shell per audience, offline declared per scope, a kit per app.
#
# House rules observed: no em or en dashes, no durations or calendar words, every claim cites a path.
#
# Revision after the PR review: the single internal shell (hh-internal) is now two shells split by work
# context per DECISIONS.md D2 (hh-work, hh-field). Coverage check re-run after the split
# (scratchpad coverage-check over dashboard-nav.ts, the six ERP entries plus the harness document, the
# Open questions 1 to 7, 9 and 12 are resolved in DECISIONS.md (D1 to D6); 8 and 11 are pending there with
# the checkpoint that decides each named.
# ERP portal routes and the HH Pro routes): registry pairs=28 entries=7 portal routes=14 hhpro routes=10 micro_apps=15 shells=5 launcher_sections=0 coverage: complete
#
# Revision on analysis/hh-demo-layer (PR review fixes F1 and F2): the hh-public brand is hh-pro per
# DECISIONS.md D2 (a contractor's tokens render as an override inside that frame per D12), and the two
# new public bundles are declared as micro-apps, demo-entry (HH-7.7) and hh-site (HH-10.6), so HH-2.2's
# manifest generation has a catalog source for every frontend. Coverage check re-run with the session
# checker over the same inputs: registry pairs=28 entries=7 portal routes=14 hhpro routes=10
# micro_apps=16 shells=5 launcher_sections=1 coverage: complete. The previous line's micro_apps=15 and
# launcher_sections=0 were stale: operator-console moved out of micro_apps into launcher_sections under
# DECISIONS.md D4 without the counts being re-run, and the checker's count of 14 before this revision
# is the true pre-revision value.

catalog: 1

audiences:
  - id: internal
    shell: [hh-work, hh-field]
    shell_kind: internal-installable
    brand: fb-tokens
    notes: >-
      Dealer staff, in two installable shells split by work context per DECISIONS.md D2: hh-work for
      office roles on desktop and tablet, hh-field for yard and driving work on a phone with camera and
      GPS permissions and offline full mode. House Messages loads in both. Today this is one Vite entry (index.html) whose shell owns a frozen hash registry,
      a per-screen gate table and a per-role landing, plus two staff surfaces already split out of it
      for byte reasons (drive.html, messages.html). Context 4.5 makes internal utility-first on the
      FutureBuild tokens; the shipped palette is "HH Yard Dark" in tokens.css, which is an open question.
    sources:
      - hardscapeos_dibbits/app/src/app-shell.ts
      - hardscapeos_dibbits/app/src/dashboard-nav.ts
      - hardscapeos_dibbits/app/src/nav-access.ts
      - hardscapeos_dibbits/app/vite.config.ts
      - hardscapeos_dibbits/app/src/styles/tokens.css
      - hardscapeos_dibbits/CLAUDE.md

  - id: external
    shell: hh-pro
    shell_kind: standalone-public
    brand: hh-pro
    notes: >-
      Contractor tenants. Two implementations exist of the same audience: the ERP's own Lit portal
      (portal.html, capability-gated hash routes) and the React HH Pro product (procurement board,
      order workspace, AR and Pay, assistant). Both are logged-in-only; neither has a cart.
    sources:
      - hardscapeos_dibbits/app/portal.html
      - hardscapeos_dibbits/app/src/portal/portal-shell.ts
      - hh_pro_dibbits/src/ui/App.tsx
      - hh_pro_dibbits/CLAUDE.md

  - id: external
    shell: hh-public
    shell_kind: standalone-public
    brand: hh-pro
    notes: >-
      Unauthenticated, token-credentialed pages: a homeowner accepting a proposal, somebody holding a
      printed will-call code, a member of the public reporting a failed installation. Every one of
      these uses bare fetch rather than the authenticated api() helper, by explicit rule, so no staff
      bearer token can reach a pre-auth surface. The brand is settled: hh-pro, per DECISIONS.md D2
      (hh-public stays a web shell with brand hh-pro). A contractor-branded proposal renders the
      contractor's own tokens as an override inside that frame per DECISIONS.md D12, never the
      dealer's tokens on a contractor's document.
    sources:
      - hardscapeos_dibbits/app/src/quote-public.ts
      - hardscapeos_dibbits/app/src/dispatch-willcall-public.ts
      - hardscapeos_dibbits/app/src/warranty-intake-public.ts
      - hh_pro_dibbits/src/ui/pages/CustomerQuotePage.tsx
      - hh_pro_dibbits/src/ui/styles/theme.css

  - id: operator
    shell: fb-launcher
    shell_kind: launcher
    brand: fb-tokens
    notes: >-
      FutureBuild staff with cross-org access. Two shipped surfaces already belong to this person
      rather than to the dealer: the platform key roster, whose read is staff-wide and whose write the
      server marks can_edit for the platform operator, and the pre-auth demo chooser that mints a
      session per role and is inert on every box but the demo droplet.
    sources:
      - hardscapeos_dibbits/app/src/nav-access.ts
      - hardscapeos_dibbits/app/src/_demo.ts
      - hardscapeos_dibbits/app/demo.html
      - hh_pro_dibbits/server/admin-api.ts

roles:
  # ── Internal, tier 1 ────────────────────────────────────────────────────────────────────────
  - id: general_manager
    label: General Manager
    audience: internal
    origin: hardscapeos
    origin_codes: [GENERAL_MANAGER]
    tier: 1
    scope: global
    devices: [desktop, tablet, phone]
    environment: office
    top_jobs:
      - Decide the override requests only leadership may decide (margin below floor, journal over threshold, freight above quote).
      - Read the business across both branches from the reporting console and the commission register.
      - Approve a credit or COD exception that a branch cannot clear on its own.
    micro_apps: [manager-home, money-desk, dealer-admin, house-messages]
    sources:
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/backend/migrations/0015_rbac_roles.sql
      - hardscapeos_dibbits/backend/migrations/0140_dashboard_layouts.sql
      - hardscapeos_dibbits/app/src/nav-access.ts

  - id: financial_controller
    label: Financial Controller
    audience: internal
    origin: hardscapeos
    origin_codes: [FINANCIAL_CONTROLLER]
    tier: 1
    scope: global
    devices: [desktop]
    environment: office
    top_jobs:
      - Work the general ledger and the posting queue, and close the period from the statements pack.
      - Reconcile the bank import through match and rules.
      - Decide rail approvals and credit or COD overrides that carry money.
    micro_apps: [money-desk, manager-home, dealer-admin]
    sources:
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/app/src/ar-console.ts
      - hardscapeos_dibbits/app/src/app-shell.ts

  - id: hr
    label: HR
    audience: internal
    origin: hardscapeos
    origin_codes: [HR]
    tier: 1
    scope: global
    devices: [desktop]
    environment: office
    top_jobs:
      - Maintain staff records, role assignment and branch grants.
      - Read the audit trail for a person or an action.
      - Answer a staff question from the messaging hub.
    micro_apps: [dealer-admin, house-messages]
    sources:
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/backend/migrations/0140_dashboard_layouts.sql
      - hardscapeos_dibbits/app/src/nav-access.ts

  # ── Internal, tier 2 ────────────────────────────────────────────────────────────────────────
  - id: branch_manager
    label: Branch Manager
    audience: internal
    origin: hardscapeos
    origin_codes: [BRANCH_MANAGER]
    tier: 2
    scope: branch
    devices: [desktop, tablet, phone]
    environment: office
    top_jobs:
      - Open a branch Home that leads with what needs a person, then the branch numbers.
      - Commit a delivery date and stand behind it when dispatch escalates.
      - Sell on credit at the counter when a clerk is blocked, and clear the branch queues.
    micro_apps: [manager-home, dispatch-board, counter-till, buying-and-stock, house-messages]
    sources:
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/.claude/skills/hardscape-dashboard-widgets/SKILL.md
      - hardscapeos_dibbits/app/src/dispatch-surface.ts

  - id: sales_manager
    label: Sales Manager
    audience: internal
    origin: hardscapeos
    origin_codes: [SALES_MANAGER]
    tier: 2
    scope: branch
    devices: [desktop, tablet]
    environment: office
    top_jobs:
      - Govern pricing rules, customer overrides and quantity breaks.
      - Read the commission register and the sales reports.
      - Take over a quote or an order the counter cannot commit.
    micro_apps: [manager-home, quote-desk, counter-till, dealer-admin]
    sources:
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/app/src/nav-access.ts
      - hardscapeos_dibbits/app/src/dashboard-nav.ts

  - id: yard_manager
    label: Yard Manager
    audience: internal
    origin: hardscapeos
    origin_codes: [YARD_MANAGER]
    tier: 2
    scope: branch
    devices: [tablet, desktop, phone]
    environment: yard
    top_jobs:
      - Run the pick queue, resolve shortages and stage what is going out.
      - Commit a delivery date on a load being built.
      - Count stock and settle the on-hand ledger against what is on the ground.
    micro_apps: [yard-pick, dispatch-board, buying-and-stock, manager-home, house-messages]
    sources:
      - hardscapeos_dibbits/backend/internal/identity/rbac.go
      - hardscapeos_dibbits/app/src/yard-console.ts
      - hardscapeos_dibbits/backend/migrations/0204_yard_landing_retires_its_takeover.sql

  - id: logistics_manager
    label: Logistics Manager
    audience: internal
    origin: hardscapeos
    origin_codes: [LOGISTICS_MANAGER]
    tier: 2
    scope: branch
    devices: [desktop, tablet, phone]
    environment: office
    top_jobs:
      - Build the loads on the load board, which is the screen this person opens first.
      - Commit and re-time delivery dates, including the freight raise that needs an approval.
