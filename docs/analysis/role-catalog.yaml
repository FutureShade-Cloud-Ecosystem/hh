  - id: outside_sales
    label: Outside Sales
    audience: internal
    origin: hardscapeos
    origin_codes: [OUTSIDE_SALES]
    tier: 3
    scope: branch
    devices: [tablet, phone, desktop]
    environment: site
    top_jobs:
      - Size a job on the customer's driveway with the material calculator and turn it into a quote.
      - Convert an accepted quote into an order against the customer's credit.
      - Read the customer's open orders and deliveries before walking in.
    micro_apps: [quote-desk, counter-till, house-messages]
