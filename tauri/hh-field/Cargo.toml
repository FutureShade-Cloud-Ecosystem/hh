[package]
name = "hh-field"
version = "0.0.0"
description = "HH Field: the Tauri 2 profile for field roles, shipping the micro app bundles inside it."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hh_field_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
hh-shell-core = { path = "../core" }
tauri = { version = "=2.12.3", features = [] }
# Probe only: the webview SQL plugin is an open grant, so it is not in a normal build.
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"], optional = true }
serde_json = "1"

# `probe` is the probe 4 proof harness (probe.js and probe_report). Off by
# default; enable it only for the proof runs. Removed when the real shell lands.
[features]
default = []
probe = ["dep:tauri-plugin-sql"]
