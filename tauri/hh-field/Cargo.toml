[package]
name = "hh-field"
version = "0.0.0"
description = "HH Field: the Tauri 2 profile for field roles, shipping the micro app bundles inside it."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hh_field_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
hh-shell-core = { path = "../core" }
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"] }
serde_json = "1"
