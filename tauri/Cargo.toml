# One Tauri 2 workspace, three thin profiles over one shared Rust core
# (decision log row 1519). Field and Work are real; Pro stays a skeleton
# (its README only) until its own item.
[workspace]
resolver = "2"
members = ["core", "hh-field", "hh-work"]

[workspace.package]
# One source of the version for every crate and the Tauri config (Android
# refuses 0.0.0).
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
publish = false

[profile.dev]
debug = 0
