[package]
name = "hh-work"
version.workspace = true
description = "HH Work: the Tauri 2 profile for office and counter roles, shipping the desk app bundles inside it."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hh_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
hh-shell-core = { path = "../core" }
tauri = { version = "=2.12.3", features = [] }
# The Work channel's updater: endpoints and the verify key are configured in
# tauri.conf.json; the release signing key never enters git or this workspace.
tauri-plugin-updater = { version = "=2.13.3", default-features = false, features = ["rustls-tls", "zip"] }
serde_json = "1"
