      scopes: []
      conflict_policy: {}

  - id: pro-procurement
    name: Pro Procurement Board
    audience: external
    roles: [contractor_owner, contractor_buyer]
    gate: role
    devices: [phone, desktop]
    kit: list-detail
    shell: hh-pro
    brand: hh-pro
    offline:
      mode: read_cache_plus_outbox
      scopes: [projects, orders, scope_items, price_matrix, catalog, customer_quotes, team]
      conflict_policy:
        orders: server_wins
        scope_items: last_write_wins_by_field
        customer_quotes: manual
        team: manual

  - id: pro-pay
    name: Pro Pay
    audience: external
    roles: [contractor_ap, contractor_owner]
    gate: role
    devices: [desktop, phone]
    kit: list-detail
    shell: hh-pro
    brand: hh-pro
    offline:
      mode: read_cache_only
      scopes: [invoices, payments, payment_methods, aging]
      conflict_policy:
        invoices: server_wins
        payments: server_wins

  - id: pro-field
    name: Pro Field
    audience: external
    roles: [contractor_field, contractor_buyer, contractor_owner]
    gate: role
    devices: [phone]
    kit: list-detail
    shell: hh-pro
    brand: hh-pro
    offline:
      mode: read_cache_plus_outbox
      scopes: [orders, tracking_events, delivery_instructions, pickups]
      conflict_policy:
        tracking_events: server_wins
        delivery_instructions: last_write_wins_by_field
        pickups: manual

  - id: public-desk
    name: Public Desk
    audience: external
    roles: [homeowner]
    gate: role
    devices: [phone, desktop]
    kit: guided-flow
    shell: hh-public
    brand: hh-pro
    offline:
      mode: none
      scopes: []
      conflict_policy: {}

  - id: demo-entry
    name: Demo Entry
    audience: external
    roles: []
    # pre-auth: served without sign-in; the token is the credential and no role check runs
    gate: token
    devices: [phone, desktop]
    kit: guided-flow
    shell: hh-public
    brand: hh-pro
    # offline note from the catalog: Pre-auth like public-desk: bare fetch by rule, no session machinery in the bundle, nothing cached.
    offline:
      mode: none
      scopes: []
      conflict_policy: {}

  - id: hh-site
    name: Audience Landing Pages
    audience: external
    roles: []
    # pre-auth: served without sign-in; the token is the credential and no role check runs
    gate: token
    devices: [phone, desktop]
    kit: guided-flow
