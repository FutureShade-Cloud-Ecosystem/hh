name: tauri

# The shells' Rust (tauri/core and the profile crates) is checked here and
# only here: format, clippy with warnings denied, and the unit tests. The
# workflow runs only when tauri/** or this file changes. The repository has no
# required status checks (no branch protection, no rulesets), so a path
# filtered workflow cannot block a merge by never running.
on:
  pull_request:
    paths:
      - 'tauri/**'
      - '.github/workflows/tauri.yml'
  push:
    branches:
      - main
    paths:
      - 'tauri/**'
      - '.github/workflows/tauri.yml'

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tauri:
    name: tauri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install the Tauri build libraries
        # The libraries tauri 2 links on Linux (webkit2gtk 4.1 and its
        # companions), plus libdbus for the keychain's secret service.
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Set up Rust
        # 1.95 is the workspace rust-version.
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/target
          key: tauri-cargo-${{ runner.os }}-${{ hashFiles('tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-${{ runner.os }}-
      - name: Stub the frontend bundles
        # Tauri's context macro reads each profile's frontendDist at compile
        # time, so the directory must exist. The real bundles come from the
        # assemble-dist.sh scripts (npm builds); the Rust checks need only
        # the directory and an index page.
        run: |
          set -euo pipefail
          for profile in hh-field hh-work; do
            if [ -d "$profile" ]; then
              mkdir -p "$profile/dist"
              echo '<!doctype html>' > "$profile/dist/index.html"
            fi
          done
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
