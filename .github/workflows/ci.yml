name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'qa/**'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Schema freeze check
        run: |
          set -euo pipefail
          marker=core/db/SCHEMA-FROZEN
          if [ ! -f "$marker" ]; then
            echo "Schema freeze marker $marker is absent: the freeze is not in effect, passing."
            exit 0
          fi
          freeze_commit="$(tr -d '[:space:]' < "$marker")"
          if [ -z "$freeze_commit" ]; then
            echo "Schema freeze marker $marker is present but empty; it must hold the freeze commit id." >&2
            exit 1
          fi
          if ! git cat-file -e "$freeze_commit^{commit}" 2>/dev/null; then
            echo "Schema freeze marker names commit $freeze_commit, which is not in this checkout. The job fetches with fetch-depth: 0, so the marker content is wrong." >&2
            exit 1
          fi
          changed="$(git diff --name-only "$freeze_commit"..HEAD -- core/db/migrations/)"
          if [ -z "$changed" ]; then
            echo "No changes under core/db/migrations/ since freeze commit $freeze_commit: passing."
            exit 0
          fi
          # The escape hatch is scoped to this change's own diff: a PORTED.md
          # edit made earlier (a merged port, or a ledger note) must never
          # open the hatch for an unrelated later migration change.
          pr_base="${{ github.event.pull_request.base.sha }}"
          push_before="${{ github.event.before }}"
          ledger_base="$freeze_commit"
          if [ -n "$pr_base" ] && git cat-file -e "$pr_base^{commit}" 2>/dev/null; then
            ledger_base="$(git merge-base "$pr_base" HEAD)"
          elif [ -n "$push_before" ] && [ "$push_before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$push_before^{commit}" 2>/dev/null; then
            ledger_base="$(git merge-base "$push_before" HEAD)"
          fi
          # The escape hatch is coverage, not co-occurrence: the change's own
          # PORTED.md diff must NAME every changed migration file, so a pull
          # request that merely introduces or reformats the ledger cannot
          # smuggle an unrelated migration past the freeze.
          ledger_adds="$(git diff "$ledger_base"..HEAD -- core/db/PORTED.md | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
          uncovered=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! printf '%s\n' "$ledger_adds" | grep -qF "$(basename "$f")"; then
              uncovered="$uncovered $f"
            fi
          done <<< "$changed"
          if [ -z "$uncovered" ]; then
            echo "Changes under core/db/migrations/ since freeze commit $freeze_commit are covered by core/db/PORTED.md ledger entries carried in the same change:"
            printf '%s\n' "$ledger_adds"
            exit 0
          fi
          echo "Schema freeze violated: files changed under core/db/migrations/ after freeze commit $freeze_commit with no PORTED.md coverage:" >&2
          echo "$uncovered" >&2
          echo "Only an HH-3.7 port may change core/db/migrations/ after the freeze, and only in a pull request whose PORTED.md ledger diff names every changed file." >&2
          exit 1
      - name: App Shape check
        run: bash scripts/check-shape.sh
      - name: Scope gate
        # No file names the old npm scope outside the one history note, and
        # no web workspace package is named outside @hardscapehouse/
        # (HH-30, docs/scope-rename-history.md).
        run: bash scripts/check-scope.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the web workspace
        # The web install precedes the bun drift gate: the gate's bun test
        # discovers the web packages' suites under the workspace, and those
        # suites (and the packages they run) resolve sibling and vendored
        # packages by name through web/node_modules. Installing only inside
        # the web loop left the gate first in line, so a fresh clone, which
        # has no web/node_modules, failed the gate with "Cannot find module"
        # once web packages imported each other by name. The loop below
        # remains the ONE typecheck and test pass over every web package;
        # it no longer installs, it consumes the install made here.
        run: npm --prefix web ci
      - name: Test and manifest drift gate
        run: |
          set -euo pipefail
          # The web workspace is installed by the step above: the web
          # packages' suites import @hardscapehouse/api-client by its bare name, and on a
          # fresh checkout there is no web/node_modules to resolve it from
          # until npm ci has linked the workspace. Without that install the
          # gate goes red on every fresh runner while passing on a
          # workstation that still holds the last install. This gate does not
          # install; it consumes the install the step above made.
          # Pre-install the one npm package the gate needs, pinned to the exact
          # version the contract tools' lockfile installs, so the gate never
          # relies on bun's on-demand auto-install (which resolves unpinned).
          # The install needs a package.json at the tree's root, which this
          # repository deliberately does not carry, so bun writes one along
          # with bun.lock; the trap removes both (and the installed
          # node_modules) when the step ends, leaving the tree clean on a
          # runner and on a workstation alike.
          trap 'rm -rf package.json bun.lock node_modules' EXIT
          bun add --exact yaml@2.9.1
          bun test
          bun scripts/generate-manifest.ts --check
      - name: OpenAPI contract checks (repo-local)
        run: |
          npm --prefix core/api/tools ci
          node core/api/tools/merge.mjs
          git diff --exit-code -- core/api/openapi.yaml
          node core/api/tools/gen-types.mjs
          node core/api/tools/parity.mjs
          node core/api/tools/fixtures.mjs
          node core/api/tools/statemap.mjs
          node core/api/tools/d8-isolation.mjs
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Build and vet core
        working-directory: core
        run: |
          go build ./...
          go vet ./...
      - name: Test core
        working-directory: core
        # The untagged suite. The database-gated legs skip politely here
        # (no gate variables in CI, zero secrets in the workflow); -p 1
        # serializes packages so locally set gate variables cannot race
        # two packages' fixture cleanups on one scratch database.
        run: go test ./... -count=1 -p 1
      - name: Web packages (typecheck and Node 22 suite)
        working-directory: web
        # setup-node pins Node 22, whose type stripping of the packages' .ts
        # sources is on by default (22.18 and later point releases), so the
        # packages' test and typecheck scripts run as written.
        #
        # The design system's real-browser leg drives google-chrome headless
        # over the DevTools protocol and, because CI is set on this runner, it
        # FAILS the job instead of skipping when the binary is missing: a
        # skipped gate is a failed gate. The runner image is expected to ship
        # google-chrome; this check names it, so an image without one fails
        # here, naming what is missing.
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome is missing from the runner image: the design system's browser leg requires it (that leg fails rather than skip in CI)" >&2
            exit 1
          fi
          # The evidence of the browser leg should name the browser that ran
          # it: print the version before the suite starts.
          google-chrome --version
          # web/node_modules exists already: the install step above the bun
          # drift gate made it. This loop stays the one typecheck and test
          # pass over every web package.
          checked=0
          for dir in packages/*/ apps/*/; do
            [ -f "$dir/package.json" ] || continue
            name="$(basename "$dir")"
            if grep -q '"typecheck"[[:space:]]*:' "$dir/package.json"; then
              npm --prefix "$dir" run typecheck
            elif find "$dir" -path '*/node_modules' -prune -o -name '*.ts' -print | grep -q .; then
              echo "$name has TypeScript sources but no typecheck script; add one" >&2
              exit 1
            else
              echo "$name: nothing to typecheck"
            fi
            if grep -q '"test"[[:space:]]*:' "$dir/package.json"; then
              npm --prefix "$dir" test
              checked=$((checked + 1))
            elif [ -d "$dir/test" ]; then
              echo "$name has a test directory but no test script; add one" >&2
              exit 1
            fi
          done
          if [ "$checked" -lt 1 ]; then
            echo "no web package ran a test suite; the loop above is broken" >&2
            exit 1
          fi
