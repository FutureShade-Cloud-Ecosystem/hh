name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'qa/**'

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: App Shape check
        run: bash scripts/check-shape.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Test and manifest drift gate
        run: |
          bun test
          bun scripts/generate-manifest.ts --check
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OpenAPI contract checks (repo-local)
        run: |
          npm --prefix core/api/tools ci
          node core/api/tools/merge.mjs
          git diff --exit-code -- core/api/openapi.yaml
          node core/api/tools/statemap.mjs
          node core/api/tools/d8-isolation.mjs
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Build and vet core
        working-directory: core
        run: |
          go build ./...
          go vet ./...
