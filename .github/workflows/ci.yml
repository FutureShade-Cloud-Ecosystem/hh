name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'qa/**'
      - 'till/**'
      - 'quote/**'

# Why till/** sits on the push trigger (the W5 review's P2-3): the
# pull_request event cannot run when the pull request's merge ref cannot
# be built, which is the normal state of a stacked cycle branch mid-cycle
# (its base moves under it and the pull request reads conflicting). A push
# run executes on the branch head directly, its check runs attach to that
# head, and the pull request's checks tab shows them, so both jobs, the
# demo job among them, run for the cycle's branches without waiting on a
# clean merge. The demo job's first runs are read, not relied on.
permissions:
  contents: read
  id-token: write

# A newer push to the same pull request cancels the older run, so superseded
# runs stop holding the organisation's concurrent job slots. Runs on main and
# on the qa, till and quote branches are not cancelled once they are running,
# but the group still holds one running and one pending run: a newer run that
# arrives while an older one is pending replaces the pending one, so a run on
# one of those branches can be dropped before it starts.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Go, contract and gate half of the old single ci job. The web suite runs in
  # the web shards below; the ci job at the end gathers both into the one check
  # the principal's gate and every lane read.
  core:
    name: core, contract and gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Schema freeze check
        run: |
          set -euo pipefail
          marker=core/db/SCHEMA-FROZEN
          if [ ! -f "$marker" ]; then
            echo "Schema freeze marker $marker is absent: the freeze is not in effect, passing."
            exit 0
          fi
          freeze_commit="$(tr -d '[:space:]' < "$marker")"
          if [ -z "$freeze_commit" ]; then
            echo "Schema freeze marker $marker is present but empty; it must hold the freeze commit id." >&2
            exit 1
          fi
          if ! git cat-file -e "$freeze_commit^{commit}" 2>/dev/null; then
            echo "Schema freeze marker names commit $freeze_commit, which is not in this checkout. The job fetches with fetch-depth: 0, so the marker content is wrong." >&2
            exit 1
          fi
          changed="$(git diff --name-only "$freeze_commit"..HEAD -- core/db/migrations/)"
          if [ -z "$changed" ]; then
            echo "No changes under core/db/migrations/ since freeze commit $freeze_commit: passing."
            exit 0
          fi
          # The escape hatch is scoped to this change's own diff: a PORTED.md
          # edit made earlier (a merged port, or a ledger note) must never
          # open the hatch for an unrelated later migration change.
          pr_base="${{ github.event.pull_request.base.sha }}"
          push_before="${{ github.event.before }}"
          ledger_base="$freeze_commit"
          if [ -n "$pr_base" ] && git cat-file -e "$pr_base^{commit}" 2>/dev/null; then
            ledger_base="$(git merge-base "$pr_base" HEAD)"
          elif [ -n "$push_before" ] && [ "$push_before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$push_before^{commit}" 2>/dev/null; then
            ledger_base="$(git merge-base "$push_before" HEAD)"
          fi
          # The escape hatch is coverage, not co-occurrence: the change's own
          # PORTED.md diff must NAME every changed migration file, so a pull
          # request that merely introduces or reformats the ledger cannot
          # smuggle an unrelated migration past the freeze.
          ledger_adds="$(git diff "$ledger_base"..HEAD -- core/db/PORTED.md | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
          uncovered=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! printf '%s\n' "$ledger_adds" | grep -qF "$(basename "$f")"; then
              uncovered="$uncovered $f"
            fi
          done <<< "$changed"
          if [ -z "$uncovered" ]; then
            echo "Changes under core/db/migrations/ since freeze commit $freeze_commit are covered by core/db/PORTED.md ledger entries carried in the same change:"
            printf '%s\n' "$ledger_adds"
            exit 0
          fi
          echo "Schema freeze violated: files changed under core/db/migrations/ after freeze commit $freeze_commit with no PORTED.md coverage:" >&2
          echo "$uncovered" >&2
          echo "Only an HH-3.7 port may change core/db/migrations/ after the freeze, and only in a pull request whose PORTED.md ledger diff names every changed file." >&2
          exit 1
      - name: App Shape check
        run: bash scripts/check-shape.sh
      - name: Scope gate
        # No file names the old npm scope outside the one history note, and
        # no web workspace package is named outside @hardscapehouse/
        # (HH-30, docs/scope-rename-history.md).
        run: bash scripts/check-scope.sh
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the web workspace
        # The web install precedes the bun drift gate: the gate's bun test
        # discovers the web packages' suites under the workspace, and those
        # suites (and the packages they run) resolve sibling and vendored
        # packages by name through web/node_modules. Installing only inside
        # the web loop left the gate first in line, so a fresh clone, which
        # has no web/node_modules, failed the gate with "Cannot find module"
        # once web packages imported each other by name. The loop below
        # remains the ONE typecheck and test pass over every web package;
        # it no longer installs, it consumes the install made here.
        run: npm --prefix web ci
      - name: Test and manifest drift gate
        run: |
          set -euo pipefail
          # The web workspace is installed by the step above: the web
          # packages' suites import @hardscapehouse/api-client by its bare name, and on a
          # fresh checkout there is no web/node_modules to resolve it from
          # until npm ci has linked the workspace. Without that install the
          # gate goes red on every fresh runner while passing on a
          # workstation that still holds the last install. This gate does not
          # install; it consumes the install the step above made.
          # Pre-install the one npm package the gate needs, pinned to the exact
          # version the contract tools' lockfile installs, so the gate never
          # relies on bun's on-demand auto-install (which resolves unpinned).
          # The install needs a package.json at the tree's root, which this
          # repository deliberately does not carry, so bun writes one along
          # with bun.lock; the trap removes both (and the installed
          # node_modules) when the step ends, leaving the tree clean on a
          # runner and on a workstation alike.
          trap 'rm -rf package.json bun.lock node_modules' EXIT
          bun add --exact yaml@2.9.1
          bun test
          bun scripts/generate-manifest.ts --check
      - name: OpenAPI contract checks (repo-local)
        run: |
          npm --prefix core/api/tools ci
          node core/api/tools/merge.mjs
          git diff --exit-code -- core/api/openapi.yaml
          node core/api/tools/gen-types.mjs
          node core/api/tools/parity.mjs
          node core/api/tools/fixtures.mjs
          node core/api/tools/statemap.mjs
          node core/api/tools/d8-isolation.mjs
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Build and vet core
        working-directory: core
        run: |
          go build ./...
          go vet ./...
      - name: Format check (gofmt)
        working-directory: core
        # gofmt reads build tagged files whatever the tags, so drift in the
        # demo and integration tagged files shows here too. Lists the files
        # that differ and fails when there are any.
        run: |
          set -euo pipefail
          drift="$(gofmt -l .)"
          if [ -n "$drift" ]; then
            echo "gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi
      - name: Vulnerability scan (govulncheck)
        working-directory: core
        # Reachable vulnerabilities in the standard library at the pinned
        # toolchain or in a required module fail the job (exit 3).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: SQL uuid guard (no <> '' beside a ::uuid cast of the same parameter)
        working-directory: core
        # A parameter guarded by <> '' beside a ::uuid cast of itself fails with invalid input syntax
        # for type uuid once the planner casts it inside an index condition (PR 585). The test walks
        # every Go file under core and names the file and line of each statement; the same test also
        # runs inside the untagged suite below, so this step only gives the failure a name.
        run: go test -count=1 ./internal/platform/uuidguard/
      - name: Test core
        working-directory: core
        # The untagged suite. The database-gated legs skip politely here
        # (no gate variables in CI, zero secrets in the workflow); -p 1
        # serializes packages so locally set gate variables cannot race
        # two packages' fixture cleanups on one scratch database.
        # -timeout 30m is explicit: Go's default is ten minutes a
        # package, and the slowest packages sit close under that limit
        # (the integration tag's cmd/core measured 470 to 711 seconds on
        # HQ). The default ok lines print every package's elapsed time
        # and stay in the log, so growth shows before it bites.
        run: go test ./... -count=1 -p 1 -timeout 30m
      - name: Evening guard, the date sensitive unit packages
        # Item 55's guard: the date sensitive legs rerun every run with the clock pinned inside
        # the evening window (half past UTC midnight, where the UTC day has rolled over and the
        # house zone is still on the dealer's previous evening), so a daytime run can never
        # again hide the UTC day class. The pin is a go build overlay that shifts the wall
        # clock only (scripts/evening-guard/prepare.sh); monotonic clocks, timers and deadlines
        # are untouched. prepare.sh also snapshots the active toolchain outside the module
        # cache and hands back a wrapper go pinned to it, because a runner's active toolchain
        # can live inside GOMODCACHE (GOTOOLCHAIN auto) and go refuses overlays that replace
        # files beneath it. HH_EVENING_GUARD wakes the self proof legs in
        # internal/platform/houseday, which fail the step if the overlay stopped applying, so
        # the guard cannot silently guard nothing. The four packages are the date sensitive
        # ones, named with the reason in the PR body; the rest of the suite pins its own
        # calendar instants or reads no day at all.
        working-directory: core
        run: |
          set -euo pipefail
          ../scripts/evening-guard/prepare.sh "$RUNNER_TEMP/evening-guard"
          shift_s="$(../scripts/evening-guard/shift.sh evening)"
          GOFLAGS="-overlay=$RUNNER_TEMP/evening-guard/overlay.json" \
            HH_CLOCK_SHIFT_SECONDS="$shift_s" HH_EVENING_GUARD=1 \
            "$RUNNER_TEMP/evening-guard/go" test ./internal/platform/houseday ./internal/billing ./internal/pos ./internal/purchasing \
            -count=1 -p 1 -timeout 30m

  # The web suite, split into parallel shards by measured weight
  # (web/scripts/ci-web-shards.mjs lists the packages at run time, places the
  # heavy ones from its weight table and bin packs the rest; Quote Desk's and
  # Counter Till's Playwright runs split further with --shard=k/m). Every
  # package lands in exactly one shard, a package missing from the weight table
  # still lands in one, and the script prints the whole assignment first.
  #
  # The design system's real-browser leg drives google-chrome headless over the
  # DevTools protocol and, because CI is set on this runner, it FAILS instead of
  # skipping when the binary is missing: a skipped gate is a failed gate. The
  # script checks google-chrome in the shard that holds the design system and
  # prints its version. setup-node pins Node 22, whose type stripping of the
  # packages' .ts sources is on by default (22.18 and later point releases), so
  # the packages' test and typecheck scripts run as written.
  web:
    name: web shard ${{ matrix.shard }} of 6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the web workspace
        run: npm --prefix web ci
      - name: Install the contract tools
        # The api-client package's idempotence test runs the client generator
        # (scripts/gen-client/gen-client.mjs), which needs the contract tools'
        # dependencies (the yaml package); the single job had them from its
        # contract step, so each shard installs them itself.
        run: npm --prefix core/api/tools ci
      - name: Shard assignment test
        working-directory: web
        run: node --test scripts/ci-web-shards.node-test.mjs
      - name: Web packages (typecheck and Node 22 suite), shard ${{ matrix.shard }} of 6
        working-directory: web
        run: node scripts/ci-web-shards.mjs run ${{ matrix.shard }} 6

  # The one check the gate reads. It needs every job in this file (core, web,
  # demo and integration; add a new job here too) and fails unless each
  # finished with success: a skipped or cancelled shard fails it, never passes it.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [core, web, demo, integration]
    if: always()
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')"
          if [ -n "$bad" ]; then
            echo "not successful: $bad" >&2
            exit 1
          fi

  # The demo tag, and the gated legs whose absence the cycle recorded: the
  # demo tag never compiled or ran in CI, and the composition and identity
  # suites' database legs skipped politely in the core job above because no
  # gate variable was set. This job sets them, against one throwaway
  # Postgres service, and migrates the scratch databases the identity
  # suites expect (their fixtures plant rows and read migration-planted
  # catalogue rows, so each gate variable points at an already-migrated
  # database of its own).
  #
  # The ci job above needs this job, so a red or unfinished demo job holds
  # the one required status (the ci job) red or pending.
  demo:
    name: demo tag and the gated database legs
    runs-on: ubuntu-latest
    services:
      postgres:
        # The official image, pulled through Google's mirror of the Docker
        # official images (mirror.gcr.io) so the hosted runners hit neither
        # Docker Hub's anonymous pull limit (PRs 290 and 291) nor Amazon ECR
        # Public's data limit (PRs 312, 315 and 316 failed at "Initialize
        # containers" with toomanyrequests before any code ran). The pin is
        # the index digest docker.io serves for 16-alpine (16.15 on alpine
        # 3.24), so the bytes are the ones every earlier run used.
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: till_base
        ports:
          - 5599:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BASE: postgres://postgres:postgres@127.0.0.1:5599
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Vet and build both tag shapes
        working-directory: core
        run: |
          go vet ./...
          go vet -tags demo ./...
          go build -tags demo ./...
      - name: Create and migrate the scratch databases the gated legs share
        working-directory: core
        run: |
          set -euo pipefail
          psql "$BASE/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE till_core_gate' \
            -c 'CREATE DATABASE till_b3_gate' \
            -c 'CREATE DATABASE till_b4_gate'
          for name in till_core_gate till_b3_gate till_b4_gate; do
            DATABASE_URL="$BASE/$name?sslmode=disable" go run ./cmd/core migrate
          done
      - name: Untagged suite with the gate variables set
        working-directory: core
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_base?sslmode=disable
          HH_CORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_core_gate?sslmode=disable
          HH_B3_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_b3_gate?sslmode=disable
          # The B4 population proofs run on till_b4_gate, a database of their
          # own migrated above. They assert exact world counts, so the legs
          # set the migrations' planted users, roles, grants, portal row and
          # registry drivers aside for each run and put them back after.
          HH_B4_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_b4_gate?sslmode=disable
        # -timeout 30m as on every go test step here: Go's default is
        # ten minutes a package and the slowest packages sit close under
        # it; the default ok lines keep every package's elapsed time in
        # this log.
        run: go test ./... -count=1 -p 1 -timeout 30m
      # The demo world proofs (TestDemoWorld_Quotes, TestDemoWorld_CounterTill)
      # gate on their own throwaway Postgres: a database made fresh here for
      # the next step alone and shared with no other leg. The proofs build
      # and drop their own databases beside it on this service.
      - name: Create the fresh database for the demo world proofs
        run: |
          set -euo pipefail
          psql "$BASE/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE hh_demo_world_proof'
      - name: Demo tag suite with the gate variable set
        working-directory: core
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_base?sslmode=disable
          HH_CORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_core_gate?sslmode=disable
          HH_TILL_DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/hh_demo_world_proof?sslmode=disable
        # -timeout 30m as on every go test step here: Go's default is
        # ten minutes a package and the slowest packages sit close under
        # it; the default ok lines keep every package's elapsed time in
        # this log.
        run: go test -tags demo ./... -count=1 -p 1 -timeout 30m
      # The step above runs quiet, so a skipped world proof would hide in it.
      # This one runs the world proofs alone, verbosely, and fails unless each
      # PASS, and none SKIPs, so the log shows them passing. It reuses the
      # fresh database from the step before the suite: the proofs build and
      # drop their own databases beside it, so a second run does not collide.
      # The -timeout 30m matches the suite steps, and -v's ok line keeps
      # this package's elapsed time in the log this step already tees.
      - name: Demo world proofs, verbose, and not skipped
        working-directory: core
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_base?sslmode=disable
          HH_CORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/till_core_gate?sslmode=disable
          HH_TILL_DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/hh_demo_world_proof?sslmode=disable
        run: |
          set -euo pipefail
          go test -tags demo ./cmd/core -run 'TestDemoWorld_(Quotes|CounterTill|Controller|ControllerGuards|ControllerApprovalsCursor|ControllerParkFilesInOneTransaction|ControllerRecurringRunRefusedOverTheThreshold|DriverRunOutForDelivery|DriverRunDispatchedByAPersona|DriverRunPayloadsCarryNoMoney|DriverRunReachesTheSyncPull|NoSeededRowIsUnsequenced|SeededRowsReachTheDeviceFeeds|SeqRepairListMatchesTheSchema|SeqRepairSecondApplyDrawsNothing)$' -count=1 -v -timeout 30m 2>&1 | tee "$RUNNER_TEMP/demo-world-proofs.txt"
          if grep -q -e '--- SKIP' "$RUNNER_TEMP/demo-world-proofs.txt"; then
            echo "a demo world proof was skipped" >&2
            exit 1
          fi
          for name in TestDemoWorld_Quotes TestDemoWorld_CounterTill TestDemoWorld_Controller TestDemoWorld_ControllerGuards TestDemoWorld_ControllerApprovalsCursor TestDemoWorld_ControllerParkFilesInOneTransaction TestDemoWorld_ControllerRecurringRunRefusedOverTheThreshold TestDemoWorld_DriverRunOutForDelivery TestDemoWorld_DriverRunDispatchedByAPersona TestDemoWorld_DriverRunPayloadsCarryNoMoney TestDemoWorld_DriverRunReachesTheSyncPull TestDemoWorld_NoSeededRowIsUnsequenced TestDemoWorld_SeededRowsReachTheDeviceFeeds TestDemoWorld_SeqRepairListMatchesTheSchema TestDemoWorld_SeqRepairSecondApplyDrawsNothing; do
            if ! grep -q -e "--- PASS: $name " "$RUNNER_TEMP/demo-world-proofs.txt"; then
              echo "$name did not pass" >&2
              exit 1
            fi
          done
      # The demo image build, no push and no secrets. Nothing built the image
      # in CI, so a Dockerfile, .dockerignore or web import break (the drive
      # app importing a statechart the context excluded) went unseen until a
      # hand build. The step runs on every run of this job, so a change to
      # anything the image reads is caught without a path filter. The four
      # base images come through Google's mirror of the Docker official
      # images, as the postgres service above does, and are tagged to the
      # names the Dockerfile uses, so the build pulls nothing from Docker Hub
      # (keep the list in step with the FROM lines of deploy/demo/Dockerfile).
      - name: Pull the demo image's base images through the mirror
        run: |
          set -euo pipefail
          docker pull mirror.gcr.io/library/golang@sha256:f2c872bcee949b7be9c490efd02b48a8a2fbf947cdf533f1c58525ec9d8170fd
          docker tag mirror.gcr.io/library/golang@sha256:f2c872bcee949b7be9c490efd02b48a8a2fbf947cdf533f1c58525ec9d8170fd golang:1.27-alpine
          for img in node:22-alpine caddy:2.10.2 alpine:3.20; do
            docker pull "mirror.gcr.io/library/$img"
            docker tag "mirror.gcr.io/library/$img" "$img"
          done
      - name: Build the demo image, no push
        run: docker build -f deploy/demo/Dockerfile -t hh-demo-ci-build .
      # The denylist scan (check 5.1 of the image exit test) over the web
      # bundles this very image carries, so no second build is added: the
      # image's /srv/app is copied out of a created, never started, container
      # and scanned as a bundle directory. Any first dealer word or planted
      # person name in a built bundle fails the pull request here.
      - name: Scan the demo image's web bundles for the denylist
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cid="$(docker create hh-demo-ci-build)"
          docker cp "$cid:/srv/app/." "$out"
          docker rm "$cid" >/dev/null
          ./deploy/demo/denylist-scan.sh --bundle-dir "$out"
      - name: Denylist scan script test
        run: sh deploy/demo/denylist-scan-test.sh
      # The integration tag suite runs in its own job beside this one
      # (HH-191): the composition fixture's migration glob, the break
      # that kept the suite out of this job, is fixed there, along with
      # the printing, reporting and warranty-path breaks the S1 reviews
      # and the coder's run recorded. The packages the suite cannot yet
      # carry are recorded in docs/BLOCKERS.md and named inside that
      # job's test step; the rest of the suite runs there, on its own
      # scratch databases.

  # The integration tag suite, the leg the note above promised once the
  # composition fixture's glob was fixed: the modules' database legs
  # (tenant, invariant, gl, pricing, inventory, order, the sync harness,
  # reporting, printing, warranty) plus the demoseed composition legs,
  # none of which ran in ci before HH-191. The module legs read
  # DATABASE_URL, and their fixtures assume the migrated-and-seeded
  # shape: a dozen suites read the catalogue, branches and users the
  # seed role plants, and fail or skip without them, so the gate
  # database is migrated from zero and then seeded. The composition legs
  # read HH_CORE_TEST_DATABASE_URL on a database of their own, migrated
  # only: the composition kit plants fixture branches and fixture users
  # that persist beside the migration-planted rows for the rest of the
  # run, and the module legs' database must reflect the migrations and
  # the seed alone (the tree keeps the same separation everywhere: the
  # demo world leg's gate comment states it). The demoseed legs need no
  # gate database at all: each builds one from zero off the DATABASE_URL
  # server, which the service allows.
  #
  # Like the demo job, the ci job above needs this job.
  integration:
    name: integration tag suite on a migrated and seeded database
    runs-on: ubuntu-latest
    services:
      postgres:
        # The official image, pulled through Google's mirror of the Docker
        # official images (mirror.gcr.io) so the hosted runners hit neither
        # Docker Hub's anonymous pull limit (PRs 290 and 291) nor Amazon ECR
        # Public's data limit (PRs 312, 315 and 316 failed at "Initialize
        # containers" with toomanyrequests before any code ran). The pin is
        # the index digest docker.io serves for 16-alpine (16.15 on alpine
        # 3.24), so the bytes are the ones every earlier run used.
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5599:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BASE: postgres://postgres:postgres@127.0.0.1:5599
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The assist parity path rule diffs against the pull request's base commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Pin the Postgres client tools to the server's major (16)
        # The reset legs dump a world with pg_dump and restore it with psql into the
        # Postgres 16 service above, the way the finance box does on Postgres 16. A
        # runner whose default client is newer writes settings a 16 server does not
        # know (pg_dump 17 writes SET transaction_timeout), so the job pins the
        # client to the server's own major, and a runner upgrade cannot move it.
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/psql --version
      - name: Vet the integration tag shape
        # Repository-wide under the tag, which includes every package
        # the suite step below leaves out: one stray field in one
        # integration file keeps every package from compiling under the
        # tag (the printing receipt legs' CostCents break did exactly
        # that, invisible to a ci that never built the tag).
        working-directory: core
        run: go vet -tags integration ./...
      - name: Create, migrate and seed the suite's two scratch databases
        working-directory: core
        run: |
          set -euo pipefail
          psql "$BASE/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE integration_gate' \
            -c 'CREATE DATABASE integration_core_gate'
          # The module gate is seeded and the composition gate is not,
          # on purpose: the module suites' fixtures read the dibbits
          # catalogue and demo users the seed plants, while the
          # composition kit builds its own fixture world beside the
          # migrations and must not sit inside the seed's.
          DATABASE_URL="$BASE/integration_gate?sslmode=disable" go run ./cmd/core migrate
          DATABASE_URL="$BASE/integration_gate?sslmode=disable" go run ./cmd/core seed
          DATABASE_URL="$BASE/integration_core_gate?sslmode=disable" go run ./cmd/core migrate
      - name: Integration tag suite with the gate variables set
        working-directory: core
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/integration_gate?sslmode=disable
          HH_CORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/integration_core_gate?sslmode=disable
          # HH_TILL_DEMO_TEST_DATABASE_URL stays unset, on purpose: the
          # demo world proof gates on its own throwaway Postgres and its
          # legs skip politely without it.
          # HH_B3_TEST_DATABASE_URL stays unset because the demo job sets
          # it for untagged legs this job does not repeat, and HH_B4_ is set
          # there for the same reason (its legs are untagged). KIT_
          # variables are set by no job at all, so the kit's one
          # database-backed proof skips everywhere (its untagged file
          # runs in the ci and demo jobs; only that proof gates on
          # KIT_TEST_DATABASE_URL).
        run: |
          set -euo pipefail
          # No package is left out: every recorded-red package has landed its
          # fix and rejoined the run (docs/BLOCKERS.md keeps the history).
          # -p 1 for the same reason the ci job's untagged run carries
          # it: the module packages share the gate database, and
          # serialized packages cannot race one another's fixture
          # cleanups.
          # The timeout is explicit because Go's default is ten minutes
          # a package and this tag's slowest package, cmd/core,
          # measured 470 to 711 seconds on HQ, close enough under the
          # limit that ordinary growth would read as a hang. 30m holds
          # the whole suite clear of it, and the default ok lines print
          # every package's elapsed time, so growth shows in this log
          # before it bites.
          go test -tags integration -p 1 -count=1 -timeout 30m \
            $(go list ./...)
      - name: Assist parity path rule (the suite must pass and not be skipped)
        # Per record parity of the assistant's views against the order module's own record read, and the
        # red team cases, on the migrated and seeded gate database. A change to any file named in
        # core/internal/assist/parity/visibility_files.txt (the functions that decide what an asker may
        # see) cannot merge with the suite red or skipped; the script prints which files a change touched.
        # It needs the base commit to diff against, so the checkout above is deep.
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5599/integration_gate?sslmode=disable
        run: scripts/ci/assist-parity-path-rule.sh "${{ github.event.pull_request.base.sha }}" core
      - name: Evening guard, the date sensitive integration packages
        # The integration half of item 55's guard: the same date sensitive packages as the ci
        # job's guard step, under the integration tag, rerun against a database whose own
        # clock sits in the same evening window as the Go clock, or a fixture seeded from
        # now() or CURRENT_DATE and read through the house day would fail for the wrong
        # reason. A service container's clock cannot be shifted in place, so this step runs
        # its own throwaway Postgres under libfaketime, pinned to the same target instant as
        # the Go overlay, and couples the overlay's shift to that database's pinned clock
        # (both clocks then advance at real speed, so they stay in step for the whole run).
        # The database proof leg in internal/platform/houseday (HH_EVENING_GUARD) fails the
        # step if either half of the pin stopped applying.
        working-directory: core
        env:
          GUARD: postgres://postgres:postgres@127.0.0.1:5601
        run: |
          set -euo pipefail
          docker rm -f -v hh-evening-guard-pg >/dev/null 2>&1 || true
          trap 'docker rm -f -v hh-evening-guard-pg >/dev/null 2>&1 || true' EXIT
          ../scripts/evening-guard/prepare.sh "$RUNNER_TEMP/evening-guard"
          target="$(date -u +%s)"
          # The most recent half past UTC midnight that has already passed, never the
          # one still ahead of the real clock. A pin ahead of the real clock keeps this
          # libfaketime build's Postgres from firing its SIGALRM timeouts at all
          # (statement_timeout, lock_timeout and the deadlock detector ride the same
          # timer), so the purchasing deadlock legs wait out their own deadlines
          # instead of answering the contention sentinel: every CI failure of this
          # step reached it inside the only window whose pin sits ahead of the real
          # clock, before half past UTC midnight. Pinned behind the real clock every
          # timer fires on time, and the guard keeps the same evening window, anchored
          # to the most recent half past midnight instead of the current UTC day's.
          target=$(( (target - 1800) / 86400 * 86400 + 1800 ))
          pin="$(date -u -d "@$target" '+%Y-%m-%d %H:%M:%S')"
          # The same digest pinned mirror the services above use (the registries with pull
          # limits refuse the runners), so the guard pulls what the jobs already pull; the
          # faketime package is version pinned to the Alpine release this digest ships.
          docker run -d --name hh-evening-guard-pg -p 127.0.0.1:5601:5432 \
            -e POSTGRES_PASSWORD=postgres -e TZ=UTC \
            -e LD_PRELOAD=/usr/lib/faketime/libfaketime.so.1 \
            -e FAKETIME="@$pin" -e FAKETIME_NO_CACHE=1 \
            mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea \
            sh -c 'apk update >/dev/null && apk add --no-cache "libfaketime=0.9.13-r0" >/dev/null && exec docker-entrypoint.sh postgres' >/dev/null
          shift_s="$(../scripts/evening-guard/shift.sh "$GUARD/postgres?sslmode=disable")"
          psql "$GUARD/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE integration_gate' \
            -c 'CREATE DATABASE integration_core_gate'
          # The gate databases are built under the same pinned clock the legs run under, so
          # the seed's days sit inside the window too. Every go command runs through the
          # wrapper prepare.sh wrote (the toolchain snapshot pinned with GOTOOLCHAIN=local),
          # because this step's overlay must not point inside the module cache.
          GOFLAGS="-overlay=$RUNNER_TEMP/evening-guard/overlay.json" HH_CLOCK_SHIFT_SECONDS="$shift_s" \
            DATABASE_URL="$GUARD/integration_gate?sslmode=disable" "$RUNNER_TEMP/evening-guard/go" run ./cmd/core migrate
          GOFLAGS="-overlay=$RUNNER_TEMP/evening-guard/overlay.json" HH_CLOCK_SHIFT_SECONDS="$shift_s" \
            DATABASE_URL="$GUARD/integration_gate?sslmode=disable" "$RUNNER_TEMP/evening-guard/go" run ./cmd/core seed
          GOFLAGS="-overlay=$RUNNER_TEMP/evening-guard/overlay.json" HH_CLOCK_SHIFT_SECONDS="$shift_s" \
            DATABASE_URL="$GUARD/integration_core_gate?sslmode=disable" "$RUNNER_TEMP/evening-guard/go" run ./cmd/core migrate
          # The package list is the date sensitive four plus every package whose integration legs
          # seed invoices (FROM-PRINCIPAL 255 P1 and 261), plus messaging (its Mentions badge reads the
          # dealer's day, MAIN-RED-2) and assist/parity (RedTeam9 plants and analyzes its own world,
          # FLAKE-9), in go list order: the packages share one seeded gate database and run in the
          # order the integration job's $(go list ./...) runs them, so a package sees the leftovers the
          # same neighbours leave in both jobs. A fixture that dates a document from the session's
          # CURRENT_DATE, the UTC day, is one day ahead of the dealer's day under this pin, so a leg
          # reading date sensitive figures off it fails here instead of at a chance evening run of the
          # main integration job. cmd/core's legs seed invoices too, but its integration suite alone is
          # about half of this step's whole time budget, so it stays on the main integration job; its
          # own fixtures take the dealer's day.
          # -timeout 30m as on every go test step in this file.
          GOFLAGS="-overlay=$RUNNER_TEMP/evening-guard/overlay.json" HH_CLOCK_SHIFT_SECONDS="$shift_s" HH_EVENING_GUARD=1 \
            DATABASE_URL="$GUARD/integration_gate?sslmode=disable" \
            HH_CORE_TEST_DATABASE_URL="$GUARD/integration_core_gate?sslmode=disable" \
            "$RUNNER_TEMP/evening-guard/go" test -tags integration ./internal/assist/adapters ./internal/assist/parity ./internal/billing ./internal/finstmt ./internal/gl ./internal/load ./internal/messaging ./internal/order ./internal/payments ./internal/platform/houseday ./internal/portal ./internal/pos ./internal/printing ./internal/purchasing ./internal/quote ./internal/sync ./internal/tax ./internal/till \
            -count=1 -p 1 -timeout 30m
