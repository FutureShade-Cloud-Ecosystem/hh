<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page's own referrer policy, in the document beside the response
         header the deployed copy carries. Both layers stay: a meta tag is
         each browser's own read and not a guarantee across engines, while the
         header is the layer the server controls. The policy covers fetches
         and documents, not every subresource: a font a stylesheet loads was
         measured carrying the full address in its Referer with the policy in
         place. What keeps that request clean is the scrub, so taking the
         query out of the address bar must stay the first act of the boot.
         The set password page's link carries a one time secret in its query,
         and no Referer may carry it anywhere. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <!-- The badge favicons, generated from the measured
         badge-on-yellow SVG (public/favicons/, the same set the design system
         package carries). Root absolute like every public asset the apps
         reference; Vite carries the app's base into the built href. -->
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="icon" href="/favicons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicons/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />
  </head>
  <body>
    <fd-app-root></fd-app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
