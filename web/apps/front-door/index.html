<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page's own referrer policy, in the document as a second line of
         defence behind the response header the deployed copy carries (the
         header is the policy's real home: the browser begins fetching the
         page's own modules before a meta tag late in the head is parsed). The
         set password page's link carries a one time secret in its query, and
         no Referer may carry it anywhere. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <!-- The badge favicons, generated from the measured
         badge-on-yellow SVG (public/favicons/, the same set the design system
         package carries). Root absolute like every public asset the apps
         reference; Vite carries the app's base into the built href. -->
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="icon" href="/favicons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicons/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicons/favicon-512.png" />
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png" />
  </head>
  <body>
    <fd-app-root></fd-app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
