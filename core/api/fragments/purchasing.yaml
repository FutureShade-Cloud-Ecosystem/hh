# Fragment: purchasing + landedcost.
# Source: hardscapeos_dibbits/backend/internal/purchasing and internal/landedcost
# (non-test Go files). Guards resolve from the RegisterRoutes call sites in
# backend/cmd/server/main.go: both modules receive identityHandler.RequireStaff,
# RequireManager and RequireAdmin in parameter order, so the module-internal
# requireStaff / requireManager / requireAdmin names map one to one.
#
# The cost gate (purchasing/cost_gate.go) is a marshal-layer gate, not a route
# gate: money keys are ABSENT from read payloads for callers the branch
# cost_visibility policy refuses, never zero and never null. Every gated money
# property below is optional for that reason.

paths:
  /api/v1/purchasing/vendors:
    get:
      operationId: purchasingListVendors
      tags: [staff-purchasing]
      summary: List vendors from the vendor directory projection
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of vendors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingVendorPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: purchasingCreateVendor
      tags: [staff-purchasing]
      x-addition: "the vendor create route of the roles roadmap's Buying and Stock core slice; no ERP source route"
      summary: Create a vendor
      description: >-
        The vendor number is minted server side (VM- and digits, a shape the
        load doors refuse as a legacy key) and is never accepted
        from the caller. The record is created active under the caller's
        org; the ordering email rides the record as the remit fallback
        the outbound send's address book reads.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingCreateVendorRequest"
      responses:
        "201":
          description: The created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingVendorMaster"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/purchasing/vendors/{vendorID}:
    put:
      operationId: purchasingUpdateVendor
      tags: [staff-purchasing]
      x-addition: "the vendor edit route of the roles roadmap's Buying and Stock core slice; no ERP source route"
      summary: Correct one vendor's record
      description: >-
        Every field is optional and absent means unchanged; an empty
        order_email clears the fallback address. The vendor number is
        not editable. A vendor another org owns answers 404 like an unknown
        id; a carried vendor with no org yet is claimed for the caller's org by
        its first edit.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: vendorID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingUpdateVendorRequest"
      responses:
        "200":
          description: The vendor after the corrections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingVendorMaster"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/purchasing/vendors/{vendorID}/t5018:
    put:
      operationId: purchasingSetVendorT5018
      tags: [staff-purchasing]
      x-addition: "the T5018 subcontractor mark of row 153; no ERP source route"
      summary: Set one vendor's T5018 subcontractor mark and business number
      description: >-
        The Financial Controller's own mark on a vendor, and the contractor's
        CRA business number. is_subcontractor is required: the mark is what the
        year's T5018 report filters on, so a body that does not say what the
        mark is names nothing to set. business_number is optional; absent
        leaves it as it stands and an empty string clears it. The wall is the
        role gate's: this route names money-desk at admin, and the Financial
        Controller is the matrix's only admin seat on money-desk, so every other
        role is refused with the shared body before the handler runs. A vendor
        another org owns answers 404 like an unknown id.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: admin
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: vendorID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingSetVendorT5018Request"
      responses:
        "200":
          description: The vendor after the mark was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingVendorMaster"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/purchasing/pos:
    get:
      operationId: purchasingListPOs
      tags: [staff-purchasing]
      summary: List purchase orders
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PurchasingPOStatus"
      responses:
        "200":
          description: The page of purchase orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPOPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: purchasingCreatePO
      tags: [staff-purchasing]
      summary: Create a draft purchase order
      description: >-
        The PO number is minted server-side and is never accepted from a
        caller. A USD document requires a positive fx_rate; an omitted currency
        means CAD at a rate of 1.
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingCreatePORequest"
      responses:
        "201":
          description: The created purchase order with its lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/purchasing/pos/{id}:
    get:
      operationId: purchasingGetPO
      tags: [staff-purchasing]
      summary: Read one purchase order with its lines and receipts
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The purchase order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/purchasing/pos/{id}/lines:
    post:
      operationId: purchasingAddLine
      tags: [staff-purchasing]
      summary: Add a line to a draft purchase order
      description: >-
        Lines may only be edited while the order is DRAFT: once a PO is
        ORDERED its line set is frozen, because a purchase order is a contract
        and editing one after placement is how a three-way match is quietly
        defeated.
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingAddLineRequest"
      responses:
        "200":
          description: The purchase order after the line was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: A line id that is not a uuid, or a quantity beyond what an order line can hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/purchasing/pos/{id}/lines/{lineID}:
    put:
      operationId: purchasingUpdateLine
      tags: [staff-purchasing]
      x-addition: "the draft line correction route of the roles roadmap's Buying and Stock core slice; no ERP source route"
      summary: Correct the quantity or the cost of one line on a draft purchase order
      description: >-
        Each field is optional and absent means unchanged; the product is
        not editable through this route. Lines may only be corrected
        while the order is DRAFT, the same freeze the add and remove
        routes carry.
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
        - name: lineID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingUpdateLineRequest"
      responses:
        "200":
          description: The purchase order after the correction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: A line id that is not a uuid, or a quantity beyond what an order line can hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: purchasingRemoveLine
      tags: [staff-purchasing]
      summary: Remove a line from a draft purchase order
      description: >-
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
        - name: lineID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The purchase order after the line was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: A line id that is not a uuid, or a quantity beyond what an order line can hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/purchasing/pos/{id}/transition:
    post:
      operationId: purchasingTransitionPO
      tags: [staff-purchasing]
      summary: Move a purchase order along its lifecycle
      description: >-
        Operator-driven moves only (place, close, cancel). The receipt-driven
        moves to PARTIAL and RECEIVED are computed from what landed and are
        never requested here.
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingTransitionRequest"
      responses:
        "200":
          description: The purchase order after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/purchasing/pos/{id}/apply-warranty-credit:
    post:
      operationId: purchasingApplyWarrantyCredit
      tags: [staff-purchasing]
      summary: Apply vendor warranty credit to a draft purchase order
      description: >-
        Applies open vendor warranty credit to reduce the net total due on a
        draft purchase order without changing any line unit cost (Ruling R3).
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: applying warranty credit
          is a draft purchase order action for the procurement manager and general manager.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        description: Optional claim id and credit amount to apply
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingApplyWarrantyCreditRequest"
      responses:
        "200":
          description: The purchase order with warranty credit applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Cannot apply warranty credit to the purchase order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/purchasing/pos/{id}/receive:
    post:
      operationId: purchasingReceivePO
      tags: [staff-purchasing]
      summary: Record quantities landing against purchase-order lines
      description: >-
        Line-level receiving: each entry names one PO line and the quantity
        landing now. Stock movement happens through the inventory seam; a
        deployment with that seam unwired refuses rather than recording a
        receipt that would move no stock.
      x-role: requireManager
      x-access:
        surfaces: [yard-pick, buying-and-stock]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingReceiveRequest"
      responses:
        "201":
          description: The recorded receiving event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingReceipt"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/purchasing/pos/{id}/expected-date:
    put:
      operationId: purchasingSetExpectedDate
      tags: [staff-purchasing]
      summary: Set or clear the promised receiving date on a purchase order
      description: >-
        An empty expected_at clears the date: a withdrawn vendor promise
        leaves no date, and a stale one left on the record is a screen that
        lies to the person planning around it. Refused on a RECEIVED, CLOSED
        or CANCELLED order.
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingSetExpectedDateRequest"
      responses:
        "200":
          description: The purchase order after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/purchasing/pos/{id}/delivery-method:
    put:
      operationId: purchasingSetDeliveryMethod
      tags: [staff-purchasing]
      summary: Record or correct how a purchase order's goods reach the yard
      description: >-
        Sets the arrival the purchase order carries, readable on GET
        /api/v1/purchasing/pos/{id}. delivery_method is required: on a
        correction an empty value is a malformed request, not an unrecord,
        and sending UNKNOWN is how an arrival is unrecorded. Refused on a
        RECEIVED, CLOSED or CANCELLED order, the same finished statuses the
        expected-date route refuses. Core's receiving worklist does not
        render the column yet; the DIB-573 read half is unported.
        Walled to the po_writers list: the Procurement Manager, the General
        Manager and the super admin; every other role is refused with the
        shared forbidden body.
      x-role: requireManager
      x-access:
        surfaces: [buying-and-stock]
        level: read
        list: po_writers
        reason: >-
          The po_writers list is the wall, not the level: the General Manager reads the buying
          surface and may still write an order, which a manage level cannot say without
          admitting every manage seat on the surface.
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingSetDeliveryMethodRequest"
      responses:
        "200":
          description: The purchase order after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPODetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/purchasing/pos/{id}/document:
    get:
      operationId: purchasingGetPODocumentHTML
      tags: [staff-purchasing]
      summary: Render the printable purchase-order document
      description: >-
        The body is a rendered HTML page and is not representable from the
        module structs; it is delivered as text/html with Cache-Control
        no-store because the page is rendered through a role gate and a cached
        copy would leak the gated columns.
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The purchase-order document as an HTML page
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/purchasing/pos/{id}/document.csv:
    get:
      operationId: purchasingGetPODocumentCSV
      tags: [staff-purchasing]
      summary: Download the purchase-order document as CSV
      description: >-
        The same document as the HTML route, the other encoder. The body is a
        CSV byte stream and is not representable from the module structs; the
        download filename is the PO number.
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The purchase-order document as CSV
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/purchasing/pos/{id}/costs:
    get:
      operationId: purchasingGetPOCosts
      tags: [staff-purchasing]
      summary: Read the gated money payload of one purchase order on its own
      description: >-
        A surface asks this before it draws a cost column, so "you may not see
        cost" is an answer it receives rather than a conclusion it draws from
        a missing key. For a refused caller the body is an empty object.
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The header money the caller may see, or an empty object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingPOCosts"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/purchasing/pos/{id}/sends:
    get:
      operationId: purchasingListPOSends
      tags: [staff-purchasing]
      summary: List the send history of one purchase order
      x-role: requireStaff
      x-access:
        surfaces: [buying-and-stock]
        level: read
      parameters:
