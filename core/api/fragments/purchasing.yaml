    post:
      operationId: purchasingPayBill
      tags: [staff-purchasing]
      x-addition: "W2-9a round 2: the vendor bill payment door over PayBill; the ERP keyed supplier payments by hand"
      summary: Record a supplier payment against a posted vendor bill
      description: >-
        Idempotent on the required Idempotency-Key header: a re-press under the
        same key returns the first payment and writes nothing. The payment's
        journal is dated by paid_at, absent meaning now in the dealer's house
        zone. A payment over the bill's open balance is refused with nothing
        written, and a bill outside the caller's branch reach answers the same
        404 as a missing bill.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            A key chosen once per payment press and resent unchanged on every
            retry of it. A re-press under the same key answers the first
            payment; the same key on another bill is refused.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchasingPayBillRequest"
      responses:
        "200":
          description: The bill with its instalments after the payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingBillDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/purchasing/ap-aging:
    get:
      operationId: purchasingGetAPAging
      tags: [staff-purchasing]
      x-addition: "W2-9a: the AP aging worklist over open vendor bills and open landed-cost payables in the dealer's house zone, tying to GL 2100; no ERP source route"
      summary: Read the AP aging worklist as of an instant
      description: >-
        Open accounts payable as of an instant in the dealer's house zone,
        absent as_of meaning now. Each vendor row carries its posted bills
        less supplier payments as of the instant, bucketed across the five
        aging buckets, and each open landed-cost payable appears on its own
        row marked as landed cost. A document counts from its posting
        journal's effective instant, the GL's own late filing rule. The
        aging is the subledger: it grows only by posted vendor bills and
        open landed-cost payables, so a 2100 credit that is neither (a
        MANUAL or ADJUSTMENT accrual, another module's posting) shows as a
        tie difference against the net credit balance of GL 2100 as of the
        same instant, never as an aging row.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: as_of
          in: query
          required: false
          description: Read open AP as of this instant or house date; absent means now
          schema: { type: string }
      responses:
        "200":
          description: The AP aging page as of the instant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingAPAgingPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/purchasing/t5018:
    get:
      operationId: purchasingT5018Report
      tags: [staff-purchasing]
      x-addition: "W3-T51 row 153: the year's payments to the vendors the Controller marked as subcontractors, the CRA Form T5018's own reading; no ERP source route"
      summary: Read the T5018 report for a calendar year
      description: >-
        One row per vendor the Financial Controller has marked as a
        subcontractor, with the contractor's CRA business number and what the
        year paid that vendor through a PayBill payment, and the year's total.
        The year is the DEALER'S: absent year means the dealer's current house
        year, and the year runs on the house zone, so a payment made at 22:00 on
        the 31st of December is that year's payment even where UTC has already
        rolled over. A contractor with no business number on file says so
        through business_number_missing rather than leaving a blank cell a
        reader would take for an oversight. A marked vendor nobody was paid
        this year is on the report with nothing paid. Read only: the only thing
        that changes a year's report is the mark on a vendor and the payments
        PayBill records.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: year
          in: query
          required: false
          description: The calendar year to report on; absent means the dealer's current house year
          schema: { type: integer, format: int32 }
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The year's report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchasingT5018Report"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

