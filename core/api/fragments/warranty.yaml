        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The date is missing or not a date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/lien/jobs/{id}/preserved-lien/discharge:
    post:
      operationId: lienDischargeLien
      tags: [staff-lien]
      x-addition: "Wave 3 RT-3 fix: discharge a preserved lien, which lifts the block on the holdback release; no ERP source route"
      summary: Record that a preserved lien was discharged
      description: >-
        Sets the discharge date and a note; the block on the holdback release lifts. A lien never preserved, or
        a discharge dated before the preservation, is refused with 422. Recorded in the audit trail.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LienDischargeInput"
      responses:
        "200":
          description: The lien job with its discharge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LienJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Nothing was preserved, or the date is missing, not a date, or before the preservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/lien/jobs/{id}/preservation-dates:
    put:
      operationId: lienSetPreservationDates
      tags: [staff-lien]
      x-addition: "Wave 3 RT-3 fix round 2: set or correct the dates a lien job's preservation period counts from; no ERP source route"
      summary: Set or correct a lien job's preservation dates
      description: >-
        Sets, corrects or clears the publication date of the certificate of substantial performance, the date of
        substantial performance and the last supply. A field left out is unchanged; null clears it. The holdback
        release counts its preservation period from the latest of the three. A manager inside the job's branch
        reach; the change and its audit record are one transaction.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LienPreservationDatesInput"
      responses:
        "200":
          description: The lien job with its dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LienJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: No date was named, or a date is not a date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/lien/jobs/{id}/customer-job:
    put:
      operationId: lienLinkCustomerJob
      tags: [staff-lien]
      summary: Link a lien job to one customer job of the same customer
      description: >-
        A job of another customer and a closed job are refused in words; null
        unlinks. The lien job must have a customer and sit inside the caller's
        branch reach.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LienCustomerJobLinkInput"
      responses:
        "200":
          description: The lien job with its link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LienJob"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The job is another customer's, is closed, or the lien job has no customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- compliance: the deadline calendar + shared review-status banner ----------
  /api/v1/compliance/calendar:
    get:
      operationId: complianceListCalendar
      tags: [staff-compliance]
      summary: List compliance-calendar deadlines
      x-role: requireManager
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, SATISFIED, WAIVED, OVERDUE]
      responses:
        "200":
          description: The page of compliance deadlines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceDeadlinePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/compliance/upcoming:
    get:
      operationId: complianceListUpcoming
      tags: [staff-compliance]
      summary: List open deadlines due within the horizon, marking past-due rows OVERDUE
      x-role: requireManager
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: horizon_days
          in: query
          required: false
          description: How far ahead to look, in days; the module default applies when omitted
          schema: { type: integer, format: int32 }
      responses:
        "200":
          description: The page of upcoming deadlines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceDeadlinePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/compliance/review-status:
    get:
      operationId: complianceGetReviewStatus
      tags: [staff-compliance]
      summary: Read the review-status banner for a subject
      description: >-
        The shared, data-driven banner source every lien screen derives its
        DRAFT banner from. A subject with no explicit row answers the module
        default banner, so this route always answers a banner.
      x-role: requireManager
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: subject_type
          in: query
          required: true
          schema:
            type: string
            enum: [LIEN_JOB, LIEN_DOCUMENT, HOLDBACK, OTHER]
        - name: subject_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The review-status banner for the subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReviewStatus"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: complianceUpsertReviewStatus
      tags: [staff-compliance]
      summary: Set the review-status banner for a subject
      description: Manager-gated; a banner change is a row edit, not a redeploy.
      x-role: requireManager
      x-access:
        surfaces: [manager-home]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceReviewStatusInput"
      responses:
        "200":
          description: The stored review-status banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReviewStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The state is not in the review-status vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  schemas:
    # --- warranty: FR-1 vendor registry ----------------------------------------
    WarrantyDocRef:
      type: object
      description: One policy-document reference on a vendor profile
      required: [title, ref]
      properties:
        title: { type: string }
        ref: { type: string }
    WarrantyProductOverride:
      type: object
      description: A per-product deviation from a vendor's default terms (FR-1)
      required: [id, profile_id, product_id, coverage, notes]
      properties:
        id: { type: string }
        profile_id: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        coverage: { type: string }
        term_months:
          type: [integer, "null"]
          format: int32
          description: Null means unknown or none
        notes: { type: string }
        created_at: { type: string, format: date-time }
    WarrantyVendorProfile:
      type: object
      description: >-
        One vendor's warranty terms (FR-1). Status carries the explicit
        UNDOCUMENTED state so a claim against an undocumented vendor prompts
        capture of the negotiated terms.
      required: [id, vendor_id, status, coverage, channel, channel_ref, docs, notes]
      properties:
        id: { type: string }
        vendor_id: { type: string }
        vendor_name:
          type: string
          description: Joined from the vendor master for display
        vendor_no: { type: string }
        status:
          type: string
          enum: [DOCUMENTED, UNDOCUMENTED]
        coverage: { type: string }
        term_months:
          type: [integer, "null"]
          format: int32
          description: Null means unknown or none
        channel:
          type: string
          enum: [EMAIL, PORTAL, REP, PHONE, OTHER]
        channel_ref: { type: string }
        docs:
          type: array
          items: { $ref: "#/components/schemas/WarrantyDocRef" }
        notes: { type: string }
        overrides:
          type: array
          items: { $ref: "#/components/schemas/WarrantyProductOverride" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WarrantyVendorProfileInput:
      type: object
      description: The create or update profile payload
      required: [vendor_id, status, coverage, term_months, channel, channel_ref, docs, notes]
      properties:
        vendor_id: { type: string }
        status:
          type: string
          enum: [DOCUMENTED, UNDOCUMENTED]
        coverage: { type: string }
        term_months:
          type: [integer, "null"]
          format: int32
        channel:
          type: string
          enum: [EMAIL, PORTAL, REP, PHONE, OTHER]
        channel_ref: { type: string }
        docs:
          type: array
          items: { $ref: "#/components/schemas/WarrantyDocRef" }
        notes: { type: string }
    WarrantyProductOverrideInput:
      type: object
      description: >-
        The add-override payload. The server derives profile_id from the
        vendor in the path; a profile_id in the body is overwritten.
      required: [profile_id, product_id, coverage, term_months, notes]
      properties:
        profile_id: { type: string }
        product_id: { type: string }
        coverage: { type: string }
        term_months:
          type: [integer, "null"]
          format: int32
        notes: { type: string }
    WarrantyVendorProfilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyVendorProfile" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }

    # --- warranty: walk change 6, the claim threshold policy --------------------
    WarrantyPolicy:
      type: object
      description: >-
        The effective warranty policy for a scope: the branch row when
        present, else the org default. The claim threshold is the line total
        at which a defect becomes a warranty claim rather than shrinkage.
      required: [claim_threshold_cents]
      properties:
        branch_id:
          type: string
          description: The branch the row answers for; empty means the org default
        claim_threshold_cents:
          type: integer
          format: int64
          description: The claim threshold in integer cents, zero or more
        updated_at: { type: string, format: date-time }
    WarrantyPolicyInput:
      type: object
      description: >-
        The policy write payload; money arrives in integer cents. branch_id
        empty writes the org default row, a branch id upserts that branch's
        override.
      required: [claim_threshold_cents]
      properties:
        branch_id: { type: string }
        claim_threshold_cents:
          type: integer
          format: int64
          minimum: 0
          description: The new threshold in integer cents, zero or more

    # --- warranty: walk change 6, the per vendor credit agreements ---------------
    WarrantyVendorAgreement:
      type: object
      description: >-
        One vendor's effective warranty credit agreement: the stored row
        when the dealer set one, the default claim_by_claim when not. The
        period rides only for a periodic credit note or a fixed allowance;
        the allowance rides only for a fixed allowance, as integer basis
        points of the vendor's purchases in the period.
      required: [vendor_id, vendor_no, vendor_name, agreement_kind, allowance_bp]
      properties:
        vendor_id: { type: string }
        vendor_no:
          type: string
          description: Joined from the vendor master for display
        vendor_name:
          type: string
          description: Joined from the vendor master for display
        agreement_kind:
          type: string
          enum: [claim_by_claim, periodic_credit_note, fixed_allowance]
        period:
          type: string
          enum: [monthly, quarterly]
          description: The standard period the agreement runs on; absent for claim_by_claim
        allowance_bp:
          type: integer
          description: The fixed allowance in basis points of the vendor's purchases; zero otherwise
        updated_at: { type: string, format: date-time }
    WarrantyVendorAgreementInput:
      type: object
      description: >-
        One vendor's agreement write payload. claim_by_claim ignores a
        period or allowance that rides beside it and stores them cleared.
      required: [agreement_kind, allowance_bp]
      properties:
        agreement_kind:
          type: string
          enum: [claim_by_claim, periodic_credit_note, fixed_allowance]
        period:
          type: string
          enum: [monthly, quarterly]
          description: Required for a periodic credit note or a fixed allowance
        allowance_bp:
          type: integer
          minimum: 0
          maximum: 10000
          description: The fixed allowance in basis points; zero otherwise
    WarrantyVendorAgreementPage:
      type: object
      description: Every active vendor with its effective agreement, in vendor name order
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyVendorAgreement" }

    # --- warranty: FR-2 claim object --------------------------------------------
    WarrantyAddress:
      type: object
      description: The job-site (failure-location) address shape
      properties:
        line1: { type: string }
        city: { type: string }
        province: { type: string }
        postal: { type: string }
    WarrantyClaimLine:
      type: object
      description: One product and quantity on a claim, carrying both sheet purchase dates (FR-2)
      required: [id, claim_id, product_text, qty, notes]
      properties:
        id: { type: string }
        claim_id: { type: string }
        product_id: { type: string }
        product_text: { type: string }
        qty:
          type: string
          description: The decimal quantity as a string; never a float
        uom_code: { type: string }
        purchase_date_supplier: { type: string, format: date }
        purchase_date_contractor: { type: string, format: date }
        notes: { type: string }
    WarrantyClaimLineInput:
      type: object
      description: One line on the capture form
      required: [product_id, product_text, qty, uom_code, purchase_date_supplier, purchase_date_contractor, notes]
      properties:
        product_id: { type: string }
        product_text: { type: string }
        qty:
          type: string
          description: The decimal quantity as a string; never a float
        uom_code: { type: string }
        purchase_date_supplier: { type: string, format: date }
        purchase_date_contractor: { type: string, format: date }
        notes: { type: string }
    WarrantyClaim:
      type: object
      description: >-
        A tracked warranty-claim object (FR-2). claim_no is the public #WTY-n
        form. An empty vendor_id means the vendor is unknown pending triage.
      required: [id, claim_no, job_address, branch_id, phase, source, description, expected_cents, realized_cents]
      properties:
        id: { type: string }
        claim_no: { type: string }
        customer_id: { type: string }
        customer_name: { type: string }
        job_address: { $ref: "#/components/schemas/WarrantyAddress" }
        vendor_id: { type: string }
        vendor_name: { type: string }
        owner_id: { type: string }
        owner_name: { type: string }
        branch_id: { type: string }
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        source:
          type: string
          enum: [INTAKE, COUNTER, WEB]
        description: { type: string }
        invoice_id: { type: string }
        order_id: { type: string }
        po_id: { type: string }
        supplier_purchase_date: { type: string, format: date }
        submitted_at: { type: string, format: date-time }
        sla_due: { type: string, format: date-time }
        outcome:
          type: string
          enum: [VENDOR_CREDIT, REPLACEMENT_STOCK, CUSTOMER_ACCOMMODATION, WRITE_OFF]
        expected_cents: { type: integer, format: int64 }
        realized_cents: { type: integer, format: int64 }
        gl_journal_id: { type: string }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/WarrantyClaimLine" }
        created_at: { type: string, format: date-time }
    WarrantyClaimInput:
      type: object
      description: >-
        The capture payload. An empty vendor_id means unknown pending triage.
        opened_at supports back-dating (FR-9); empty means the server clock.
      required: [customer_id, job_address, vendor_id, owner_id, branch_id, source, description, invoice_id, order_id, po_id, supplier_purchase_date, expected_cents, opened_at, lines]
      properties:
        customer_id: { type: string }
        job_address: { $ref: "#/components/schemas/WarrantyAddress" }
        vendor_id: { type: string }
        owner_id: { type: string }
        branch_id: { type: string }
        source:
          type: string
          enum: [INTAKE, COUNTER, WEB]
        description: { type: string }
        invoice_id: { type: string }
        order_id: { type: string }
        po_id: { type: string }
        supplier_purchase_date: { type: string, format: date }
        expected_cents: { type: integer, format: int64 }
        opened_at:
          type: string
          format: date-time
          description: The true opened stamp for a back-dated claim (FR-9); empty means the server clock
        lines:
          type: array
          items: { $ref: "#/components/schemas/WarrantyClaimLineInput" }
    WarrantyClaimPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyClaim" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    WarrantyClaimAssignInput:
      type: object
      required: [vendor_id, owner_id]
      properties:
        vendor_id: { type: string }
        owner_id: { type: string }

    # --- warranty: FR-3 lifecycle ------------------------------------------------
    WarrantyClaimEvent:
      type: object
      description: >-
        One audit-spine row: a phase transition, a checklist tick, a
        settlement, a note, or evidence.
      required: [id, claim_id, event_type, note, occurred_at]
      properties:
        id: { type: string }
        claim_id: { type: string }
        event_type:
          type: string
          enum: [CREATED, PHASE_CHANGE, CHECKLIST_TICK, SETTLEMENT, NOTE, EVIDENCE]
        from_phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        to_phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        checklist_item_id: { type: string }
        checklist_key: { type: string }
        checked:
          type: [boolean, "null"]
        note: { type: string }
        evidence_ref: { type: string }
        actor_id: { type: string }
        detail:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }
    WarrantyClaimEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyClaimEvent" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    WarrantyChecklistItem:
      type: object
      description: One checklist-template row (FR-3); required items gate advancement out of the phase
      required: [id, phase, item_key, label, required, sort_order]
      properties:
        id: { type: string }
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT]
        vendor_id:
          type: string
          description: Empty means the default row applied to every vendor
        item_key: { type: string }
        label: { type: string }
        required: { type: boolean }
        sort_order: { type: integer, format: int32 }
    WarrantyChecklistState:
      type: object
      description: A checklist item resolved against a claim's ticks; what the card shows
      required: [item, checked]
      properties:
        item: { $ref: "#/components/schemas/WarrantyChecklistItem" }
        checked: { type: boolean }
    WarrantyChecklistStatePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyChecklistState" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    WarrantyChecklistTickInput:
      type: object
      required: [item_key, checked]
      properties:
        item_key: { type: string }
        checked: { type: boolean }
    WarrantyPhaseTransitionInput:
      type: object
      description: >-
        Advances a claim to a new phase. occurred_at supports back-dating the
        transition (FR-9); empty means the server clock.
      required: [to_phase, note, occurred_at]
      properties:
        to_phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        note: { type: string }
        occurred_at: { type: string, format: date-time }
    WarrantyEvidenceInput:
      type: object
      description: Attaches a masked evidence reference to a claim (FR-4 seam)
      required: [evidence_ref, note]
      properties:
        evidence_ref: { type: string }
        note: { type: string }

    # --- warranty: FR-5 settlement + money paths --------------------------------
    WarrantySettlementInput:
      type: object
      description: >-
        Records a settlement outcome and amounts (FR-5). expected_cents is
        nullable so an omitted value keeps the captured exposure while an
        explicit zero is honoured as a decision. manual_override keeps the
        manual settlement available as an explicit, reason-bearing override:
        the per-outcome money path is deliberately not executed and the
        posting row carries status MANUAL.
      required: [outcome, expected_cents, realized_cents, note, manual_override, override_reason]
      properties:
        outcome:
          type: string
          enum: [VENDOR_CREDIT, REPLACEMENT_STOCK, CUSTOMER_ACCOMMODATION, WRITE_OFF]
        expected_cents:
          type: [integer, "null"]
          format: int64
        realized_cents: { type: integer, format: int64 }
        note: { type: string }
        manual_override: { type: boolean }
        override_reason: { type: string }
    WarrantySettlementResult:
      type: object
      description: >-
        Reports a recorded settlement: whether the GL journal posted, which
        named money path ran, and what it produced. accrued_cents is what the
        settlement put on the recovery board as outstanding vendor money;
        non-zero only for the vendor-recovery path when it actually posted.
      required: [claim_id, outcome, expected_cents, realized_cents, gl_posted, gl_note, accrued_cents]
      properties:
        claim_id: { type: string }
        outcome:
          type: string
          enum: [VENDOR_CREDIT, REPLACEMENT_STOCK, CUSTOMER_ACCOMMODATION, WRITE_OFF]
        expected_cents: { type: integer, format: int64 }
        realized_cents: { type: integer, format: int64 }
        gl_journal_id: { type: string }
        gl_posted: { type: boolean }
        gl_note: { type: string }
        money_path:
          type: string
          enum: [VENDOR_RECOVERY, CUSTOMER_CREDIT, INVENTORY_REPLACEMENT, EXPENSE_WRITE_OFF]
        path_seam:
          type: string
          enum: [GL, BILLING, INVENTORY]
        path_status:
          type: string
          enum: [POSTED, NO_EFFECT, SEAM_UNWIRED, FALLBACK_GL, FAILED, MANUAL]
        external_ref:
          type: string
          description: The billing credit-memo number or inventory movement reference
        accrued_cents: { type: integer, format: int64 }
    WarrantySettlementPosting:
      type: object
      description: >-
        One executed money path. Status is the honest report of what happened
        (0129_warranty_settlement_paths.sql).
      required: [claim_id, outcome, money_path, seam, status, amount_cents, accrues_recovery]
      properties:
        id: { type: string }
        claim_id: { type: string }
        outcome:
          type: string
          enum: [VENDOR_CREDIT, REPLACEMENT_STOCK, CUSTOMER_ACCOMMODATION, WRITE_OFF]
        money_path:
          type: string
          enum: [VENDOR_RECOVERY, CUSTOMER_CREDIT, INVENTORY_REPLACEMENT, EXPENSE_WRITE_OFF]
        seam:
          type: string
          enum: [GL, BILLING, INVENTORY]
        status:
          type: string
          enum: [POSTED, NO_EFFECT, SEAM_UNWIRED, FALLBACK_GL, FAILED, MANUAL]
        amount_cents: { type: integer, format: int64 }
        accrues_recovery: { type: boolean }
        gl_journal_id: { type: string }
        external_ref: { type: string }
        request:
          type: object
          additionalProperties: true
        error_text: { type: string }
        note: { type: string }
        posted_at: { type: string, format: date-time }
    WarrantySettlementPostingPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantySettlementPosting" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }

    # --- warranty: FR-7 reporting + board ----------------------------------------
    WarrantyFunnelCount:
      type: object
      description: The claim count currently in one phase
      required: [phase, count]
      properties:
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        count: { type: integer, format: int32 }
    WarrantyManufacturerFrequency:
      type: object
      description: One vendor's claim volume plus win and loss counts
      required: [vendor_id, vendor_name, total_claims, open_claims, won_claims, lost_claims, win_rate, expected_cents, realized_cents]
      properties:
        vendor_id: { type: string }
        vendor_name: { type: string }
        total_claims: { type: integer, format: int32 }
        open_claims: { type: integer, format: int32 }
        won_claims:
          type: integer
          format: int32
          description: Settled with a credit, replacement, or accommodation
        lost_claims:
          type: integer
          format: int32
          description: Rejected, abandoned, or written off
        win_rate:
          type: number
          description: Won over decided; zero when no claims are decided
        expected_cents: { type: integer, format: int64 }
        realized_cents: { type: integer, format: int64 }
    WarrantyTimeToSettlement:
      type: object
      description: The settlement-cycle summary
      required: [settled_count, avg_days, median_days, min_days, max_days]
      properties:
        settled_count: { type: integer, format: int32 }
        avg_days: { type: number }
        median_days: { type: number }
        min_days: { type: integer, format: int32 }
        max_days: { type: integer, format: int32 }
    WarrantyExposureByVendor:
      type: object
      description: The open-recovery exposure aggregated per vendor
      required: [vendor_id, vendor_name, open_claims, exposure_cents]
      properties:
        vendor_id: { type: string }
        vendor_name: { type: string }
        open_claims: { type: integer, format: int32 }
        exposure_cents:
          type: integer
          format: int64
          description: The sum of expected_cents on open claims
    WarrantyOpenClaimAge:
      type: object
      description: One open claim's age classification
      required: [claim_id, claim_no, phase, age_days, bucket, expected_cents]
      properties:
        claim_id: { type: string }
        claim_no: { type: string }
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        vendor_id: { type: string }
        vendor_name: { type: string }
        age_days: { type: integer, format: int32 }
        bucket:
          type: string
          enum: ["0-30", "31-60", "61-90", "90+"]
        expected_cents: { type: integer, format: int64 }
    WarrantyReportBundle:
      type: object
      description: The whole metrics payload the reporting screen reads in one call
      required: [funnel, by_manufacturer, time_to_settlement, exposure_by_vendor, open_claims_by_age, total_open, total_exposure_cents]
      properties:
        funnel:
          type: array
          items: { $ref: "#/components/schemas/WarrantyFunnelCount" }
        by_manufacturer:
          type: array
          items: { $ref: "#/components/schemas/WarrantyManufacturerFrequency" }
        time_to_settlement: { $ref: "#/components/schemas/WarrantyTimeToSettlement" }
        exposure_by_vendor:
          type: array
          items: { $ref: "#/components/schemas/WarrantyExposureByVendor" }
        open_claims_by_age:
          type: array
          items: { $ref: "#/components/schemas/WarrantyOpenClaimAge" }
        total_open: { type: integer, format: int32 }
        total_exposure_cents: { type: integer, format: int64 }
    WarrantyBoardColumn:
      type: object
      description: "One Kanban column: a phase and the claims in it"
      required: [phase, claims]
      properties:
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        claims:
          type: array
          items: { $ref: "#/components/schemas/WarrantyClaim" }
    WarrantyBoard:
      type: object
      description: "The one-call board load: the confirmed phases plus the exit columns"
      required: [columns]
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/WarrantyBoardColumn" }

    # --- warranty: DIB-221 recovery ----------------------------------------------
    WarrantyRecoveryRow:
      type: object
      description: >-
        One claim's recovery position. Aging is measured from the accrual,
        never from the claim's opened stamp.
      required: [claim_id, claim_no, branch_id, accrued_cents, received_cents, outstanding_cents, promised_cents, action_count, age_days, bucket, reconciled]
      properties:
        claim_id: { type: string }
        claim_no: { type: string }
        branch_id: { type: string }
        vendor_id: { type: string }
        vendor_name: { type: string }
        accrued_cents: { type: integer, format: int64 }
        received_cents: { type: integer, format: int64 }
        outstanding_cents: { type: integer, format: int64 }
        promised_cents: { type: integer, format: int64 }
        accrued_at: { type: string, format: date-time }
        last_action_at: { type: string, format: date-time }
        action_count: { type: integer, format: int32 }
        age_days: { type: integer, format: int32 }
        bucket:
          type: string
          enum: ["0-30", "31-60", "61-90", "90+"]
        reconciled: { type: boolean }
    WarrantyRecoveryAction:
      type: object
      description: One row of the recovery chase log
      required: [claim_id, action, amount_cents, note]
      properties:
        id: { type: string }
        claim_id: { type: string }
        vendor_id: { type: string }
        action:
          type: string
          enum: [CONTACT_MADE, PROMISED, RECEIVED, DISPUTED, NOTE]
        amount_cents: { type: integer, format: int64 }
        promised_date: { type: string, format: date }
        reference: { type: string }
        note: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        occurred_at: { type: string, format: date-time }
    WarrantyRecoveryActionInput:
      type: object
      description: >-
        The log-an-action payload. PROMISED and RECEIVED must carry a positive
        amount_cents; the other actions cannot carry an amount. occurred_at is
        back-datable (FR-9); empty means the server clock.
      required: [action, amount_cents, promised_date, reference, note, occurred_at]
      properties:
        action:
          type: string
          enum: [CONTACT_MADE, PROMISED, RECEIVED, DISPUTED, NOTE]
        amount_cents: { type: integer, format: int64 }
        promised_date: { type: string, format: date }
        reference: { type: string }
        note: { type: string }
        occurred_at: { type: string, format: date-time }
    WarrantyRecoveryActionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyRecoveryAction" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    WarrantyVendorRecovery:
      type: object
      description: "One vendor's roll-up: the outstanding balance with its aging split"
      required: [vendor_id, vendor_name, claim_count, accrued_cents, received_cents, outstanding_cents, promised_cents, buckets, oldest_days, claims]
      properties:
        vendor_id: { type: string }
        vendor_name: { type: string }
        claim_count: { type: integer, format: int32 }
        accrued_cents: { type: integer, format: int64 }
        received_cents: { type: integer, format: int64 }
        outstanding_cents: { type: integer, format: int64 }
        promised_cents: { type: integer, format: int64 }
        buckets:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Outstanding cents per aging bucket
        oldest_days: { type: integer, format: int32 }
        claims:
          type: array
          items: { $ref: "#/components/schemas/WarrantyRecoveryRow" }
    WarrantyRecoveryBoard:
      type: object
      description: The whole recovery payload the board reads in one call
      required: [vendors, buckets, total_accrued_cents, total_received_cents, total_outstanding_cents, total_promised_cents, open_claim_count, reconciled_claim_count, as_of]
      properties:
        vendors:
          type: array
          items: { $ref: "#/components/schemas/WarrantyVendorRecovery" }
        buckets:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: Outstanding cents per aging bucket, across all vendors
        total_accrued_cents: { type: integer, format: int64 }
        total_received_cents: { type: integer, format: int64 }
        total_outstanding_cents: { type: integer, format: int64 }
        total_promised_cents: { type: integer, format: int64 }
        open_claim_count: { type: integer, format: int32 }
        reconciled_claim_count: { type: integer, format: int32 }
        as_of: { type: string, format: date-time }

    # --- warranty: DIB-222 intake -------------------------------------------------
    WarrantyIntakeContact:
      type: object
      description: What the submitter says about themselves; untrusted display data
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        company: { type: string }
    WarrantyPublicIntakeLine:
      type: object
      description: >-
        One product line as a member of the public can describe it: free text
        and a quantity. There is no product picker on a public form.
      required: [product_text, qty, notes]
      properties:
        product_text: { type: string }
        qty: { type: string }
        notes: { type: string }
    WarrantyPublicIntakePhoto:
      type: object
      description: >-
        One uploaded photo: a declared content type and base64 bytes. The
        declared type is verified against the magic bytes at the door.
      required: [content_type, data_base64, caption]
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        data_base64: { type: string }
        caption: { type: string }
    WarrantyPublicIntakeInput:
      type: object
      description: The whole public intake form payload
      required: [contact, job_address, description, purchased_on, lines, photos]
      properties:
        contact: { $ref: "#/components/schemas/WarrantyIntakeContact" }
        job_address: { $ref: "#/components/schemas/WarrantyAddress" }
        description: { type: string }
        purchased_on:
          type: string
          format: date
          description: Self-reported purchase date
        lines:
          type: array
          items: { $ref: "#/components/schemas/WarrantyPublicIntakeLine" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/WarrantyPublicIntakePhoto" }
    WarrantyPublicIntakeResult:
      type: object
      description: >-
        Deliberately minimal: a high-entropy reference and a sentence. No
        claim id, no claim number, nothing that maps the inside of the
        business.
      required: [reference, message]
      properties:
        reference: { type: string }
        message: { type: string }
    WarrantyIntakePhoto:
      type: object
      description: A stored intake photo, staff-side metadata read; bytes ride the byte route
      required: [content_type, byte_size]
      properties:
        id: { type: string }
        claim_id: { type: string }
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        byte_size: { type: integer, format: int32 }
        caption: { type: string }
        checksum: { type: string }
        uploaded_at: { type: string, format: date-time }
    WarrantyIntakePhotoPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantyIntakePhoto" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }

    # --- warranty: DIB-223 SLA -----------------------------------------------------
    WarrantySLATarget:
      type: object
      description: >-
        One configured per-phase target. An empty vendor_id is the default row
        applied to every vendor.
      required: [phase, target_hours, is_active]
      properties:
        id: { type: string }
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT]
        vendor_id: { type: string }
        vendor_name: { type: string }
        target_hours: { type: integer, format: int32 }
        is_active: { type: boolean }
        notes: { type: string }
    WarrantySLATargetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WarrantySLATarget" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    WarrantySLATimer:
      type: object
      description: >-
        One open claim's live timer for its current phase. Phase entry is
        derived from the audit spine, falling back to opened_at for a claim
        still in INTAKE. NO_TARGET means the phase has no configured active
        target: untimed, and said so.
      required: [claim_id, claim_no, branch_id, phase, target_hours, phase_since, state, elapsed_hours, remaining_hours, overdue_hours, exposure_cents]
      properties:
        claim_id: { type: string }
        claim_no: { type: string }
        branch_id: { type: string }
        vendor_id: { type: string }
        vendor_name: { type: string }
        owner_id: { type: string }
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT]
        target_hours: { type: integer, format: int32 }
        phase_since: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        state:
          type: string
          enum: [OK, DUE_SOON, BREACHED, NO_TARGET]
        elapsed_hours: { type: integer, format: int32 }
        remaining_hours:
          type: integer
          format: int32
          description: Negative once breached
        overdue_hours:
          type: integer
          format: int32
          description: Zero unless breached
        exposure_cents: { type: integer, format: int64 }
    WarrantySLAAlert:
      type: object
      description: A durable overdue record; one per claim and phase
      required: [claim_id, phase, due_at, breached_at, overdue_hours, notify_status]
      properties:
        id: { type: string }
        claim_id: { type: string }
        claim_no: { type: string }
        branch_id: { type: string }
        vendor_name: { type: string }
        owner_id: { type: string }
        phase:
          type: string
          enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT]
        due_at: { type: string, format: date-time }
        breached_at: { type: string, format: date-time }
        overdue_hours: { type: integer, format: int32 }
        acknowledged_at: { type: string, format: date-time }
        acknowledged_by: { type: string }
        notify_status:
          type: string
          enum: [SUPPRESSED, SENT, FAILED]
        notify_ref: { type: string }
        notify_error: { type: string }
        exposure_cents: { type: integer, format: int64 }
    WarrantySLABoard:
      type: object
      description: "The in-module SLA surface: live timers plus the outstanding alerts"
      required: [timers, alerts, targets, breached_count, due_soon_count, as_of]
      properties:
        timers:
          type: array
          items: { $ref: "#/components/schemas/WarrantySLATimer" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/WarrantySLAAlert" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/WarrantySLATarget" }
        breached_count: { type: integer, format: int32 }
        due_soon_count: { type: integer, format: int32 }
        as_of: { type: string, format: date-time }
    WarrantySLASweepResult:
      type: object
      description: The alerts a sweep raised or refreshed, with the count alongside
      required: [raised, count]
      properties:
        raised:
          type: array
          items: { $ref: "#/components/schemas/WarrantySLAAlert" }
        count: { type: integer, format: int32 }

    # --- lien ----------------------------------------------------------------------
    LienJob:
      type: object
      description: >-
        A Construction-Act improvement: the umbrella a holdback and release
        cycle attaches to. holdback_direction and hst_on_holdback ride the
        metadata of the underlying table.
      required: [id, job_no, branch_id, description, contract_cents, holdback_pct_bps, status, holdback_direction, hst_on_holdback]
      properties:
        id: { type: string }
        job_no: { type: string }
        customer_id: { type: string }
        customer_job_id: { type: string }
        branch_id: { type: string }
        description: { type: string }
        contract_cents: { type: integer, format: int64 }
        holdback_pct_bps: { type: integer, format: int32 }
        substantial_perf_date: { type: string, format: date }
        last_supply_date: { type: string, format: date }
        csp_published_on: { type: string, format: date }
        lien_preserved_on: { type: string, format: date }
        lien_preserved_note: { type: string }
        lien_discharged_on: { type: string, format: date }
        status:
          type: string
          enum: [OPEN, SUBSTANTIALLY_PERFORMED, RELEASED, CLOSED]
        holdback_direction:
          type: string
          enum: [RECEIVABLE, PAYABLE]
        hst_on_holdback: { type: boolean }
        created_at: { type: string, format: date-time }
    LienProvinceRule:
      type: object
      required: [province, holdback_pct_bps, preserve_days, perfect_days]
      properties:
        province: { type: string }
        holdback_pct_bps: { type: integer, format: int32 }
        preserve_days: { type: integer, format: int32 }
        perfect_days: { type: integer, format: int32 }
    LienProvinceRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LienProvinceRule" }
    LienDealerRule:
      type: object
      description: The dealer's province, and an optional percent that overrides the province's (null is no override, never zero).
      required: [province, holdback_pct_bps]
      properties:
        province: { type: string }
        holdback_pct_bps: { type: [integer, "null"], format: int32 }
    LienHoldbackOverrideInput:
      type: object
      required: [holdback_pct_bps]
      properties:
        holdback_pct_bps: { type: [integer, "null"], format: int32 }
    LienHoldbackRule:
      type: object
      required: [holdback_pct_bps, preserve_days, perfect_days, pct_source, province, province_source]
      properties:
        holdback_pct_bps: { type: integer, format: int32 }
        preserve_days: { type: integer, format: int32 }
        perfect_days: { type: integer, format: int32 }
        pct_source:
          type: string
          enum: [JOB, DEALER, PROVINCE]
        province: { type: string }
        province_source:
          type: string
          enum: [SITE, DEALER]
    LienCustomerJobLinkInput:
      type: object
      required: [customer_job_id]
      properties:
        customer_job_id: { type: [string, "null"] }
    LienJobInput:
      type: object
      description: The create-job payload
      required: [job_no, customer_id, branch_id, description, contract_cents, holdback_pct_bps, substantial_perf_date, last_supply_date, holdback_direction, hst_on_holdback]
      properties:
        job_no: { type: string }
        customer_id: { type: string }
        branch_id: { type: string }
        description: { type: string }
        contract_cents: { type: integer, format: int64 }
        holdback_pct_bps: { type: integer, format: int32 }
        substantial_perf_date: { type: string, format: date }
        last_supply_date: { type: string, format: date }
        csp_published_on: { type: string, format: date, description: "Publication of the certificate of substantial performance, when known (optional)" }
        holdback_direction:
          type: string
          enum: [RECEIVABLE, PAYABLE]
        hst_on_holdback: { type: boolean }
    LienPreservedLienInput:
      type: object
      required: [preserved_on]
      properties:
        preserved_on: { type: string, format: date }
        note: { type: string }
    LienDischargeInput:
      type: object
      required: [discharged_on]
      properties:
        discharged_on: { type: string, format: date }
        note: { type: string }
    LienPreservationDatesInput:
      type: object
      properties:
        csp_published_on: { type: [string, "null"], format: date }
        substantial_perf_date: { type: [string, "null"], format: date }
        last_supply_date: { type: [string, "null"], format: date }
    LienJobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LienJob" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    LienDocument:
      type: object
      description: >-
        A rendered, versioned, DRAFT-bannered Construction-Act document. data
        holds the merge fields the template rendered from.
      required: [id, job_id, template_kind, status, version, rendered_content, data, is_draft_banner]
      properties:
        id: { type: string }
        job_id: { type: string }
        template_kind:
          type: string
          enum: [CONDITIONAL_RELEASE, UNCONDITIONAL_RELEASE, STATUTORY_DECLARATION, DISCHARGE, NOTICE, OTHER]
        status:
          type: string
          enum: [DRAFT, PENDING, ISSUED, SUPERSEDED]
        version: { type: integer, format: int32 }
        rendered_content: { type: string }
        data:
          type: object
          additionalProperties: true
        is_draft_banner: { type: boolean }
        created_at: { type: string, format: date-time }
    LienDocumentInput:
      type: object
      description: >-
        The render-document payload. data supplies the merge fields; the
        server renders the statute-driven template and stamps the next
        version.
      required: [job_id, template_kind, data]
      properties:
        job_id: { type: string }
        template_kind:
          type: string
          enum: [CONDITIONAL_RELEASE, UNCONDITIONAL_RELEASE, STATUTORY_DECLARATION, DISCHARGE, NOTICE, OTHER]
        data:
          type: object
          additionalProperties: true
    LienDocumentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LienDocument" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    LienSyncResult:
      type: object
      description: Reports an idempotent holdback sync from billing's holdback invoices
      required: [job_id, booked_count, skipped_count, booked_cents]
      properties:
        job_id: { type: string }
        booked_count: { type: integer, format: int32 }
        skipped_count: { type: integer, format: int32 }
        booked_cents: { type: integer, format: int64 }
    LienReleaseApproval:
      type: object
      description: >-
        The four-eyes co-signer the dual-gate release requires. The claimed
        approver is resolved server-side; the asserted role is never trusted
        on its own.
      required: [approver_id, approver_role]
      properties:
        approver_id: { type: string }
        approver_role: { type: string }
    LienReleaseResult:
      type: object
      description: The outcome of a holdback release
      required: [job_id, amount_cents, gl_journal_id, released_at, approved_by, gatekeeper_by]
      properties:
        job_id: { type: string }
        amount_cents: { type: integer, format: int64 }
        gl_journal_id: { type: string }
        released_at: { type: string, format: date-time }
        approved_by: { type: string }
        gatekeeper_by: { type: string }
    LienAgingRow:
      type: object
      description: One job's outstanding holdback, aged into a bucket
      required: [job_id, job_no, branch_id, holdback_direction, outstanding_cents, oldest_days, bucket, release_eligible]
      properties:
        job_id: { type: string }
        job_no: { type: string }
        branch_id: { type: string }
        holdback_direction:
          type: string
          enum: [RECEIVABLE, PAYABLE]
        outstanding_cents: { type: integer, format: int64 }
        oldest_days: { type: integer, format: int32 }
        bucket:
          type: string
          enum: ["0-30", "31-60", "61-90", "90+"]
        release_eligible:
          type: boolean
          description: True when the direction is RECEIVABLE and the statutory release window has passed
    LienAgingRowPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LienAgingRow" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    LienTriageItem:
      type: object
      description: "One triage worklist row: a job needing attention, badge-classified"
      required: [job_id, job_no, branch_id, holdback_direction, outstanding_cents, oldest_days, badge, note]
      properties:
        job_id: { type: string }
        job_no: { type: string }
        branch_id: { type: string }
        holdback_direction:
          type: string
          enum: [RECEIVABLE, PAYABLE]
        outstanding_cents: { type: integer, format: int64 }
        oldest_days: { type: integer, format: int32 }
        badge:
          type: string
          enum: [RELEASE_DUE, OVERDUE, AGING, PAYABLE_MANUAL, OK]
        note: { type: string }
    LienTriageItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LienTriageItem" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }

    # --- compliance -----------------------------------------------------------------
    ComplianceDeadline:
      type: object
      description: One compliance-calendar entry; the worklist row
      required: [id, job_id, deadline_kind, due_date, rule_days, status]
      properties:
        id: { type: string }
        job_id: { type: string }
        deadline_kind:
          type: string
          enum: [HOLDBACK_RELEASE, LIEN_EXPIRY, NOTICE_DEADLINE, PROOF_OF_CLAIM, OTHER]
        due_date: { type: string, format: date }
        rule_days: { type: integer, format: int32 }
        status:
          type: string
          enum: [OPEN, SATISFIED, WAIVED, OVERDUE]
    ComplianceDeadlinePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComplianceDeadline" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    ComplianceReviewStatus:
      type: object
      description: >-
        One shared banner row: the data-driven review state the lien screens
        read for a subject (a job or a document).
      required: [subject_type, subject_id, state, banner_text, is_draft]
      properties:
        subject_type:
          type: string
          enum: [LIEN_JOB, LIEN_DOCUMENT, HOLDBACK, OTHER]
        subject_id: { type: string }
        state:
          type: string
          enum: [DRAFT, PENDING, APPROVED, REJECTED]
        banner_text: { type: string }
        is_draft: { type: boolean }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time }
    ComplianceReviewStatusInput:
      type: object
      description: The review-status upsert payload
      required: [subject_type, subject_id, state, banner_text]
      properties:
        subject_type:
          type: string
          enum: [LIEN_JOB, LIEN_DOCUMENT, HOLDBACK, OTHER]
        subject_id: { type: string }
        state:
          type: string
          enum: [DRAFT, PENDING, APPROVED, REJECTED]
        banner_text: { type: string }
