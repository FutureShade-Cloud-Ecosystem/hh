  # --- warranty: DIB-222 public intake (the one unguarded route) -----------------
  /api/public/v1/warranty/intake:
    post:
      operationId: warrantySubmitPublicIntake
      tags: [public]
      summary: Submit a warranty claim from the public intake form
      description: >-
        The one unguarded warranty route, registered from its own
        RegisterPublicRoutes method so the absence of a guard is an explicit
        decision. There is no token: the doorway is open by design and defends
        itself with a configured body cap, a per-address rate limit keyed on a
        hash of the server-observed address, and content-type checks against
        the magic bytes of each photo. There is no public read: the reference
        returned here is a receipt to quote on the phone, not a lookup key.
      x-role: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyPublicIntakeInput"
      responses:
        "201":
          description: "The receipt: a high-entropy reference and a sentence, nothing more"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyPublicIntakeResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: The submission or one photo exceeds the configured size cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body is not application/json, or a photo is not a JPEG, PNG or WebP image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A required field is missing or a value violates an intake rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many submissions from this connection inside the configured window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The intake form is closed or not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

