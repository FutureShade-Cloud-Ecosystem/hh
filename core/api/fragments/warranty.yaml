# Fragment: warranty, lien, compliance (HardscapeOS ERP modules WTY-01, W6 M6).
# Sources: backend/internal/warranty, backend/internal/lien, backend/internal/compliance.
# Guards resolved from RegisterRoutes signatures and the main.go call sites:
# warranty takes RequireStaff, RequireManager, RequireAdmin; lien is RequireManager
# throughout (the holdback release adds an in-service dual gate, noted in x-guards);
# compliance is RequireManager throughout. The public intake doorway is unguarded by
# design (warranty.Handler.RegisterPublicRoutes).

paths:
  # --- warranty: FR-1 vendor registry ----------------------------------------
  /api/v1/warranty/vendors:
    get:
      operationId: warrantyListVendorProfiles
      tags: [staff-warranty]
      summary: List vendor warranty profiles
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of vendor warranty profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyVendorProfilePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/warranty/vendors/{vendorID}:
    get:
      operationId: warrantyGetVendorProfile
      tags: [staff-warranty]
      summary: Read one vendor's warranty profile, including product overrides
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: vendorID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The vendor warranty profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyVendorProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: warrantyUpsertVendorProfile
      tags: [staff-warranty]
      summary: Create or replace a vendor's warranty profile
      description: >-
        The path is the source of truth for which vendor the profile belongs
        to; the server overwrites vendor_id from the path.
      x-role: requireAdmin
      x-access:
        surfaces: [manager-home]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: vendorID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyVendorProfileInput"
      responses:
        "200":
          description: The stored vendor warranty profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyVendorProfile"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/warranty/vendors/{vendorID}/overrides:
    post:
      operationId: warrantyAddProductOverride
      tags: [staff-warranty]
      summary: Add a per-product deviation from a vendor's default terms
      description: >-
        The profile is resolved from the vendor in the path, so the caller
        supplies only the product and the deviating terms.
      x-role: requireAdmin
      x-access:
        surfaces: [manager-home]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: vendorID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyProductOverrideInput"
      responses:
        "201":
          description: The created product override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyProductOverride"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- warranty: walk change 6, the claim threshold policy ---------------------
  /api/v1/warranty/policy:
    get:
      operationId: warrantyGetPolicy
      tags: [staff-warranty]
      summary: Read the effective warranty policy for a branch
      description: >-
        branch_id empty resolves the org-wide default row; a branch resolves
        that branch's override when present, else the org default. The claim
        threshold is the line total at which a defect becomes a warranty
        claim rather than shrinkage.
      x-role: requireStaff
      x-access:
        surfaces: [manager-home, counter-till, dealer-admin]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: branch_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The effective policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyPolicy"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: warrantyPutPolicy
      tags: [staff-warranty]
      summary: Write the warranty policy (org default or one branch override)
      description: >-
        Money arrives in integer cents on the wire. A change records the old
        and new threshold on the audit spine; a save that moved nothing
        writes no audit row.
      x-role: requireAdmin
      x-access:
        surfaces: [dealer-admin]
        level: admin
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyPolicyInput"
      responses:
        "200":
          description: The stored policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyPolicy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: A negative threshold, or an unknown branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- warranty: walk change 6, the per vendor credit agreements ---------------
  /api/v1/warranty/agreements:
    get:
      operationId: warrantyListVendorAgreements
      tags: [staff-warranty]
      summary: List every active vendor's warranty credit agreement
      description: >-
        One row per active vendor, in vendor name order. A vendor the dealer
        never set answers the default claim_by_claim, with no period and no
        allowance: the default lives in the read alone.
      x-role: requireStaff
      x-access:
        surfaces: [manager-home, dealer-admin]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
      responses:
        "200":
          description: The vendor agreements, every active vendor in one read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyVendorAgreementPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/warranty/agreements/{vendorID}:
    put:
      operationId: warrantyUpsertVendorAgreement
      tags: [staff-warranty]
      summary: Write one vendor's warranty credit agreement
      description: >-
        The path is the source of truth for which vendor the agreement
        belongs to. claim_by_claim clears the period and the allowance (the
        kind is the rule, the other two carry nothing on their own); a
        periodic credit note or a fixed allowance carries a standard month
        or quarter, and a fixed allowance carries its percent of the
        vendor's purchases as integer basis points. Each moved knob rides
        the audit spine with its old and new value; a save that moved
        nothing writes no audit row.
      x-role: requireAdmin
      x-access:
        surfaces: [dealer-admin]
        level: admin
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: vendorID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyVendorAgreementInput"
      responses:
        "200":
          description: The stored agreement, the effective row read back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyVendorAgreement"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: An unknown vendor, an off-vocabulary kind or period, or an out of range allowance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- warranty: FR-2 claim capture + reads -----------------------------------
  /api/v1/warranty/claims:
    get:
      operationId: warrantyListClaims
      tags: [staff-warranty]
      summary: List warranty claims
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: branch_id
          in: query
          required: false
          schema: { type: string }
        - name: phase
          in: query
          required: false
          schema:
            type: string
            enum: [INTAKE, TRIAGE, SUBMITTED, WAITING_ON_DECISION, DECISION, SETTLEMENT, CLOSED, REJECTED, ABANDONED]
        - name: vendor_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The page of claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaimPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: warrantyCreateClaim
      tags: [staff-warranty]
      summary: Capture a warranty claim from the office, counter, or an invoice line
      description: >-
        opened_at supports back-dating (FR-9): when set, the claim enters with
        its true opened stamp rather than the server clock.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyClaimInput"
      responses:
        "201":
          description: The created claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaim"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: A field value violates a claim rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/warranty/claims/{id}:
    get:
      operationId: warrantyGetClaim
      tags: [staff-warranty]
      summary: Read one warranty claim
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaim"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/warranty/claims/{id}/events:
    get:
      operationId: warrantyListClaimEvents
      tags: [staff-warranty]
      summary: List the audit-spine events of a claim
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The page of claim events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaimEventPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/warranty/claims/{id}/checklist:
    get:
      operationId: warrantyGetClaimChecklist
      tags: [staff-warranty]
      summary: Read the claim's checklist resolved against its ticks
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The page of checklist states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyChecklistStatePage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: warrantyTickClaimChecklist
      tags: [staff-warranty]
      summary: Toggle one checklist item on a claim
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyChecklistTickInput"
      responses:
        "200":
          description: The checklist item state after the tick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyChecklistState"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The item key is not on the claim's checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- warranty: FR-3 lifecycle ------------------------------------------------
  /api/v1/warranty/claims/{id}/assign:
    post:
      operationId: warrantyAssignClaim
      tags: [staff-warranty]
      summary: Assign a claim to a vendor and an owner
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyClaimAssignInput"
      responses:
        "200":
          description: The claim after assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaim"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The assignment violates a claim rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/warranty/claims/{id}/advance:
    post:
      operationId: warrantyAdvanceClaimPhase
      tags: [staff-warranty]
      summary: Advance a claim to a new phase
      description: >-
        Required checklist items on the current phase gate the move (FR-3);
        exit transitions to REJECTED or ABANDONED are never gated. occurred_at
        supports back-dating the transition (FR-9).
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyPhaseTransitionInput"
      responses:
        "200":
          description: The claim after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaim"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The transition is illegal or the checklist gate is unmet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/warranty/claims/{id}/evidence:
    post:
      operationId: warrantyAttachClaimEvidence
      tags: [staff-warranty]
      summary: Attach a masked evidence reference to a claim
      description: >-
        FR-4 seam: the body carries a reference, not file bytes; the module
        has no file storage of its own for this route.
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyEvidenceInput"
      responses:
        "201":
          description: The evidence event recorded on the claim's audit spine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyClaimEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- warranty: FR-5 settlement ----------------------------------------------
  /api/v1/warranty/claims/{id}/settle:
    post:
      operationId: warrantySettleClaim
      tags: [staff-warranty]
      summary: Record a settlement outcome and amounts on a claim
      description: >-
        Manager-gated (PRD section 4). The outcome drives the per-outcome
        money path from warranty_outcome_paths; manual_override records a
        settlement whose money was booked outside the module and requires a
        reason. Re-settlement of a settled claim is refused.
      x-role: requireManager
      x-access:
        surfaces: [manager-home]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantySettlementInput"
      responses:
        "200":
          description: The recorded settlement, including which money path ran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantySettlementResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The outcome or amounts violate a settlement rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/warranty/claims/{id}/postings:
    get:
      operationId: warrantyListClaimPostings
      tags: [staff-warranty]
      summary: List the executed settlement money paths of a claim
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The page of settlement postings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantySettlementPostingPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- warranty: FR-7 reporting + board ----------------------------------------
  /api/v1/warranty/reports:
    get:
      operationId: warrantyGetReports
      tags: [staff-warranty]
      summary: Read the warranty metrics bundle in one call
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The metrics bundle the reporting screen reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyReportBundle"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/warranty/board:
    get:
      operationId: warrantyGetBoard
      tags: [staff-warranty]
      summary: Read the Kanban columns with their claims in one call
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          schema: { type: string }
        - name: vendor_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The confirmed phases plus the exit columns, each with its claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyBoard"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --- warranty: DIB-221 recovery worklist -------------------------------------
  /api/v1/warranty/recovery:
    get:
      operationId: warrantyGetRecoveryBoard
      tags: [staff-warranty]
      summary: Read the outstanding vendor-money recovery worklist
      description: >-
        open_only defaults true: this is a worklist, and a reconciled claim
        belongs in history rather than on the board.
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          schema: { type: string }
        - name: vendor_id
          in: query
          required: false
          schema: { type: string }
        - name: open_only
          in: query
          required: false
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The recovery board, rolled up per vendor with aging buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyRecoveryBoard"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/warranty/claims/{id}/recovery:
    get:
      operationId: warrantyListRecoveryActions
      tags: [staff-warranty]
      summary: List a claim's recovery chase log, oldest first
      x-role: requireStaff
      x-access:
        surfaces: [manager-home]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The page of recovery actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyRecoveryActionPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: warrantyLogRecoveryAction
      tags: [staff-warranty]
      summary: Log one recovery chase action against a claim
      description: >-
        A RECEIVED action reconciles against what the claim accrued; an
        over-receipt is refused. occurred_at is back-datable, symmetric with
