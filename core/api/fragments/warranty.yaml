    post:
      operationId: lienReleaseHoldback
      tags: [staff-lien]
      summary: Release a job's holdback and post the release journal
      description: >-
        Posts the release journal (DR 2350 / CR 1150) through the GL provider
        and registers the release on the compliance calendar. The route gate
        is RequireManager; inside the service a four-eyes dual gate runs on
        top: the initiating gatekeeper must hold the general-manager authority
        and the co-signer named in the body is resolved server-side and must
        currently hold a finance authority, never trusting the role asserted
        in the request. A PAYABLE-direction holdback is recordable but its
        release is refused. A lien job linked to a customer job is refused with
        422 in words: its holdback is released by the Controller's holdback
        release (POST /api/v1/ar/holdback/releases), because this route would
        credit the holdback receivable a second time. The co-signer body is
        optional to decode; an empty approval fails the dual gate.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      x-guards: [holdback-release-dual-gate]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LienReleaseApproval"
      responses:
        "200":
          description: The outcome of the holdback release
          content:
            application/json:
              schema:
