paths:
  # --- staff quote builder (internal/quote/edit_handler.go, RegisterStaffRoutes: RequireStaff) ---
  # The staff quote resource is the canonical dealer_quote (DECISIONS.md D8).
  /api/v1/quotes:
    post:
      operationId: quoteCreateQuote
      tags: [staff-quote]
      summary: Open a new DRAFT dealer quote for a customer at a branch
      description: >-
        The staff quote resource is the canonical dealer_quote (DECISIONS.md
        D8). The quote number is minted by the database. An empty valid_until
        means the quote never expires.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCreateRequest"
      responses:
        "201":
          description: The created quote, as the staff builder renders it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: quoteListQuotes
      tags: [staff-quote]
      summary: List dealer quotes the caller can reach, branch-scoped
      description: >-
        The staff quote resource is the canonical dealer_quote (DECISIONS.md
        D8). The ERP's offset page is replaced by cursor pagination here.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: Restrict to one quote state; absent lists every state
          schema:
            type: string
            enum: [DRAFT, SENT, ACCEPTED, CONVERTED, EXPIRED, LOST]
      responses:
        "200":
          description: The page of quote summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSummaryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/quotes/{id}:
    get:
      operationId: quoteReadQuote
      tags: [staff-quote]
      summary: Read one dealer quote with its priced lines and the server-computed edit offer
      description: >-
        The staff quote resource is the canonical dealer_quote (DECISIONS.md
        D8). The id parameter also accepts the visible quote number (for
        example "#Q-4"), resolved branch-scoped.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The quote as the staff builder renders it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteView"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: quoteSetValidUntil
      tags: [staff-quote]
      summary: Move or clear a quote's valid_until
      description: >-
        An empty valid_until clears the expiry, after which the quote never
        expires. Refused with 409 when the quote is frozen (accepted,
        converted, or terminal) or already expired.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteValidUntilWrite"
      responses:
        "200":
          description: The edit result with the quote's status as read under the row lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteEditResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/quotes/{id}/lines:
    post:
      operationId: quoteAddQuoteLine
      tags: [staff-quote]
      summary: Append a priced line to a dealer quote
      description: >-
        The line is priced at current rates through the shared pricing seam
        and the quote's soft stock holds are re-derived in the same
        transaction. Quantities are decimal strings, never floats.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteLineAddRequest"
      responses:
        "200":
          description: The new line, the recomputed totals, and the quote status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteEditResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/quotes/{id}/lines/{lineNo}:
    patch:
      operationId: quoteEditQuoteLine
      tags: [staff-quote]
      summary: Change a quote line's quantity, or set its discount percent
      description: >-
        A body with qty_entered reprices the line at current rates. A body
        carrying disc_pct without qty_entered is a discount-only write, gated
        by the dealer's line_discounts_enabled policy knob.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
        - name: lineNo
          in: path
          required: true
          description: The quote line number, a positive integer
          schema: { type: integer, format: int32, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteLinePatchRequest"
      responses:
        "200":
          description: The edited line, the recomputed totals, and the quote status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteEditResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The typed floor refusal when the write would put the line below
            the margin floor and the caller holds no clearing and no
            approved request, or the frozen status refusal
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/QuoteFloorRefusal"
                  - $ref: "#/components/schemas/Error"
    delete:
      operationId: quoteRemoveQuoteLine
      tags: [staff-quote]
      summary: Remove a line from a dealer quote
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
        - name: lineNo
          in: path
          required: true
          description: The quote line number, a positive integer
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: The recomputed totals and the quote status (no line on a removal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteEditResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/quotes/{id}/edits:
    get:
      operationId: quoteQuoteEditHistory
      tags: [staff-quote]
      summary: Read a quote's ordered, column-level change history
      description: >-
        The projection of the quote's QUOTE_CHANGED audit rows, sorted by the
        audit sequence. Readable on an expired quote; expiry stops edits, not
        the trail.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The change history, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteEditHistory"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/quotes/{id}/convert:
    post:
      operationId: quoteConvertQuote
      tags: [staff-quote]
      summary: Convert an ACCEPTED dealer quote into an order from the counter
      description: >-
        The counter door onto quote-to-order conversion. The body is optional:
        a bare POST converts with no fulfilment choice. The credit and hold
        gate runs inside the conversion transaction, and the selling-role
        check runs in the service. A 409 names the refusal (credit policy,
        repeat acceptance, or a state that cannot convert).
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteConvertRequest"
      responses:
        "201":
          description: The new order's id and number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteConvertResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/quotes/{id}/lines/{lineNo}/compare:
    post:
      operationId: quoteCompareQuoteLine
      tags: [staff-quote]
      summary: Score alternate products against one quote line, read-only
      description: >-
        A POST because the alternates are a request body, but the operation
        writes nothing, including no pricing audit rows: scoring goes through
        the read-only pricing preview.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
        reason: scores alternate products against one line, read-only by contract
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
        - name: lineNo
          in: path
          required: true
          description: The quote line number, a positive integer
          schema: { type: integer, format: int32, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteLineCompareRequest"
      responses:
        "200":
          description: The comparison, current line pinned first, cheapest scorable options next
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteLineComparison"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/quotes/{id}/lines/{lineNo}/floor-approval:
    post:
      operationId: quoteRequestFloorApproval
      tags: [staff-quote]
      summary: File an approval request for a quote line discount below the margin floor
      description: >-
        For a line the caller may edit whose asked discount lands below the
        margin floor, files one approval request bound to that quote, that
        line and that discount. The server builds the subject and the
        detail from its own figures; the caller supplies neither. A caller
        who may clear the floor itself is told so and no request is filed.
        A line not below the floor is a 409: nothing to approve.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
        - name: lineNo
          in: path
          required: true
          description: The quote line number, a positive integer
          schema: { type: integer, format: int32, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteFloorApprovalRequest"
      responses:
        "201":
          description: The filed request's state, or the word that the caller may clear the floor itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteFloorApprovalAnswer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The asked discount does not land below the floor, nothing to approve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/quotes/{id}/related-documents:
    get:
      operationId: quoteQuoteRelatedDocuments
      tags: [staff-quote]
      summary: Read a quote's document family (orders and invoices) as normalized rows
      description: >-
        The lineage read over orders.quote_id, invoices.order_id and the
        acceptance provenance table. Asking from the quote or from any of its
        orders returns the same family.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The document family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRelatedDocumentList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/orders/{id}/related-documents:
    get:
      operationId: quoteOrderRelatedDocuments
      tags: [staff-quote]
      summary: Read an order's document family, asked from the order end
      description: >-
        Registered by the quote module because the read model is the quote
        family. An order with no quote behind it answers itself plus its
        downstream documents.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Order id (uuid) or the visible order number
          schema: { type: string }
      responses:
        "200":
          description: The document family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRelatedDocumentList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/quotes/settings/acceptance:
    get:
      operationId: quoteGetAcceptanceSettings
      tags: [staff-quote]
      summary: Read the dealer's multi-acceptance switch
      description: >-
        The route guard is requireStaff; the admin (Tier-1 global) check runs
        in the service, so a non-admin caller is refused with 403 naming the
        role.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
      responses:
        "200":
          description: The effective switch and whether the write seam is wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAcceptanceSettings"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: quoteSetAcceptanceSettings
      tags: [staff-quote]
      summary: Flip the dealer's multi-acceptance switch
      description: >-
        The switch is dealer wide, so CP0-5 answer A gives the write to the
        General Manager alone: the rule runs in the service, in words, and
        any other caller is refused with 403 naming the role. The gate
        sits at read so the General Manager (Read on the Quote Desk)
        reaches the service. Every flip is audited in both directions.
        allow_multi_accept is required: a body that omits it is refused
        rather than read as false, because this one field decides whether
        a duplicate order can be minted.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
        reason: >-
          The dealer wide switch is the General Manager's alone under
          CP0-5 answer A, and that rule runs in the service in words; the
          gate must let the General Manager (Read on the Quote Desk)
          through to it.
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteAcceptanceSettingsWrite"
      responses:
        "200":
          description: The setting as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAcceptanceSettings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # --- quote work area: policy, terms, margin glance (internal/quote/builder_handler.go) ---
  /api/v1/quotes/policy:
    get:
      operationId: quoteReadQuotePolicy
      tags: [staff-quote]
      summary: Read the effective quote-builder policy for a branch
      description: >-
        Resolved branch row over the dealer default (the NULL-branch row). The
        cost data the cost_visibility knob governs is gated at the margin
        glance, not here.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          description: Branch to resolve the policy for; absent resolves the dealer default
          schema: { type: string }
      responses:
        "200":
          description: The effective policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePolicy"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: quotePutQuotePolicy
      tags: [staff-quote]
      summary: Write the dealer or branch quote-builder policy
      description: >-
        The CP0-5 answer A rule runs in the service, in words: a caller
        holding Manage on the Quote Desk writes a branch row it reaches
        (the Sales manager under the decided default), and the General
        Manager alone writes the NULL dealer default row; any other caller
        is refused with 403 naming the role. The gate therefore sits at
        read, so both named roles reach the service (the General Manager
        holds Read on the Quote Desk). Out-of-bounds knobs are refused in
        words with 422 before any database CHECK can fire; the 422 body is
        the shared Error envelope.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
        reason: >-
          The CP0-5 answer A rule runs in the service in words (Manage
          writes a branch row it reaches, the General Manager the dealer
          default), so the gate must let both named roles through; the
          General Manager holds Read on the Quote Desk.
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePolicy"
      responses:
        "200":
          description: The policy as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePolicy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/quotes/{id}/terms:
    get:
      operationId: quoteReadQuoteTerms
      tags: [staff-quote]
      summary: Read a quote's terms strip and summary money
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The terms and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteTerms"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: quotePutQuoteTerms
      tags: [staff-quote]
      summary: Write a quote's terms strip
      description: >-
        Authorized on the edit matrix's header row (DRAFT and SENT only),
        re-checked inside the transaction. The write also stamps the header
        tax from the configured flat rate. Out-of-bounds fields are refused in
        words with 422; the 422 body is the shared Error envelope.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteTermsInput"
      responses:
        "200":
          description: The terms as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteTerms"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/quotes/{id}/margin-glance:
    get:
      operationId: quoteMarginGlance
      tags: [staff-quote]
      summary: Read a quote's per-line cost and margin, gated by the dealer's cost_visibility policy
      description: >-
        Computed server-side; the client never computes a margin. A caller the
        branch policy does not allow receives an empty object with every cost
        field byte-absent, never a fabricated figure.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The margin glance, or an empty object when the policy hides cost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteMargin"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- share links, staff side (internal/quote/share_handler.go, RegisterShareRoutes: RequireStaff) ---
  /api/v1/quotes/{id}/share-links:
    post:
      operationId: quoteMintShareLink
      tags: [staff-quote]
      summary: Mint a public share link for a dealer quote
      description: >-
        The raw token is returned exactly once, here, and is unrecoverable
        afterwards (only its hash is stored). Minting moves a DRAFT quote to
        SENT and starts its follow-up cadence. A 409 answers a quote that is
        empty, frozen, or expired. The link's underlying states are ACTIVE,
        CONFIRMED, REVOKED; the wire shape carries the computed live flag
        instead.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteShareLinkMintRequest"
      responses:
        "201":
          description: The minted link, with the raw token this one time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteMintedShareLink"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: quoteListShareLinks
      tags: [staff-quote]
      summary: List the share links issued for a quote
      description: >-
        No tokens: the raw value is unrecoverable by design and the stored
        hash never crosses the wire. The link states are ACTIVE, CONFIRMED,
        REVOKED; each row carries the computed live flag.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: Every link issued for the quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteShareLinkList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/quotes/{id}/share-links/{linkId}:
    delete:
      operationId: quoteRevokeShareLink
      tags: [staff-quote]
      summary: Revoke one share link immediately
      description: Subsequent use of the revoked link answers 410, not 404
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
        - name: linkId
          in: path
          required: true
          description: The share link id
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- public share-link surface (RegisterPublicRoutes: registered bare, no auth) ---
  /api/public/v1/quotes/{token}:
    get:
      operationId: quotePublicViewQuote
      tags: [public]
      summary: View a dealer quote through a share link
      description: >-
        Pre-auth: the opaque token in the path is the credential, and it grants read of exactly one quote. The
        payload is a hand-built allowlist with no staff-only field (no cost,
        margin, or branch internals). A token that never existed answers 404;
        a link that died (revoked or past its expiry) answers 410 with the
        Error envelope, so the holder learns the link died rather than being
        told the quote never existed.
      x-role: public
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The share-link token; it is the credential
          schema: { type: string }
      responses:
        "200":
          description: The customer-facing quote view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotePublicView"
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The link existed and died (revoked or expired)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/public/v1/quotes/{token}/accept:
    post:
      operationId: quotePublicAcceptQuote
      tags: [public]
      summary: Accept a dealer quote through a share link
      description: >-
        Pre-auth: the opaque token in the path is the credential. Acceptance is a typed full name plus an explicit
        affirmative, recorded as an electronic attestation. The status flip,
        the acceptance record and the audit row land on one transaction under
        the quote row lock. A 409 names why the quote is not awaiting
        acceptance, including the order a first acceptance became when
        multi-accept is off.
      x-role: public
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The share-link token; it is the credential
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuotePublicAcceptRequest"
      responses:
        "200":
          description: The acceptance confirmation, restating the agreed totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteAcceptanceResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The link existed and died (revoked or expired)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- quote automation: SMS delivery and follow-ups (followup_handler.go, RegisterAutomationRoutes: RequireStaff) ---
  /api/v1/quotes/{id}/sms-share:
    post:
      operationId: quoteShareBySMS
      tags: [staff-quote]
      summary: Text a quote's share link to the customer
      description: >-
        Consent is checked before anything is minted; a customer without SMS
        consent (or opted out) is a 409 in words. The answer is 202 because
        the message is queued, not sent. No payment link is ever included; the
        payload type has no field for one.
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteSMSShareRequest"
      responses:
        "202":
          description: The queued send (nothing has been delivered yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteSMSShareResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/quotes/{id}/followups:
    get:
      operationId: quoteFollowUpHistory
      tags: [staff-quote]
      summary: Read a quote's follow-up plan, sent steps, and upcoming steps
      description: >-
        The plan, what actually went out (including SKIPPED rows with their
        reasons), and the steps still to come, computed from the plan rather
        than stored.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The follow-up history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteFollowUpHistory"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/quotes/{id}/followups/disable:
    post:
      operationId: quoteDisableFollowUps
      tags: [staff-quote]
      summary: Stop a quote's follow-up cadence
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The follow-up history after the switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteFollowUpHistory"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/quotes/{id}/followups/enable:
    post:
      operationId: quoteEnableFollowUps
      tags: [staff-quote]
      summary: Start or resume a quote's follow-up cadence
      description: Enabling a quote that never had a plan creates one
      x-addition: "the quote desk's own floor request door (plan 1.1, QD-1); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          description: Quote id (uuid) or the visible quote number
          schema: { type: string }
      responses:
        "200":
          description: The follow-up history after the switch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteFollowUpHistory"
        "401": { $ref: "#/components/responses/Unauthorized" }
