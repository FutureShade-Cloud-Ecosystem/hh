components:
  parameters:
    XApproverAuthorization:
      name: X-Approver-Authorization
      in: header
      required: false
      description: >-
        The approver's own credential beside the clerk's bearer, carried once
        when a return above the dealer's approval amount commits with the
        manager at the counter. The value carries the same Bearer scheme
        prefix as Authorization: the string "Bearer " followed by the token,
        so the server reads it through the same bearer parsing as any
        caller's credential. Verified by the same verifier as any caller;
        its membership and role resolved as the gate resolves any caller;
        accepted only when issued within the short window the configuration
        sets. Never logged.
      schema: { type: string }

  responses:
    PosRefundApprovalRequired:
      description: >-
        The return is refused, and the body is the Error envelope. The route
        answers 409 for more than one refusal: the refund rail's own refusals
        (a closed drawer, a refused tender write) carry the plain envelope
        alone, while the approval refusal names itself in the error string
        "refund_approval_required": the refund is above the dealer's approval
        amount and the caller's role is not on the approvers list, and only
        that refusal carries the requirement under the approval key, so the
        till's screen can show the amount and the roles that may approve. A
        client discriminates on the error string, never on the key's absence.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  approval:
                    description: >-
                      Present exactly when the error string is
                      "refund_approval_required", the approval refusal; the
                      route's other 409 refusals answer the plain envelope
                      without the key.
                    $ref: "#/components/schemas/PosRefundApproval"
    PosSplitTotalMismatch:
      description: >-
        The split-tender sum refusal, and the body is the Error envelope
        carrying the amounts beside it. The refusal names itself in the
        error string "split_total_mismatch": the submitted legs do not sum
        exactly to the sale total, and only that refusal carries the two
        cents fields and the message key, so the till's screen can show
        both amounts without parsing a sentence. A client discriminates on
        the error string, never on the keys' absence. The message speaks
        dollars and plain words; no message ever prints cents.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  tendered_cents:
                    type: integer
                    format: int64
                    description: What the submitted legs sum to
                  total_cents:
                    type: integer
                    format: int64
                    description: The sale total the legs must settle exactly
                  message:
                    type: string
                    description: >-
                      The dollar sentence, for example "The tenders add up
                      to $266.00, but the sale total is $300.58."
    PosSaleUnprocessable:
      description: >-
        A well-formed sale body the money does not fit, answered as the
        Error envelope carrying the refusal's own cents fields beside it.
        The sale preview answers the same body for the one refusal it
        shares with the ring (cod_not_for_terms_account), so the till can
        say it at the read the payment step opens, before the ring.
        The refusal names itself in the error string and a client
        discriminates on the error string, never on the keys' absence:
        split_total_mismatch (tendered_cents and total_cents, the legs do
        not sum to the total); on_account_not_available (amount_cents and
        credit_limit_cents, the account cannot book the rest on account,
        zero day terms or no credit line, pay in full or take a deposit
        with the balance due later); deposit_not_collect_now (total_cents
        and deposit_cents, a collect now sale is paid in full, the goods
        do not leave on a part payment); deposit_out_of_range
        (deposit_cents and total_cents, the deposit is outside its money
        bound, more than zero and less than the sale total; a deposit equal
        to the total is a paid sale, ring it paid, and a negative one is no
        deposit at all); cod_not_for_terms_account
        (message only, the pay before release sale type refused for an
        account that pays on terms: Cash On Demand is the account's own
        posture, ring the sale on account or paid in full);
        supplier_deposit_not_credit (message only, a supplier deposit on a
        shape that is not a credit account's on-account sale, it is billed to
        the account or taken at the counter); supplier_deposit_over_pretax
        (deposit_cents and subtotal_cents, the demanded deposit is more than
        the sale's pre-tax amount). Every message speaks dollars and plain
        words; no message ever prints cents.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  tendered_cents:
                    type: integer
                    format: int64
                    description: Present on split_total_mismatch, what the submitted legs sum to
                  total_cents:
                    type: integer
                    format: int64
                    description: >-
                      The sale total, present on split_total_mismatch and
                      deposit_not_collect_now
                  amount_cents:
                    type: integer
                    format: int64
                    description: Present on on_account_not_available, what would have gone on account
                  credit_limit_cents:
                    type: integer
                    format: int64
                    description: Present on on_account_not_available, the account's credit line
                  deposit_cents:
                    type: integer
                    format: int64
                    description: >-
                      Present on deposit_not_collect_now and
                      deposit_out_of_range, the deposit the body carried
                  message:
                    type: string
                    description: The dollar sentence for the refusal a person reads at the counter
    PosPayBalanceWholeOnly:
      description: >-
        The Pay balance part amount refusal: this door takes the whole
        balance of one order. The refusal names itself in the error string
        "pay_balance_whole_only" and carries the two cents fields and the
        message key beside it, the problem body style split_total_mismatch
        uses; a client discriminates on the error string. The message speaks
        dollars and plain words; no message ever prints cents.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  sent_cents:
                    type: integer
                    format: int64
                    description: The amount the request carried
                  balance_cents:
                    type: integer
                    format: int64
                    description: The whole balance the door takes
                  message:
                    type: string
                    description: >-
                      The dollar sentence, for example "This door takes the
                      whole balance: $93.00 is owed, $50.00 was entered."

  schemas:
    # ── POS: sale ring ───────────────────────────────────────────────────────
    PosLineInput:
      type: object
      description: >-
        One cart line. The price is not in the body; it is resolved
        server-side. The cost is not in the body either: the core reads it
        from its own cost source, so a margin answer is never priced by the
        caller.
      required: [product_id, qty_entered, uom_entered]
      properties:
        product_id: { type: string, format: uuid }
        qty_entered: { type: number }
        uom_entered: { type: string }
        discount:
          $ref: "#/components/schemas/PosDiscountInput"
    PosDiscountInput:
      type: object
      description: >-
        One manual counter discount: a percent or an amount, and the manager
        who said yes at the counter. The discount is verbal, no approval
        queue, but it always names its approver so it is auditable. Exactly
        one of percent_bps and amount_cents. The approver must be a login
        from the discount-approvers read for the sale's branch; otherwise
        the ring refuses in words (422). A line discount comes off the line
        total; a ticket discount comes off the subtotal after the line
        discounts and is shared over the lines. The till still rings at rule
        and tier prices with no margin floor: a discount is a manager's
        word on top of that price.
      required: [approved_by, approved_base_cents]
      properties:
        percent_bps: { type: integer, format: int32, minimum: 1, maximum: 10000, description: "Basis points, 1250 is 12.5 percent" }
        amount_cents: { type: integer, format: int64, minimum: 1, description: Cents off; not more than what it comes off }
        approved_by: { type: string, format: uuid, description: The approving manager's staff id }
        approved_qty:
          type: number
          description: >-
            A line discount only: the quantity the manager's yes was given for.
            The ring refuses the discount if the line's quantity is no longer this.
        approved_base_cents:
          type: integer
          format: int64
          minimum: 1
          description: >-
            What the yes was given for in cents: a line discount's line total
            before the discount, a ticket discount's subtotal after the line
            discounts. The ring refuses a discount whose base no longer matches
            (422, ask a manager again), so a manager's percent never grows with
            the quantity or the ticket. The ticket total must also stay above
            zero: a sale cannot total $0.00.
    PosDiscountApprover:
      type: object
      description: One manager a till person may name
      required: [id, name, role_label]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role_label: { type: string, description: The role label the receipt prints, never a name }
    PosDiscountApproverList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosDiscountApprover" }
    PosSaleDiscount:
      type: object
      description: One manual discount on a committed sale, with the role of the manager who approved it
      required: [scope, amount_cents, approved_by, approved_by_role, approved_by_label]
      properties:
        scope: { type: string, enum: [LINE, SALE] }
        line_no: { type: integer, format: int32, description: The line, for a LINE discount }
        percent_bps: { type: integer, format: int32, description: The percent entered; absent for an amount }
        amount_cents: { type: integer, format: int64, description: What came off, in cents }
        approved_by: { type: string, format: uuid }
        approved_by_role: { type: string, description: The approver's role id when approving }
        approved_by_label: { type: string, description: "The role label the receipt prints (Discount approved by ...)" }
    PosTenderLegInput:
      type: object
      description: >-
        One leg of a split settlement. The legs (2 to 6) must sum exactly to the
        sale total, with at most one ACCOUNT leg. Each card leg carries its own
        token.
      required: [method, amount_cents]
      properties:
        method: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        amount_cents: { type: integer, format: int64, exclusiveMinimum: 0 }
        payment_token: { type: string, description: "CARD legs only: client-tokenized; never a PAN" }
        card_type: { type: string, enum: [DEBIT, CREDIT, PREPAID, UNKNOWN] }
    PosReliefDecision:
      type: object
      description: The per-transaction tax relief assessment recorded with the sale
      required: [purchaser_type, declared_use, fulfilment, profile_id, reason_code]
      properties:
        purchaser_type: { type: string }
        declared_use: { type: string }
        fulfilment: { type: string }
        profile_id: { type: string }
        reason_code: { type: string }
        evidence_doc_id: { type: string }
        signature_ref: { type: string }
    PosSaleInput:
      type: object
      description: >-
        The idempotent ring body; the client mints idempotency_key. customer_id
        empty resolves to the house walk-in. sale_type COD is a payment posture
        (pay-as-you-go account), not a fulfilment mode: a COD ring takes its
        fulfilment from fulfilment (default PICKUP) and is locked from
        fulfilment until paid. deposit_cents is valid only on an unpaid-at-ring
        sale (ACCOUNT tender or COD).
      required: [idempotency_key, branch_id, till_session_id, customer_id, sale_type, cash_sale, tender, payment_token, signature_ref, requested_date, notes, offline, lines]
      properties:
        idempotency_key: { type: string, format: uuid, description: Client-minted replay key }
        branch_id: { type: string, format: uuid }
        till_session_id: { type: string, format: uuid }
        customer_id: { type: string, description: Empty resolves to the house walk-in }
        sale_type:
          type: string
          enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD]
          default: COLLECT_NOW
        fulfilment:
          type: string
          enum: [PICKUP, WILL_CALL, DELIVERY]
          description: COD only; other sale types carry fulfilment in sale_type
        cash_sale: { type: boolean }
        tender: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        payment_token: { type: string, description: "CARD only: client-tokenized; never a PAN" }
        card_type: { type: string, enum: [DEBIT, CREDIT, PREPAID, UNKNOWN] }
        signature_ref: { type: string }
        relief: { $ref: "#/components/schemas/PosReliefDecision" }
        requested_date: { type: string, format: date }
        notes: { type: string }
        po_job_ref: { type: string, maxLength: 64, description: The customer's PO or job reference }
        salesperson_id: { type: string, description: The staff member credited with the sale }
        job_address: { type: string, maxLength: 200 }
        job_reference: { type: string, maxLength: 64 }
        cash_tendered_cents:
          type: integer
          format: int64
          description: Cash-tendered quick entry on a plain fully-paid CASH ring; 0 means not entered
        offline: { type: boolean }
        deposit_cents:
          type: integer
          format: int64
          description: Unpaid-at-ring sales only; greater than zero and less than the total
        deposit_method:
          type: string
          enum: [CASH, CARD, CHEQUE]
        supplier_deposit_cents:
          type: integer
          format: int64
          description: >-
            What the supplier demanded on a special order, billed to a credit
            account at once as its own invoice (posted to Customer Deposits),
            never taken at the counter. Allowed only on a credit shape: an
            ACCOUNT tender on an account with terms and a credit line, with no
            counter deposit and no split; never more than the sale's pre-tax
            amount.
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosLineInput" }
        discount:
          $ref: "#/components/schemas/PosDiscountInput"
        tenders:
          type: array
          description: Split settlement legs; when set, tender is ignored and deposit_cents is refused
          minItems: 2
          maxItems: 6
          items: { $ref: "#/components/schemas/PosTenderLegInput" }
    PosTenderLegResult:
      type: object
      description: One settled leg on the sale, in submission order (what the receipt prints)
      required: [seq, method, amount_cents]
      properties:
        seq: { type: integer, format: int32 }
        method: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        amount_cents: { type: integer, format: int64 }
        payment_id: { type: string, format: uuid, description: "Absent for the ACCOUNT leg, which captures nothing" }
        gateway_ref: { type: string, description: CARD legs only }
    PosSale:
      type: object
      description: The committed sale, returned verbatim on an idempotent replay
      required: [order_id, order_no, invoice_id, invoice_no, tender, sale_type, subtotal_cents, tax_cents, total_cents, tax_reason_code, status, replayed]
      properties:
        swap_id: { type: string, format: uuid, description: Present when the sale is the new order of a swap }
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        invoice_id: { type: string, format: uuid }
        invoice_no: { type: string }
        payment_id: { type: string, format: uuid }
        gateway_ref: { type: string }
        tender: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        sale_type: { type: string, enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD] }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64, description: The provisional flat rate; the tax engine owns the real value }
        total_cents: { type: integer, format: int64 }
        deposit_cents: { type: integer, format: int64, description: Taken at ring on an unpaid sale; the balance is total minus deposit }
        supplier_deposit_cents:
          type: integer
          format: int64
          description: >-
            The supplier's demanded deposit billed to the account; the sale's
            own invoice carries the rest (total less this). Absent when none.
        supplier_deposit_invoice_id: { type: string, format: uuid, description: The deposit document, for the receipt }
        supplier_deposit_invoice_no: { type: string }
        tax_reason_code:
          type: string
          enum: [STD_ON_HST_13, ON_FN_POS_8, FED_S87_VENDOR_DELIVERY, MANUAL_TAX_REVIEW, RELIEF_DECLINED_EVIDENCE]
        status: { type: string, enum: [COMMITTED, VOIDED] }
        replayed: { type: boolean }
        po_job_ref: { type: string }
        salesperson_id: { type: string }
        salesperson_name: { type: string }
        cash_tendered_cents: { type: integer, format: int64 }
        change_due_cents: { type: integer, format: int64 }
        job_address: { type: string }
        job_reference: { type: string }
        split_tender: { type: boolean }
        tenders:
          type: array
          items: { $ref: "#/components/schemas/PosTenderLegResult" }
        discount_cents: { type: integer, format: int64, description: Every manual discount on the sale together; absent when there was none }
        discounts:
          type: array
          description: Each manual discount and the role of the manager who approved it
          items: { $ref: "#/components/schemas/PosSaleDiscount" }
    PosSalePreviewInput:
      type: object
      description: >-
        The read-only preview body: the sale's own facts without any
        tender, no replay key and no drawer. Every price is resolved
        server-side exactly as the ring resolves it for the same body.
      required: [branch_id, customer_id, lines]
      properties:
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, description: Empty resolves to the house walk-in }
        sale_type: { type: string, enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD] }
        fulfilment:
          type: string
          enum: [PICKUP, WILL_CALL, DELIVERY]
          description: COD only; other sale types carry fulfilment in sale_type
        relief: { $ref: "#/components/schemas/PosReliefDecision" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosLineInput" }
        discount:
          $ref: "#/components/schemas/PosDiscountInput"
    PosSalePreview:
      type: object
      description: >-
        The preview answer: the ticket's own totals in integer cents,
        exactly as the ring computes them for the same body, plus the
        payment shapes the counter may offer this customer. A ticket that
        collects no tax shows no tax line and its total is its subtotal.
      required: [subtotal_cents, tax_cents, tax_lines, total_cents, tax_reason_code, payment_options, supplier_deposit]
      properties:
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64, description: The sum of the tax lines }
        tax_lines:
          type: array
          description: Empty when the ticket collects no tax
          items: { $ref: "#/components/schemas/PosSalePreviewTaxLine" }
        total_cents: { type: integer, format: int64 }
        payment_options:
          type: array
          description: >-
            The payment shapes that fit the account (one per shape, always
            present): the menu the payment step renders from, so no screen
            decides a money rule. The ring still refuses per sale on the
            amount (the credit gate); this is what may be offered.
          items: { $ref: "#/components/schemas/PosPaymentOption" }
        supplier_deposit:
          $ref: "#/components/schemas/PosSupplierDepositOption"
        tax_reason_code:
          type: string
          enum: [STD_ON_HST_13, ON_FN_POS_8, FED_S87_VENDOR_DELIVERY, MANUAL_TAX_REVIEW, RELIEF_DECLINED_EVIDENCE]
        discount_cents: { type: integer, format: int64, description: Every manual discount together; absent when there is none }
        sale_discount_cents: { type: integer, format: int64, description: The ticket discount's own cents }
        ticket_base_cents: { type: integer, format: int64, description: "The subtotal after the line discounts, before any ticket discount: what a ticket discount is approved against" }
        ticket_discount_max_cents: { type: integer, format: int64, description: The most a ticket discount may take off (the base less one cent), so a sale never totals $0.00 }
        lines:
          type: array
          description: One row per ticket line when a discount applies, so the till shows the server's cents
          items: { $ref: "#/components/schemas/PosSalePreviewLine" }
    PosSalePreviewLine:
      type: object
      description: One ticket line as the ring would charge it
      required: [line_no, line_total_cents, before_ticket_discount_cents]
      properties:
        line_no: { type: integer, format: int32 }
        line_total_cents: { type: integer, format: int64, description: Net of every discount }
        before_ticket_discount_cents: { type: integer, format: int64, description: The line's price less its own discount, before its share of the ticket discount (the figure the receipt prints) }
        discount_cents: { type: integer, format: int64, description: The line's own discount }
        sale_discount_cents: { type: integer, format: int64, description: The line's share of the ticket discount }
    PosSalePreviewTaxLine:
      type: object
      description: One tax line the ring would bind for the body
      required: [reason_code, rate_bps, tax_cents]
      properties:
        reason_code: { type: string }
        rate_bps: { type: integer, format: int32 }
        tax_cents: { type: integer, format: int64 }
    PosSupplierDepositOption:
      type: object
      description: >-
        Whether the counter may mark a supplier's demanded deposit on a
        special order (always present): allowed exactly on the credit shape's
        ring, the deposit billed to the account as its own invoice. The
        payment step shows its control only when allowed says so.
      required: [allowed]
      properties:
        allowed: { type: boolean }
        words:
          type: string
          description: The line the Summary and the receipt print for the billed deposit, present when allowed

    PosPaymentOption:
      type: object
      description: >-
        One payment shape the counter may offer this account. A credit
        customer (terms above zero and a credit line) is offered pay in
        full, all on account, and a deposit with the rest on account; a
        cash on demand account (zero day terms with a line) is offered
        pay in full, pay before release (the whole ticket unpaid at ring,
        no deposit: the invoice issues now and is due today, and
        fulfilment waits for paid in full, any fulfilment), and a deposit
        with the rest due later; a walk in and any no credit account are
        offered pay in full and a deposit with the rest due later, never
        on account. A credit customer on hold loses on account (the hold
        rule's own posture, cash or card only).
      required: [shape]
      properties:
        shape:
          type: string
          enum: [PAY_IN_FULL_NOW, ALL_ON_ACCOUNT, DEPOSIT_NOW_REST_ON_ACCOUNT, DEPOSIT_NOW_REST_DUE_LATER, PAY_BEFORE_RELEASE]
        line_two_words:
          type: string
          enum: [On account, Balance due later]
          description: >-
            The server's words for line two of a deposit sale, present only
            on the deposit shapes.
        line_two_sentence:
          type: string
          description: >-
            The one sentence the counter shows under the two lines of a
            deposit sale, present only on the deposit shapes. It follows the
            reason the account is offered the shape: a credit customer's
            rest rides the account, a Cash On Demand account hears the pay
            before release words, and any other pay before release account
            (no credit, walk in, on hold) is told it cannot carry the sale on
            account.
    PosSaleView:
      type: object
      description: The operator-reopen read; no evidence identifiers, no granular flow log
      required: [order_id, order_no, customer_id, branch_id, sale_type, tender, status, subtotal_cents, tax_cents, total_cents, tax_reason_code, invoice_id, invoice_no, lines]
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        sale_type: { type: string, enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD] }
        tender: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        status: { type: string, enum: [COMMITTED, VOIDED] }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        tax_reason_code:
          type: string
          enum: [STD_ON_HST_13, ON_FN_POS_8, FED_S87_VENDOR_DELIVERY, MANUAL_TAX_REVIEW, RELIEF_DECLINED_EVIDENCE]
        invoice_id: { type: string, format: uuid }
        invoice_no: { type: string }
        payment_id: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosSaleViewLine" }
        split_tender: { type: boolean }
        tenders:
          type: array
          items: { $ref: "#/components/schemas/PosTenderLegResult" }
        discount_cents: { type: integer, format: int64 }
        discounts:
          type: array
          items: { $ref: "#/components/schemas/PosSaleDiscount" }
    PosSaleViewLine:
      type: object
      description: One reopened line with its resolved engine price
      required: [line_no, product_id, description, qty_entered, uom_entered, unit_price_cents, price_uom, line_total_cents]
      properties:
        line_no: { type: integer, format: int32 }
        product_id: { type: string, format: uuid }
        description: { type: string }
        qty_entered: { type: number }
        uom_entered: { type: string }
        unit_price_cents: { type: integer, format: int64 }
        price_uom: { type: string }
        line_total_cents: { type: integer, format: int64, description: What was charged, net of every discount }
        discount_cents: { type: integer, format: int64 }
        sale_discount_cents: { type: integer, format: int64 }
    PosOwingPayment:
      type: object
      description: One payment an order has taken so far, the money trail the find and the receipt print
      required: [payment_id, method, amount_cents]
      properties:
        payment_id: { type: string, format: uuid }
        method: { type: string, enum: [CASH, CARD, CHEQUE, EFT, OTHER] }
        amount_cents: { type: integer, format: int64 }
    PosOwingOrder:
      type: object
      description: >-
        One order that owes money, a row of the Pay balance find: order
        number, customer, job, fulfilment, order total, each payment so far
        with its method and amount, still owed, and held or not (the pay
        before release hold, whose words ride beside it).
      required: [order_id, order_no, customer_id, customer_name, fulfilment, order_total_cents, paid_cents, still_owed_cents, held_from_picking, payments]
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        job: { type: string, description: "The order's job reference or PO reference when it carries one" }
        fulfilment: { type: string, enum: [PICKUP, WILL_CALL, DELIVERY] }
        order_total_cents: { type: integer, format: int64 }
        paid_cents: { type: integer, format: int64 }
        still_owed_cents: { type: integer, format: int64 }
        held_from_picking: { type: boolean }
        hold_words:
          type: string
          description: >-
            Present exactly when held_from_picking is true: "This order
            cannot reach picking until the balance is paid."
        payments:
          type: array
          description: Every payment so far, oldest first
          items: { $ref: "#/components/schemas/PosOwingPayment" }
    PosOwingOrderList:
      type: object
      description: The Pay balance find answer, newest first
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosOwingOrder" }
        truncated:
          type: boolean
          description: >-
            True when a bound stopped the find with more orders possibly
            matching (more owing orders than the answer holds, or a term that
            reaches too many customers); the till then says "More orders
            match: search by order number." False when the answer is whole.
    PosPayBalanceTakeInput:
      type: object
      description: >-
        The Pay balance take: the WHOLE balance of one order. The amount is
        the client's echo of the balance it read; the server refuses an
        amount that is not the whole current balance in words.
      required: [order_id, method, amount_cents, till_session_id, idempotency_key]
      properties:
        order_id: { type: string, format: uuid }
        method: { type: string, enum: [CASH, CARD] }
        amount_cents: { type: integer, format: int64 }
        till_session_id: { type: string, format: uuid }
        idempotency_key: { type: string, description: "The client's UUID; the replay key" }
        payment_token: { type: string, description: "CARD only; client tokenized; a PAN is never sent" }
        card_type: { type: string, enum: [DEBIT, CREDIT, PREPAID, UNKNOWN] }
        offline: { type: boolean, description: CARD cannot be taken offline; the take refuses }
    PosPayBalanceTaken:
      type: object
      description: >-
        The take's answer, what the receipt and the after card need: paid in
        full, released to picking or not, and the money trail. Replayed is
        true when this key had already taken the payment; nothing was
        charged and nothing was written.
      required: [order_id, order_no, customer_id, payment_id, method, amount_cents, paid_words, released_to_picking, still_owed_cents, held_from_picking_now, payments]
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        customer_id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        method: { type: string, enum: [CASH, CARD] }
        amount_cents: { type: integer, format: int64 }
        paid_words: { type: string, description: "\"Paid in full\"" }
        released_to_picking: { type: boolean, description: The pay hold (if the shape carried one) lifted with this payment }
        still_owed_cents: { type: integer, format: int64 }
        held_from_picking_now: { type: boolean }
        payments:
          type: array
          description: The money trail, every payment with its method and amount
          items: { $ref: "#/components/schemas/PosOwingPayment" }
        replayed: { type: boolean }
    PosSaleSummary:
      type: object
      description: One row of the past-sale list; enough to recognise a sale, not enough to be a receipt
      required: [sale_id, order_id, order_no, customer_id, customer_name, branch_id, sale_type, tender, split_tender, total_cents, status, created_at, line_count]
      properties:
        sale_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        invoice_id: { type: string, format: uuid }
        invoice_no: { type: string }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        branch_id: { type: string, format: uuid }
        till_session_id: { type: string, format: uuid }
        sale_type: { type: string, enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD] }
        tender: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        split_tender: { type: boolean }
        total_cents: { type: integer, format: int64 }
        status: { type: string, enum: [COMMITTED, VOIDED] }
        created_at: { type: string, format: date-time }
        line_count: { type: integer, format: int32 }
    PosSaleSummaryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosSaleSummary" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }

    # ── POS: tax relief ──────────────────────────────────────────────────────
    PosReliefAssessInput:
      type: object
      description: >-
        The per-transaction assess-relief entry point. No permanent exemption
        reference, no evidence image upload (data minimization). subtotal_cents
        is the pre-tax basis for the displayed outcome.
      required: [profile_id, order_id, purchaser_type, declared_use, fulfilment, subtotal_cents, evidence_attached, purpose_ack]
      properties:
        profile_id: { type: string, description: "Pre-populates from the eligibility profile, masked at the edge" }
        order_id: { type: string, format: uuid, description: "When set, the assessment snapshot is recorded" }
        purchaser_type:
          type: string
          enum: [INDIVIDUAL, SOLE_PROP, PARTNERSHIP, CORPORATION, BAND, BEE, TRUST_JV, OTHER]
        declared_use: { type: string, enum: [personal, commercial, band, mixed, unknown] }
        fulfilment: { type: string, enum: [pickup, dibbits_truck, dibbits_carrier, purchaser_carrier] }
        subtotal_cents: { type: integer, format: int64 }
        evidence_attached: { type: boolean, description: Proof-of-delivery or waybill present (the zero-rate hard gate) }
        purpose_ack: { type: boolean, description: Purpose notice acknowledged before collection }
    PosReliefOutcome:
      type: object
      description: Masked-only assessment answer with the displayed outcome and the snapshot fields
      required: [purchaser_type, masked_identifier, outcome, reason_code, rate_bps, full_hst_cents, on_credit_cents, net_collected_cents, automated, requires_evidence, evidence_satisfied]
      properties:
        purchaser_type: { type: string }
        masked_identifier: { type: string, description: The only identifier a cashier ever sees }
        outcome: { type: string, enum: ["0%", "5%", "13%", REVIEW] }
        reason_code: { type: string }
        rate_bps: { type: integer, format: int32, description: The binding rate applied to the ring }
        full_hst_cents: { type: integer, format: int64 }
        on_credit_cents: { type: integer, format: int64 }
        net_collected_cents: { type: integer, format: int64 }
        automated: { type: boolean }
        requires_evidence: { type: boolean }
        evidence_satisfied: { type: boolean }

    # ── POS: signatures ──────────────────────────────────────────────────────
    PosSignatureCapture:
      type: object
      required: [purpose, ref_type, ref_id]
      properties:
        purpose: { type: string, enum: [TAX_ATTESTATION, PROOF_OF_DELIVERY, CARD_PRESENT, ORDER_SIGNOFF] }
        ref_type: { type: string }
        ref_id: { type: string }
    PosSignatureRef:
      type: object
      required: [signature_ref]
      properties:
        signature_ref: { type: string }
    PosTypedAttestation:
      type: object
      description: Who typed their name, that they explicitly affirmed, and what they affirmed it against
      required: [purpose, ref_type, ref_id, typed_name, affirmed]
      properties:
        purpose: { type: string, enum: [TAX_ATTESTATION, PROOF_OF_DELIVERY, CARD_PRESENT, ORDER_SIGNOFF] }
        ref_type: { type: string }
        ref_id: { type: string }
        typed_name: { type: string, maxLength: 200 }
        affirmed: { type: boolean, description: "A required separate act, never implied by submitting the form" }
    PosTypedSignatureRef:
      type: object
      required: [signature_ref, provider]
      properties:
        signature_ref: { type: string }
        provider: { type: string, enum: [TYPED_NAME_V1] }

    # ── POS: counter reads ───────────────────────────────────────────────────
    PosStockGlance:
      type: object
      description: >-
        Read-only multi-branch availability. sell_factor is base units per one
        sell unit; 0 means no conversion on file and the client must not divide
        by it. low_base keys are branch ids with an authored reorder point; an
        absent branch has no threshold.
      required: [product_id, on_hand]
      properties:
        product_id: { type: string, format: uuid }
        on_hand:
          type: object
          description: Branch id to available quantity in base UOM (on hand minus reserved)
          additionalProperties: { type: number }
        base_uom: { type: string }
        sell_uom: { type: string }
        sell_factor: { type: number }
        low_base:
          type: object
          description: Branch id to reorder point in base units
          additionalProperties: { type: number }
        weight_kg_per_base: { type: number, description: Unit weight per base unit; absent when no weight is on file }
    PosSalesperson:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PosSalespersonPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosSalesperson" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    PosMarginGlanceInput:
      type: object
      description: The current ticket's lines, sent exactly as the ring body sends them (never a client price)
      required: [branch_id, customer_id, customer_type, lines]
      properties:
        branch_id: { type: string, format: uuid }
        customer_id: { type: string }
        customer_type: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosLineInput" }
    PosMarginGlanceLine:
      type: object
      description: >-
        One ticket line's margin answer, index-aligned with the input. A line
        with no cost on file answers empty: absent, never a fake zero.
      properties:
        margin_bps: { type: [integer, "null"], format: int64 }
        est_profit_cents: { type: [integer, "null"], format: int64 }
    PosMarginGlance:
      type: object
      description: >-
        Every field is omitempty; a caller the dealer's margin_visibility policy
        does not allow receives an empty object. The footer pair covers only the
        lines where both revenue and cost are known; partial says some lines
        were excluded.
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosMarginGlanceLine" }
        margin_bps: { type: [integer, "null"], format: int64 }
        est_profit_cents: { type: [integer, "null"], format: int64 }
        partial: { type: boolean }
    PosCounterPriceItem:
      type: object
      description: One product at one quantity; uom_entered empty resolves to the product's sell unit
      required: [product_id, qty_entered, uom_entered]
      properties:
        product_id: { type: string, format: uuid }
        qty_entered: { type: number }
        uom_entered: { type: string }
    PosCounterPriceInput:
      type: object
      required: [branch_id, customer_id, items]
      properties:
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, description: "Empty is the walk-in case: retail stands alone" }
        items:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/PosCounterPriceItem" }
    PosCounterQuote:
      type: object
      description: >-
        One product's price picture for one customer at one quantity
        (transcribed from pricing.CounterQuote). saving_cents is set only when
        the customer is genuinely better off than retail; a surcharge leaves it
        zero. The next_break fields name the nearest unreached bulk threshold,
        present only when one exists and beats the current price.
      required: [product_id, price_uom, retail_cents, customer_cents]
      properties:
        product_id: { type: string, format: uuid }
        price_uom: { type: string }
        retail_cents: { type: integer, format: int64 }
        customer_cents: { type: integer, format: int64 }
        saving_cents: { type: integer, format: int64 }
        saving_bps: { type: integer, format: int64 }
        basis: { type: string, enum: [CONTRACT, ACCOUNT, PROMO, BULK] }
        next_break_qty: { type: number }
        next_break_uom: { type: string }
        next_break_unit_cents: { type: integer, format: int64 }
        next_break_save_cents: { type: integer, format: int64 }
        unpriceable: { type: boolean, description: "The engine could not price this product; render no price, never a zero" }
    PosCounterPrices:
      type: object
      required: [customer_type, prices]
      properties:
        customer_type: { type: string, description: "Whose prices these are, resolved from the account" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/PosCounterQuote" }
    PosQuickPick:
      type: object
      description: One grid tile. price is absent when the engine could not price the product.
      required: [product_id, sku, name, uom, has_image]
      properties:
        product_id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        size_line: { type: string }
        uom: { type: string, description: The sell unit a tap would add in }
        has_image: { type: boolean }
        category: { type: string }
        subcategory: { type: string }
        price: { $ref: "#/components/schemas/PosCounterQuote" }
    PosQuickPicks:
      type: object
      required: [source, customer_type, items]
      properties:
        source: { type: string, enum: [user, dealer, derived] }
        customer_type: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/PosQuickPick" }
    PosHotkey:
      type: object
      description: One bound key. browser_owned marks a key mainstream browsers claim; it is a fact, not a refusal.
      required: [action, key]
      properties:
        action: { type: string, enum: [step-next, step-back, pay, park, search] }
        key: { type: string, description: "Canonical chord spelling, modifiers in shift-ctrl-alt order" }
        browser_owned: { type: boolean }
    PosHotkeys:
      type: object
      required: [source, keys]
      properties:
        source: { type: string, enum: [user, dealer, platform, default] }
        keys:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/PosHotkey" }
    PosAccountStanding:
      type: object
      description: >-
        One customer's standing, and no more of it than that. The standing
        word is always present and names the case; the three older fields
        are present exactly when they were before: past_due_cents and
        oldest_bucket only when money is past due, on_hold only when true.
      required: [standing]
      properties:
        standing:
          type: string
          enum: [walk_in, clear, past_due, on_hold]
        past_due_cents: { type: integer, format: int64 }
        oldest_bucket: { type: string, enum: ["30", "60", "90+"] }
        on_hold: { type: boolean, description: "Mirrors the credit gate; enforcement happens at the ring, not here" }
    PosPaymentGrant:
      type: object
      description: Whether the caller holds the grant the till's payment routes require
      required: [can_take_payment]
      properties:
        can_take_payment: { type: boolean }
    PosAddonSuggestion:
      type: object
      description: >-
        One suggestion tile. list_price_cents is display only; the add path
        re-prices through the engine.
      required: [product_id, sku, name, uom, default_qty, has_image]
      properties:
        product_id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        size_line: { type: string }
        uom: { type: string }
        default_qty: { type: number }
        list_price_cents: { type: [integer, "null"], format: int64 }
        price_uom: { type: string }
        has_image: { type: boolean }
        application: { type: string }
    PosAddonSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/PosAddonSuggestion" }

    # ── POS: policy and workspace ────────────────────────────────────────────
    PosTaxRate:
      type: object
      description: >-
        The counter-readable tax facts: the rate the ring binds (read through
        the ring's own assessor) and the configured rounding rule.
      required: [jurisdiction, reason_code, rate_bps, round_mode]
      properties:
        jurisdiction: { type: string, enum: [ON] }
        reason_code: { type: string, enum: [STD_ON_HST_13] }
        rate_bps: { type: integer, format: int32, description: Basis points, 1300 is 13 percent }
        round_mode:
          type: string
          enum: [INVOICE_TOTAL, PER_LINE]
          description: The org default row's stored rounding rule; the header tax today rounds half-up once at the invoice total either way
    PosPolicy:
      type: object
      description: >-
        The branch-overridable POS behavior policy; branch_id empty is the
        org-wide default row. quick_chip_set empty on the wire means the service
        derived nothing and the client falls back to the full chip row.
      required: [branch_id, cod_enabled, restocking_fee_bps, notes, line_presentation, quick_chips_enabled, workspace_split_pct, workspace_arrangement, lookup_presentation, margin_visibility, balance_visibility]
      properties:
        branch_id: { type: string, description: Empty is the org-wide default row }
        cod_enabled: { type: boolean }
        restocking_fee_bps: { type: integer, format: int32, description: Fee on an approved portal return; 0 is none }
        notes: { type: string }
        line_presentation: { type: string, enum: [LINES, CARDS] }
        quick_chips_enabled: { type: boolean }
        workspace_split_pct: { type: integer, format: int32, minimum: 20, maximum: 80, description: The lookup panel's default share of the workspace width }
        workspace_arrangement: { type: string, enum: [LOOKUP_LEFT, SALE_LEFT] }
        lookup_presentation: { type: string, enum: [CARDS, ROWS] }
        margin_visibility:
          type: string
          enum: [MANAGER_UP, ALL_STAFF, HIDDEN]
          description: Who may receive margin and estimated-profit fields in POS payloads
        balance_visibility:
          type: string
          enum: [ALL_STAFF, MANAGER_UP, HIDDEN]
          description: Who may receive a customer's past-due balance on the customer step
        quick_chip_set:
          type: array
          items: { type: string }
    PosPolicyChange:
      type: object
      description: >-
        One knob that moved. who is already a display name resolved server-side;
        no user id is ever put on the wire. The wire shape matches the other
        settings screens so one client component renders all of them.
      required: [field, before, after]
      properties:
        field: { type: string }
        before: { type: string }
        after: { type: string }
        who: { type: string }
        when: { type: string, format: date-time }
    PosPolicyChangePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosPolicyChange" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    PosWorkspacePrefs:
      type: object
      description: The resolved workspace for the calling user (source user) or the dealer defaults (source dealer); whole-or-absent, never a field merge
      required: [split_pct, arrangement, lookup_collapsed, sale_collapsed, lookup_presentation, margin_hidden, source]
      properties:
        split_pct: { type: integer, format: int32, minimum: 20, maximum: 80 }
        arrangement: { type: string, enum: [LOOKUP_LEFT, SALE_LEFT] }
        lookup_collapsed: { type: boolean }
        sale_collapsed: { type: boolean }
        lookup_presentation: { type: string, enum: [CARDS, ROWS] }
        margin_hidden: { type: boolean, description: The margin quick-hide toggle }
        source: { type: string, enum: [user, dealer] }
        replayed: { type: boolean }
    PosWorkspaceSaveInput:
      type: object
      description: One person saving their own workspace; idempotency_key is minted once per save and retried verbatim
      required: [idempotency_key, split_pct, arrangement, lookup_collapsed, sale_collapsed, lookup_presentation, margin_hidden]
      properties:
        idempotency_key: { type: string, format: uuid }
        split_pct: { type: integer, format: int32, minimum: 20, maximum: 80 }
        arrangement: { type: string, enum: [LOOKUP_LEFT, SALE_LEFT] }
        lookup_collapsed: { type: boolean }
        sale_collapsed: { type: boolean }
        lookup_presentation: { type: string, enum: [CARDS, ROWS] }
        margin_hidden: { type: boolean }

    # ── POS: returns ─────────────────────────────────────────────────────────
    PosReturnLineInput:
      type: object
      description: One returned line, a fraction or all of one original order line
      required: [order_line_id, qty_base, reason_code]
      properties:
        order_line_id: { type: string, format: uuid }
        qty_base: { type: number }
        reason_code: { type: string, enum: [DAMAGED, DEFECT, WRONG_ITEM, NO_LONGER_NEEDED, OTHER] }
        disposition:
          type: string
          enum: [RESTOCK, DAMAGED, NO_RETURN]
          description: >-
            What became of the goods. RESTOCK puts them back on the shelf,
            DAMAGED writes them off, NO_RETURN leaves them with the customer
            (the money reversal only). Goods that never left the shelf are credit
            only whatever is asked. Absent, the return's restock flag decides
            (true RESTOCK, false NO_RETURN).
    PosPickupInput:
      type: object
      description: The optional logistics pickup block on a return
      required: [required, site, requested_date]
      properties:
        required: { type: boolean }
        site: { type: string }
        requested_date: { type: string, format: date }
    PosReturnInput:
      type: object
      description: >-
        The idempotent return body. Idempotency keys with the reserved rreq:
        prefix are internal to the return-request approval rail and are refused
        on this public route.
      required: [idempotency_key, order_id, order_no, lines, refund_method, reason, restock, till_session_id]
      properties:
        idempotency_key: { type: string, format: uuid }
        order_id: { type: string, format: uuid, description: One of order_id or order_no identifies the original sale }
        order_no: { type: string }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosReturnLineInput" }
        refund_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
        reason: { type: string }
        restock: { type: boolean }
        till_session_id: { type: string, format: uuid, description: "CASH refunds: the open drawer" }
        pickup: { $ref: "#/components/schemas/PosPickupInput" }
        fee_bps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Optional restocking fee, honored only on the ACCOUNT_CREDIT rail; 0 is no fee
    PosReturn:
      type: object
      description: The committed return, returned verbatim on an idempotent replay
      required: [return_id, return_no, order_id, invoice_id, refund_method, subtotal_cents, tax_cents, total_cents, pickup_status, status, replayed]
      properties:
        invoice_offset_cents: { type: integer, format: int64, description: "The part of an order that is not fully paid that came off its open invoice; the rail moved the rest" }
        payment_note: { type: string, description: "The split in words, when there was one" }
        applied_cents: { type: integer, format: int64, description: A swap child; the part of the total spent on the new order, the rail moved the rest }
        return_id: { type: string, format: uuid }
        return_no: { type: string }
        order_id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        refund_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64, description: The restocking fee; the credited amount is total minus fee }
        refund_payment_id: { type: string, format: uuid, description: The REFUNDED payments row (CASH and CARD rails) }
        pickup_status: { type: string, enum: [NONE, REQUESTED, SCHEDULED, DONE] }
        status: { type: string, enum: [COMMITTED] }
        replayed: { type: boolean }
    PosRefundApproval:
      type: object
      description: >-
        The approval a refused return names: the amount over which the refund
        needs a manager, and the role keys that hold the approval, as the
        dealer's configuration sets them.
      required: [amount_cents, approvers]
      properties:
        amount_cents:
          type: integer
          format: int64
          description: The approval amount, in integer cents; a refund at or under it needs no approver
        approvers:
          type: array
          description: >-
            The role keys that may approve (sales_manager, branch_manager),
            matching the configuration's keys; the till's screens map them to
            display labels.
          minItems: 1
          items: { type: string }
    PosReturnableLine:
      type: object
      description: One original line with prior-return sums netted for display
      required: [order_line_id, product_id, description, qty_sold, qty_returned, unit_price_cents, line_total_cents, tax_cents]
      properties:
        order_line_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        description: { type: string }
        qty_sold: { type: number }
        qty_returned: { type: number }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
    PosReturnLookup:
      type: object
      description: The pre-return read of the original sale
      required: [order_id, order_no, branch_id, customer_id, invoice_id, sale_tender, card_refundable, returnable, not_returnable_reason, lines]
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        sale_tender: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE] }
        card_refundable: { type: boolean, description: The original CARD capture carried a gateway reference }
        returnable: { type: boolean, description: Whether the order can be returned now }
        not_returnable_reason: { type: string, description: "In words, why not (an order a quote became has no live finalised invoice yet); empty when returnable" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosReturnableLine" }
    PosReturnAcrossInput:
      type: object
      description: >-
        The idempotent credit-note-across-orders body. One customer, one
        branch, one refund rail; each line may carry its own disposition, and
        the whole-note restock flag stands for lines that name none; the drawer
        (till_session_id) is needed only by a CASH refund. No fee field, the
        flow carries no restocking fee.
      required: [idempotency_key, customer_id, orders, refund_method, reason]
      properties:
        idempotency_key: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        orders:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosReturnAcrossOrder" }
        refund_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
        reason: { type: string }
        restock: { type: boolean }
        till_session_id: { type: string, format: uuid, description: "CASH refunds: the open drawer" }
    PosReturnAcrossOrder:
      type: object
      description: "One order's share of a returns-across note, the order id and its returned lines."
      required: [order_id, lines]
      properties:
        order_id: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosReturnLineInput" }
    PosReturnPreviewInput:
      type: object
      description: >-
        The draft of a returns-across note, without a key or a drawer. With a
        refund_method of CASH or CARD the answer carries, per order, the split the
        commit will make on an order that is not fully paid.
      required: [customer_id, orders]
      properties:
        customer_id: { type: string, format: uuid }
        refund_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
        orders:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosReturnAcrossOrder" }
    PosReturnPreviewLine:
      type: object
      required: [order_line_id, qty_base, subtotal_cents, tax_cents, total_cents]
      properties:
        order_line_id: { type: string, format: uuid }
        qty_base: { type: number }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
    PosReturnPreviewOrder:
      type: object
      required: [order_id, order_no, subtotal_cents, tax_cents, total_cents, lines]
      properties:
        rail_cents: { type: integer, format: int64, description: "With a refund_method: what goes back in cash or card" }
        invoice_offset_cents: { type: integer, format: int64, description: "With a refund_method: what comes off the order's open invoice" }
        rail_note: { type: string, description: "The split in words, empty when nothing is split" }
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosReturnPreviewLine" }
    PosReturnPreview:
      type: object
      description: >-
        The credit so far of a draft note: the figures the commit would book,
        priced by the commit's own function.
      required: [customer_id, branch_id, subtotal_cents, tax_cents, total_cents, orders]
      properties:
        rail_cents: { type: integer, format: int64, description: "With a refund_method: the sum of what goes back in cash or card" }
        invoice_offset_cents: { type: integer, format: int64, description: "With a refund_method: the sum of what comes off the open invoices" }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64, description: The note total with tax }
        orders:
          type: array
          items: { $ref: "#/components/schemas/PosReturnPreviewOrder" }
    PosSwapInput:
      type: object
      description: >-
        The idempotent swap body: one customer, the orders and lines coming back,
        the lines going out. The new order's branch is the credit note's one
        branch; the shortfall tender defaults to CASH.
      required: [idempotency_key, customer_id, orders, till_session_id, lines]
      properties:
        idempotency_key: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        orders:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosReturnAcrossOrder" }
        reason: { type: string }
        leftover_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT], description: Optional; must be the original tender when named }
        till_session_id: { type: string, format: uuid }
        sale_type: { type: string, enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED], default: COLLECT_NOW }
        tender: { type: string, enum: [ACCOUNT, CASH, CARD, CHEQUE], description: The shortfall's tender }
        payment_token: { type: string, description: "CARD shortfall only: client-tokenized; never a PAN" }
        card_type: { type: string, enum: [DEBIT, CREDIT, PREPAID, UNKNOWN] }
        signature_ref: { type: string }
        requested_date: { type: string, format: date }
        notes: { type: string }
        po_job_ref: { type: string, maxLength: 64 }
        salesperson_id: { type: string }
        job_address: { type: string, maxLength: 200 }
        job_reference: { type: string, maxLength: 64 }
        relief: { $ref: "#/components/schemas/PosReliefDecision" }
        discount: { $ref: "#/components/schemas/PosDiscountInput" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PosLineInput" }
    PosSwapNewOrder:
      type: object
      required: [subtotal_cents, tax_cents, total_cents]
      properties:
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
    PosSwapPreview:
      type: object
      description: The server's figures for a draft swap (applied + leftover = credit; applied + shortfall = new order total)
      required: [credit, new_order, applied_cents, leftover_cents, shortfall_cents, leftover_method]
      properties:
        credit: { $ref: "#/components/schemas/PosReturnPreview" }
        new_order: { $ref: "#/components/schemas/PosSwapNewOrder" }
        applied_cents: { type: integer, format: int64, description: The part of the credit spent on the new order }
        leftover_cents: { type: integer, format: int64, description: The part going back by the original tender }
        shortfall_cents: { type: integer, format: int64, description: The part of the new order the tender pays }
        leftover_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
    PosSwapResult:
      type: object
      description: The committed swap, returned verbatim on an idempotent replay; both documents carry swap_id
      required: [swap_id, note, sale, credit_cents, applied_cents, leftover_cents, shortfall_cents, leftover_method, replayed]
      properties:
        swap_id: { type: string, format: uuid }
        note: { $ref: "#/components/schemas/PosReturnNote" }
        sale: { $ref: "#/components/schemas/PosSale" }
        credit_cents: { type: integer, format: int64 }
        applied_cents: { type: integer, format: int64 }
        leftover_cents: { type: integer, format: int64 }
        shortfall_cents: { type: integer, format: int64 }
        leftover_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
        replayed: { type: boolean }
    PosReturnNote:
      type: object
      description: >-
        The committed credit note across orders, returned verbatim on an
        idempotent replay. The totals are summed over the children; each child
        keeps its own return number.
      required: [note_id, note_no, customer_id, branch_id, refund_method, subtotal_cents, tax_cents, total_cents, returns, replayed]
      properties:
        swap_id: { type: string, format: uuid, description: Present when the note is the credit of a swap }
        note_id: { type: string, format: uuid }
        note_no: { type: string }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        refund_method: { type: string, enum: [CASH, CARD, ACCOUNT_CREDIT] }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        returns:
          type: array
          description: The note's children, one per order, each its own committed return
          items: { $ref: "#/components/schemas/PosReturn" }
        replayed: { type: boolean }
    PosCustomerLine:
      type: object
      description: >-
        One line of one order in the customer lines read: the open quantity is
        the commit guard's own netting (qty sold less every returned qty), the
        money and tax already returned ride the same sums, and the shelf state
        says whether the goods ever left the shelf (NOT_FULFILLED,
        PARTIALLY_FULFILLED, FULFILLED).
      required: [order_line_id, product_id, sku, description, qty_sold, qty_returned, qty_open, unit_price_cents, line_total_cents, tax_cents, money_returned_cents, tax_returned_cents, shelf_state]
      properties:
        order_line_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        description: { type: string }
        qty_sold: { type: number }
        qty_returned: { type: number }
        qty_open: { type: number }
        unit_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        money_returned_cents: { type: integer, format: int64 }
        tax_returned_cents: { type: integer, format: int64 }
        shelf_state: { type: string, enum: [NOT_FULFILLED, PARTIALLY_FULFILLED, FULFILLED] }
    PosCustomerOrder:
      type: object
      description: >-
        One order of the customer lines read. Source names where it came from:
        TILL, a committed ring whose facts ride beside it, or QUOTE, an order a
        quote became (an order like any other, carrying no till facts).
      required: [order_id, order_no, branch_id, branch_name, created_at, job_label, source, sale_type, tender, fulfilment_state, invoice_id, card_refundable, lines]
      properties:
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        branch_id: { type: string, format: uuid }
        branch_name: { type: string, description: The branch's name, so the one branch refusal can name the branches }
        created_at: { type: string, format: date-time }
        job_label: { type: string, description: The job address, else the job reference, else the customer's PO or job reference }
        source: { type: string, enum: [TILL, QUOTE] }
        sale_type: { type: string, enum: ["", COLLECT_NOW, COLLECT_LATER, DELIVERED, COD] }
        tender: { type: string, enum: ["", ACCOUNT, CASH, CARD, CHEQUE], description: The original ring's tender; empty on a quote conversion }
        fulfilment_state: { type: string, description: The order's own ladder word, CONFIRMED through FULFILLED }
        invoice_id: { type: string, description: The order's live invoice id; empty when it has none }
        card_refundable: { type: boolean, description: The original CARD capture carried a gateway reference }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosCustomerLine" }
    PosCustomerLines:
      type: object
      description: >-
        The customer lines read's answer. The orders are newest first and
        bounded by the limit; no cursor rides the envelope (a narrower branch
        query is the reader's own drill down).
      required: [customer_id, items]
      properties:
        customer_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/PosCustomerOrder" }
    PosReturnPickup:
      type: object
      description: One row on the logistics pickup queue
      required: [return_id, return_no, order_id, customer_id, branch_id, site, pickup_status, total_cents, created_at]
      properties:
        return_id: { type: string, format: uuid }
        return_no: { type: string }
        order_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        site: { type: string }
        requested_date: { type: string, format: date }
        pickup_status: { type: string, enum: [NONE, REQUESTED, SCHEDULED, DONE] }
        total_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    PosReturnPickupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosReturnPickup" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    PosPickupAdvance:
      type: object
      description: The target pickup status; only REQUESTED to SCHEDULED and SCHEDULED to DONE are valid
      required: [status]
      properties:
        status: { type: string, enum: [SCHEDULED, DONE] }
    PosReturnRequestLine:
      type: object
      description: One requested line with its display facts joined from the original order line
      required: [order_line_id, product_id, description, qty_base]
      properties:
        order_line_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        description: { type: string }
        qty_base: { type: number }
    PosReturnRequest:
      type: object
      description: >-
        One portal-submitted return request. A PENDING request moves no money
        and no stock; approval executes the return rail, rejection records only
        the reason.
      required: [id, request_no, order_id, order_no, customer_id, branch_id, status, reason_code, note, fee_cents, created_at, lines]
      properties:
        id: { type: string, format: uuid }
        request_no: { type: string }
        order_id: { type: string, format: uuid }
        order_no: { type: string }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        branch_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reason_code: { type: string, enum: [DAMAGED, DEFECT, WRONG_ITEM, NO_LONGER_NEEDED, OTHER] }
        note: { type: string, maxLength: 2000 }
        requested_by: { type: string }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        decision_reason: { type: string }
        fee_cents: { type: integer, format: int64 }
        return_id: { type: string, format: uuid }
        return_no: { type: string }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosReturnRequestLine" }
    PosReturnRequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosReturnRequest" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    PosReturnRequestReject:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 2000 }

    # ── POS: parked tickets ──────────────────────────────────────────────────
    PosParkedLineInput:
      type: object
      description: One saved-cart line; no price, prices re-derive from the engine on resume
      required: [product_id, qty_entered, uom_entered]
      properties:
        product_id: { type: string, format: uuid }
        qty_entered: { type: number }
        uom_entered: { type: string }
    PosParkInput:
      type: object
      required: [branch_id, customer_id, sale_type, notes, lines]
      properties:
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, description: Empty is a walk-in }
        sale_type:
          type: string
          enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD]
          default: COLLECT_NOW
        notes: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosParkedLineInput" }
    PosParkedTicket:
      type: object
      description: One saved ticket; no stock reservation
      required: [id, ticket_no, branch_id, sale_type, notes, status, lines, created_at]
      properties:
        id: { type: string, format: uuid }
        ticket_no: { type: string }
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        sale_type: { type: string, enum: [COLLECT_NOW, COLLECT_LATER, DELIVERED, COD] }
        notes: { type: string }
        status: { type: string, enum: [PARKED, RESUMED, DISCARDED] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosParkedLineInput" }
        created_at: { type: string, format: date-time }
    PosParkedTicketPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosParkedTicket" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    PosParkedDiscard:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [DISCARDED] }

    # ── POS: pricing orders ──────────────────────────────────────────────────
    PosPricingOrderLineInput:
      type: object
      required: [product_id, qty_entered, uom_entered]
      properties:
        product_id: { type: string, format: uuid }
        qty_entered: { type: number }
        uom_entered: { type: string }
    PosPricingOrderInput:
      type: object
      required: [branch_id, customer_id, customer_name, notes, valid_until, lines]
      properties:
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, description: Empty is a walk-in or prospect }
        customer_name: { type: string, description: Printable name even for walk-ins }
        notes: { type: string }
        valid_until: { type: string, format: date, description: Empty applies the house default validity }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosPricingOrderLineInput" }
    PosPricingOrderLine:
      type: object
      description: One line with the engine price and the list price snapshotted for comparison
      required: [line_no, product_id, sku, name, qty_entered, uom_entered, unit_price_cents, list_price_cents, line_total_cents]
      properties:
        line_no: { type: integer, format: int32 }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        qty_entered: { type: number }
        uom_entered: { type: string }
        unit_price_cents: { type: integer, format: int64 }
        list_price_cents: { type: integer, format: int64 }
        line_total_cents: { type: integer, format: int64 }
    PosPricingOrder:
      type: object
      description: The committed printable price/compare document
      required: [id, doc_no, branch_id, customer_name, notes, subtotal_cents, tax_cents, total_cents, created_at, lines]
      properties:
        id: { type: string, format: uuid }
        doc_no: { type: string }
        branch_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        notes: { type: string }
        valid_until: { type: string, format: date }
        subtotal_cents: { type: integer, format: int64 }
        tax_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosPricingOrderLine" }
    PosPricingOrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosPricingOrder" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }

    # ── Till: drawer sessions ────────────────────────────────────────────────
    TillSession:
      type: object
      description: One drawer session
      required: [id, branch_id, station, status, opened_by, float_cents, blind_close]
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        station: { type: string }
        status: { type: string, enum: [OPEN, COUNTED, CLOSED] }
        opened_by: { type: string }
        float_cents: { type: integer, format: int64 }
        closing_float_cents: { type: integer, format: int64 }
        blind_close: { type: boolean }
        override_notes: { type: string }
    TillTenderTotal:
      type: object
      description: Per-method expected, actual and lodged totals; variance is derived (actual minus expected)
      required: [method, expected_cents, actual_cents, variance_cents, lodged_cents]
      properties:
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        expected_cents: { type: integer, format: int64 }
        actual_cents: { type: integer, format: int64 }
        variance_cents: { type: integer, format: int64 }
        lodged_cents: { type: integer, format: int64 }
    TillMovement:
      type: object
      description: A paid-in, paid-out, drop or lodgement
      required: [id, movement_type, method, amount_cents, reason, reference]
      properties:
        id: { type: string, format: uuid }
        movement_type: { type: string, enum: [PAID_IN, PAID_OUT, DROP, LODGEMENT] }
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        amount_cents: { type: integer, format: int64, exclusiveMinimum: 0 }
        reason: { type: string }
        reference: { type: string }
    TillDenominationCount:
      type: object
      description: One optional denomination tally row
      required: [phase, denomination_cents, quantity]
      properties:
        phase: { type: string, enum: [OPEN, CLOSE] }
        denomination_cents: { type: integer, format: int64, exclusiveMinimum: 0 }
        quantity: { type: integer, format: int32, minimum: 0 }
    TillSessionDetail:
      type: object
      description: "The operator reopen read: the session header plus its tenders and movements"
      allOf:
        - $ref: "#/components/schemas/TillSession"
        - type: object
          required: [tenders, movements]
          properties:
            tenders:
              type: array
              items: { $ref: "#/components/schemas/TillTenderTotal" }
            movements:
              type: array
              items: { $ref: "#/components/schemas/TillMovement" }
    TillPolicy:
      type: object
      description: The branch variance threshold and close grain
      required: [branch_id, variance_threshold_cents, close_grain, require_blind_close]
      properties:
        branch_id: { type: string, description: Empty is the org-wide default row }
        variance_threshold_cents: { type: integer, format: int64 }
        close_grain: { type: string, enum: [SESSION, DAY] }
        require_blind_close: { type: boolean }
    TillCashSummary:
      type: object
      description: The derived cash reconciliation block
      required: [opening_float_cents, expected_cents, counted_cents, over_short_cents]
      properties:
        opening_float_cents: { type: integer, format: int64 }
        expected_cents: { type: integer, format: int64 }
        counted_cents: { type: integer, format: int64 }
        over_short_cents: { type: integer, format: int64 }
    TillZReport:
      type: object
      description: Expected versus actual versus over/short, revealed after the count
      required: [session_id, per_tender, cash, closing_float_cents]
      properties:
        session_id: { type: string, format: uuid }
        per_tender:
          type: array
          items: { $ref: "#/components/schemas/TillTenderTotal" }
        cash: { $ref: "#/components/schemas/TillCashSummary" }
        closing_float_cents: { type: integer, format: int64 }
    TillOpenInput:
      type: object
      description: Declares the opening float and optional opening denominations
      required: [branch_id, station, float_cents, opening_denominations]
      properties:
        branch_id: { type: string, format: uuid }
        station: { type: string }
        float_cents: { type: integer, format: int64 }
        opening_denominations:
          type: array
          items: { $ref: "#/components/schemas/TillDenominationCount" }
    TillOpenResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN] }
    TillOpenLookup:
      type: object
      description: The open-drawer rediscovery answer; open false is an ordinary state
      required: [open]
      properties:
        open: { type: boolean }
        id: { type: string, format: uuid }
        opened_at: { type: string, format: date-time }
    TillMovementInput:
      type: object
      required: [movement_type, method, amount_cents, reason, reference]
      properties:
        movement_type: { type: string, enum: [PAID_IN, PAID_OUT, DROP, LODGEMENT] }
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        amount_cents: { type: integer, format: int64, exclusiveMinimum: 0 }
        reason: { type: string }
        reference: { type: string }
    TillTenderActual:
      type: object
      description: One blind-counted method actual
      required: [method, actual_cents]
      properties:
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        actual_cents: { type: integer, format: int64 }
    TillCountInput:
      type: object
      description: The blind per-tender actuals plus optional close denominations
      required: [tenders, closing_denominations, closing_float_cents]
      properties:
        tenders:
          type: array
          items: { $ref: "#/components/schemas/TillTenderActual" }
        closing_denominations:
          type: array
          items: { $ref: "#/components/schemas/TillDenominationCount" }
        closing_float_cents: { type: integer, format: int64 }
    TillCompleteInput:
      type: object
      description: Reconcile and sign off; override_notes carries the manager's note on an over-threshold close
      required: [override_notes]
      properties:
        override_notes: { type: string }
    TillStatusResult:
      type: object
      description: The small status acknowledgement several till writes return
      required: [status]
      properties:
        status: { type: string }

    # ── Till: AR surface ─────────────────────────────────────────────────────
    TillNSFPolicy:
      type: object
      description: The runtime-config NSF fee and auto-hold policy; a branch row overrides the org default
      required: [branch_id, fee_cents, fee_taxable, fee_account_code, auto_hold, notes]
      properties:
        branch_id: { type: string, description: Empty is the org default }
        fee_cents: { type: integer, format: int64 }
        fee_taxable: { type: boolean }
        fee_account_code: { type: string }
        auto_hold: { type: boolean }
        notes: { type: string }
    TillNSFInput:
      type: object
      description: The bounced-payment request; fee and hold resolve from policy, never from the caller
      required: [reason]
      properties:
        reason: { type: string }
    TillNSFResult:
      type: object
      description: The outcome of an NSF mark
      required: [payment_id, fee_cents, fee_taxable, reversed_cents, reopened_invoices, hold_placed, status]
      properties:
        payment_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        fee_cents: { type: integer, format: int64 }
        fee_taxable: { type: boolean }
        reversed_cents: { type: integer, format: int64 }
        reopened_invoices: { type: integer, format: int32 }
        hold_placed: { type: boolean }
        status: { type: string, enum: [BOUNCED] }
    TillBouncedPayment:
      type: object
      description: One row in the bounced queue, the payment joined to its NSF record
      required: [payment_id, payment_no, branch_id, method, amount_cents, reason, fee_cents, fee_taxable, bounced_at]
      properties:
        payment_id: { type: string, format: uuid }
        payment_no: { type: string }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        amount_cents: { type: integer, format: int64 }
        gateway_ref: { type: string }
        reason: { type: string }
        fee_cents: { type: integer, format: int64 }
        fee_taxable: { type: boolean }
        bounced_at: { type: string, format: date-time }
    TillBouncedPaymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TillBouncedPayment" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    TillCreditHold:
      type: object
      description: One credit hold
      required: [id, customer_id, status, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        source_payment_id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, RELEASED] }
        reason: { type: string }
        release_reason: { type: string }
        placed_by: { type: string }
        released_by: { type: string }
        created_at: { type: string, format: date-time }
        released_at: { type: [string, "null"], format: date-time }
    TillCreditHoldPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TillCreditHold" }
        next_cursor: { type: [string, "null"] }
        limit: { type: integer, format: int32 }
    TillReleaseHoldInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    TillPaymentAttempt:
      type: object
      description: >-
        One declined or errored gateway attempt. attempted_by is stamped
        server-side from the authenticated caller and is never client-supplied.
      required: [idempotency_key, customer_id, amount_cents, method, processor, result, detail, branch_id]
      properties:
        idempotency_key: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        amount_cents: { type: integer, format: int64, exclusiveMinimum: 0 }
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        processor: { type: string }
        result: { type: string, enum: [DECLINED, ERROR] }
        detail: { type: string }
        branch_id: { type: string, format: uuid }
    TillAllocationRecord:
      type: object
      description: >-
        One payment-to-invoice application with attribution. reversed_by_nsf
        marks a historical allocation reconstructed from the audit trail after
        an NSF reversal deleted the live rows; such records carry no
        invoice_no.
      required: [invoice_id, invoice_no, amount_cents, allocated_at]
      properties:
        invoice_id: { type: string, format: uuid }
        invoice_no: { type: string }
        amount_cents: { type: integer, format: int64 }
        allocated_by: { type: string, description: Empty for a portal or customer-initiated payment }
        allocated_by_name: { type: string }
        allocated_at: { type: string, format: date-time }
        reversed_by_nsf: { type: boolean }
    TillPaymentHistory:
      type: object
      description: One payment header (who took it, when, how) plus its application history
      required: [payment_id, payment_no, branch_id, method, status, amount_cents, received_at, allocations]
      properties:
        payment_id: { type: string, format: uuid }
        payment_no: { type: string }
        customer_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        status: { type: string, enum: [RECEIVED, DEPOSITED, BOUNCED, REFUNDED, VOID, PENDING] }
        amount_cents: { type: integer, format: int64 }
        gateway_ref: { type: string }
        received_at: { type: string, format: date-time }
        received_by: { type: string }
        received_by_name: { type: string }
        reversed: { type: boolean, description: Set when the payment bounced and its live allocations were reversed }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/TillAllocationRecord" }
    TillInvoicePaymentRecord:
      type: object
      description: One payment or credit applied to an invoice, with both attributions
      required: [payment_id, payment_no, method, status, amount_cents, payment_amount_cents, allocated_at, received_at]
      properties:
        payment_id: { type: string, format: uuid }
        payment_no: { type: string }
        method: { type: string, enum: [CASH, CHEQUE, CARD, EFT, OTHER] }
        status: { type: string, enum: [RECEIVED, DEPOSITED, BOUNCED, REFUNDED, VOID, PENDING] }
        amount_cents: { type: integer, format: int64, description: The slice applied to this invoice }
        payment_amount_cents: { type: integer, format: int64, description: The whole payment }
        allocated_by: { type: string }
        allocated_by_name: { type: string }
        allocated_at: { type: string, format: date-time }
        received_by: { type: string }
        received_by_name: { type: string }
        received_at: { type: string, format: date-time }
    TillInvoicePayments:
      type: object
      description: "The per-invoice settlement view: every payment applied to it, attributed"
      required: [invoice_id, invoice_no, branch_id, items]
      properties:
        invoice_id: { type: string, format: uuid }
        invoice_no: { type: string }
        branch_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/TillInvoicePaymentRecord" }
