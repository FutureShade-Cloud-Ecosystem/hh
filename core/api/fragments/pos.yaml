  # ── POS: returns ───────────────────────────────────────────────────────────
  /api/v1/pos/returns:
    post:
      operationId: posCreateReturn
      tags: [staff-pos]
      summary: Commit a return against an original sale (idempotent; 200 on a replay)
      description: >-
        One of order_id or order_no identifies the original sale. refund_method
        CASH pays out of the open drawer named by till_session_id, CARD reverses
        the original capture, ACCOUNT_CREDIT credits the customer's account.
        fee_bps is honored only on the ACCOUNT_CREDIT rail. A return above the
        dealer's approval amount is refused to a caller whose role does not
        hold the approval, the amount and the approver roles named in the
        refusal body; sent again with an approver's credential in
        X-Approver-Authorization, it commits as the approver's decision, with
        the clerk named beside them.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/XApproverAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnInput"
      responses:
        "201":
          description: The committed return (200 with the same body on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturn"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PosRefundApprovalRequired" }
        "503":
          description: The approver credential could not be checked, or the dealer's role configuration is not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pos/returns/lookup:
    get:
      operationId: posLookupReturn
      tags: [staff-pos]
      summary: Read an original sale's lines with what is still returnable
      description: >-
        The pre-return read the counter uses to build a return, with prior
        returns netted per line. Read-only; the commit re-guards everything.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: order_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: order_no, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The original sale with returnable quantities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnLookup"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pos/returns/customer-lines:
    get:
      operationId: posCustomerReturnLines
      tags: [staff-pos]
      summary: Read one customer's every sales order with its returnable lines
      description: >-
        The pre-return read of the returns-across flow: every sales order the
        customer holds, till rings and quote conversions alike, newest first,
        bounded by limit. Each line's open quantity is the same netting the
        commit guard reads, so the screen and the guard cannot disagree. A
        scoped caller sees only the branches their resolved authority reaches,
        the other branches' orders simply absent; naming an unreachable branch
        is the wall's 403. The house WALK-IN account is answered only through
        the number filter, never as a list of every walk in sale, and the
        filter never leaves that account's own orders.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: customer_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: number, in: query, required: false, schema: { type: string }, description: "A receipt or order number (an order number or an invoice number, with or without the hash, or the bare digits a branch's numbers end in) narrowing the answer to that order; required for the WALK-IN account" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The customer's orders with their returnable lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosCustomerLines"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The house WALK-IN account asked without a receipt or order number (its sales are never listed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pos/returns-across:
    post:
      operationId: posCreateReturnAcross
      tags: [staff-pos]
      summary: Commit one credit note across several orders of one customer (idempotent; 200 on a replay)
      description: >-
        The credit note across orders: several orders of ONE customer at ONE
        branch returned in ONE transaction, each order keeping its own return
        number and its own journal, the note holding the totals summed over
        its children. The approval threshold judges the note total. Idempotent
        on the note's own key; keys in the reserved rreq: namespace are
        refused. No restocking fee rides this flow.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/XApproverAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnAcrossInput"
      responses:
        "201":
          description: The committed note (200 with the same body on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnNote"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PosRefundApprovalRequired" }
        "422":
          description: >-
            A well-formed note the shape refuses: account credit for the house
            WALK-IN account (it goes back to cash or card), another customer's order, an order of another branch, one order
            twice, or an over-return on any order (the whole note refuses).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The approver credential could not be checked, or the dealer's role configuration is not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pos/returns/preview:
    post:
      operationId: posPreviewReturnAcross
      tags: [staff-pos]
      summary: Preview the credit of a draft note across orders, priced exactly as the commit prices it
      description: >-
        The credit so far: the draft note's lines (order, order line, quantity)
        priced by the commit's own pricing function, per line, per order and
        for the note, money and tax. Nothing is written and no lock is taken.
        The same shape rules and walls as the commit answer in the commit's own
        words (the branch wall, one branch, one customer, the house WALK-IN
        account, an over-return, a line sent twice).
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: prices a draft credit note through the commit's own pricing function and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnPreviewInput"
      responses:
        "200":
          description: The credit the note would book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            A well-formed draft the shape refuses, in the commit's words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pos/swaps:
    post:
      operationId: posCreateSwap
      tags: [staff-pos]
      summary: Ring a swap, a credit note across orders and a new order in one move (idempotent; 200 on a replay)
      description: >-
        The goods coming back (orders and lines, as the credit note takes them)
        and the goods going out (the new order's lines) in ONE transaction. The
        credit is spent on the new order; what the new order does not take goes
        back by the original tender (leftover_method, which the server derives
        and refuses to differ from); what it takes beyond the credit is paid by
        tender (CASH default, CARD, CHEQUE, ACCOUNT). Every source order's
        invoice must be paid: a swap spends credit already in hand. The credit
        note and the new order carry the swap's id and point at each other. The
        approval threshold judges the credit note total. Idempotent on the
        swap's key; the figures are the server's, see the swap preview.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/XApproverAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSwapInput"
      responses:
        "201":
          description: The committed swap (200 with the same body on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSwapResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { description: The card shortfall was declined, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PosRefundApprovalRequired" }
        "422":
          description: >-
            A well-formed swap the shape refuses: a source order with an open
            invoice, the house WALK-IN account, a leftover rail that is not the
            original tender, an over-return, a priced line the ring refuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The processor refused the leftover refund; nothing was booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The approver credential could not be checked, or the dealer's role configuration is not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pos/swaps/preview:
    post:
      operationId: posPreviewSwap
      tags: [staff-pos]
      summary: Preview a swap's server figures, writing nothing
      description: >-
        The credit (priced as the commit prices it), the new order (priced as
        the ring prices it), the part of the credit spent on it, the leftover
        going back and the shortfall to collect, with the same walls and words
        as the swap.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: prices a draft swap through the commit's own pricing functions and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSwapInput"
      responses:
        "200":
          description: The swap's figures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSwapPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: A well-formed draft the shape refuses, in the swap's words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pos/returns/pickups:
    get:
      operationId: posListReturnPickups
      tags: [staff-pos]
      summary: List the logistics pickup queue for a branch
      description: The REQUESTED and SCHEDULED returns waiting on a pickup.
      x-role: requireStaff
      x-access:
        surfaces: [dispatch-board]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: branch_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The page of pickups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnPickupPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/returns/{id}/pickup:
    post:
      operationId: posAdvanceReturnPickup
      tags: [staff-pos]
      summary: Advance a return's pickup one step (REQUESTED to SCHEDULED to DONE)
      description: The queue only walks forward; any other transition is a conflict.
