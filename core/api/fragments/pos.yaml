        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
      responses:
        "200":
          description: The page of return requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnRequestPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/return-requests/{id}/approve:
    post:
      operationId: posApproveReturnRequest
      tags: [staff-pos]
      summary: Approve a pending return request, executing the return rail
      description: >-
        Executes the existing return rail as an ACCOUNT_CREDIT refund with
        restock and the branch's restocking fee, attributed to the approver.
        Decisions serialize on the request row; a decided request is a conflict.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The approved request with its linked return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnRequest"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/pos/return-requests/{id}/reject:
    post:
      operationId: posRejectReturnRequest
      tags: [staff-pos]
      summary: Reject a pending return request with a reason
      description: >-
        Records the decision and the reason; nothing else moves. If the approve
        rail already committed money under this request, rejection is refused so
        the request converges with the money that moved.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReturnRequestReject"
      responses:
        "200":
          description: The rejected request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnRequest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── POS: parked tickets ────────────────────────────────────────────────────
  /api/v1/pos/parked:
