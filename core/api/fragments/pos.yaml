      x-access:
        surfaces: [dispatch-board]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPickupAdvance"
      responses:
        "200":
          description: The pickup after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReturnPickup"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/pos/return-requests:
    get:
      operationId: posListReturnRequests
      tags: [staff-pos]
      summary: List the portal return-request approval queue
      description: Oldest PENDING first so the queue drains in arrival order.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
