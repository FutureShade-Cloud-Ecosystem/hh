# Fragment: ERP modules pos + till (A-19 counter sales, A-03 cash drawer, A-05 AR
# NSF/credit holds). Sources: hardscapeos_dibbits/backend/internal/pos and
# .../internal/till (non-test Go files), guards resolved from the RegisterRoutes
# call sites in cmd/server/main.go (both take RequireStaff, RequireManager,
# RequireAdmin). The /api/v1/ar routes are registered by the till handler and are
# tagged staff-till here.

paths:
  # ── POS: the sale ring ─────────────────────────────────────────────────────
  /api/v1/pos/sales:
    post:
      operationId: posCreateSale
      tags: [staff-pos]
      summary: Ring a counter sale (idempotent on idempotency_key; 200 on a replay)
      description: >-
        One atomic sale: order, invoice and tender composed in a single
        transaction. The price is never in the body; every line is resolved
        server-side. tender is ignored when tenders carries a split settlement
        (2 to 6 legs that must sum exactly to the sale total).
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSaleInput"
      responses:
        "201":
          description: The committed sale (200 with the same body on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSale"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: >-
            A card leg was declined: no money moved for that leg and any card
            already charged for this sale was reversed. The error word
            card_charge_card_declined names the card case beside the till's
            own decline word; the client clears its key and may re-ring.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PosSaleUnprocessable" }
    get:
      operationId: posLookupSales
      tags: [staff-pos]
      summary: Search past sales by branch, drawer session, text term or day bounds
      description: >-
        The counter's past-sale and till-session recall. q matches order number,
        invoice number, customer name or account number. from and to are
        inclusive civil-day bounds resolved in the dealer's own zone. A
        branch-scoped caller must name a branch it can reach.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: branch_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: till_session_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200":
          description: The page of matching sales, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSaleSummaryPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/sales/{id}:
    get:
      operationId: posGetSale
      tags: [staff-pos]
      summary: Reopen one committed sale with its resolved lines
      description: >-
        The operator-reopen read. Carries no evidence identifiers and no flow
        log; the deep evidence view is an admin surface, not this route.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The sale view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSaleView"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pos/sale-preview:
    post:
      operationId: posSalePreview
      tags: [staff-pos]
      summary: Read the totals the ring would compute for this ticket, writing nothing
      description: >-
        The read-only sale preview. The body is the sale's own (lines,
        customer, branch, sale type, fulfilment, relief) without any
        tender, and the answer is the server-resolved subtotal, each tax
        line and the total in integer cents, exactly as the ring would
        compute them for that body: the preview prices the ticket through
        the ring's own pricing and tax resolver, never a copy. Writes
        nothing: no order, no hold, no number used, no replay key. Staff
        only, the same role walls the sale takes. A ticket that collects
        no tax shows no tax line and its total is its subtotal.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: prices a ticket through the ring's own resolver and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSalePreviewInput"
      responses:
        "200":
          description: The ticket's own subtotal, tax lines and total, as the ring computes them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSalePreview"
        "422": { $ref: "#/components/responses/PosSaleUnprocessable" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/pay-balance:
    get:
      operationId: posFindPayBalance
      tags: [staff-pos]
      summary: Find the orders that owe money, by order number, customer name or phone
      description: >-
        The Pay balance find: the matching orders that owe money (an open
        invoice balance, or an order total nothing has invoiced yet under a
        pay before release shape), each row carrying the order number, the
        customer, the job, the fulfilment, the order total, every payment so
        far with its method and amount, still owed, and held or not (the pay
        before release hold, with its words). Branch fenced: a branch scoped
        caller finds only their branches' orders, another branch's order is
        simply not found.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: The order number, customer name or phone to match
      responses:
        "200":
          description: The matching orders that owe money, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosOwingOrderList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: posTakePayBalance
      tags: [staff-pos]
      summary: Take the whole balance of one order by CASH or CARD (idempotent on idempotency_key; 200 on a replay)
      description: >-
        The Pay balance take. No part payments at this door: an amount that
        is not the whole balance is refused in words, and an already paid
        order is refused in words. The card goes through the card charge
        rail with its attempt store, idempotent by key; a replay answers the
        first result and charges nothing. The payment allocates to the
        order's invoice or invoices, and the pay before release hold lifts
        with the payment in the same transaction. The answer carries what
        the receipt and the after card need: paid in full, released to
        picking or not, and the money trail.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPayBalanceTakeInput"
      responses:
        "201":
          description: The taken balance (200 with the same shape on an idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosPayBalanceTaken"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: >-
            The card was declined: no money moved and nothing was written.
            The error word card_charge_card_declined names the case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The order is paid in full (the desk's own words), or one of the
            card charge answers the sale route also carries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/PosPayBalanceWholeOnly" }
  /api/v1/pos/assess-relief:
    post:
      operationId: posAssessRelief
      tags: [staff-pos]
      summary: Assess per-transaction tax relief for the current ticket
      description: >-
        A per-transaction assessment only: it never references a permanent
        customer exemption flag and carries no card-image or scan upload. The
        answer is masked-only; the binding collected tax stays the flat
        provisional rate while the outcome records the auditable why.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: computes the ticket's tax relief and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReliefAssessInput"
      responses:
        "200":
          description: The relief outcome, masked-only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReliefOutcome"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/signatures:
    post:
      operationId: posCaptureSignature
      tags: [staff-pos]
      summary: Capture a signature through the wired provider (legacy shape)
      description: >-
        The original capture shape (purpose, ref_type, ref_id). When the wired
        provider is the typed-name provider this shape is refused: an
        attestation needs a typed name and an explicit affirmation, which this
        body cannot carry.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSignatureCapture"
      responses:
        "200":
          description: The opaque signature reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSignatureRef"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/signatures/typed:
    post:
      operationId: posCaptureTypedSignature
      tags: [staff-pos]
      summary: Capture a typed-name attestation (typed name plus explicit affirmation)
      description: >-
        The electronic attestation: who typed their name, that they explicitly
        affirmed, and what they affirmed it against. The payload is sealed
        before it is stored; a blank name or a missing affirmation is refused
        before anything is written.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosTypedAttestation"
      responses:
        "200":
          description: The signature reference and the provider that captured it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTypedSignatureRef"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/stock-glance:
    get:
      operationId: posStockGlance
      tags: [staff-pos]
      summary: Read multi-branch on-hand availability for one product
      description: >-
        Display-only availability per branch, with the sell-unit conversion and
        the branch low thresholds where reorder points are authored. Never
        decrements or allocates; a product with no reorder point simply has no
        low threshold for that branch.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: product_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The stock glance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosStockGlance"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/salespeople:
    get:
      operationId: posListSalespeople
      tags: [staff-pos]
      summary: List active staff for the counter's salesperson selector
      description: Id and display name only; no email, no role.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of salespeople
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSalespersonPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/discount-approvers:
    get:
      operationId: posListDiscountApprovers
      tags: [staff-pos]
      summary: List the managers a till person may name as the approver of a discount
      description: >-
        The "Approved by" picker of the counter's Discount action: the active
        logins whose grants reach the branch and whose role the dealer's
        configuration lets clear a price in its own branch (the same
        own-branch clearing list the quote side's floor clearing reads), one
        row per login by display name, with the role label the receipt prints.
        The list is the rule the sale applies to approved_by, so a name from
        this list is a name the ring accepts. The branch wall every branch
        read takes applies.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: lists the managers who may approve a counter discount and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The approvers at the branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosDiscountApproverList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/margin-glance:
    post:
      operationId: posMarginGlance
      tags: [staff-pos]
      summary: Answer margin and estimated profit for the current ticket's lines
      description: >-
        Staff at the door, with the dealer's margin_visibility policy applied at
        the marshal layer: a caller the policy does not allow receives an empty
        object with every margin and profit field byte-absent. A line with no
        cost on file answers empty, never a fake zero.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: computes the ticket's margin picture and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosMarginGlanceInput"
      responses:
        "200":
          description: The margin answer, gated per the dealer's margin_visibility policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosMarginGlance"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/counter-prices:
    post:
      operationId: posCounterPrices
      tags: [staff-pos]
      summary: Read the customer-aware price picture for a screen of products
      description: >-
        Retail beside this account's price, the saving, and the nearest
        unreached bulk threshold. The customer type comes from the account, not
        from the wire; an empty customer_id is the walk-in case and returns
        retail alone. Carries no cost, margin or floor field.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
        reason: computes a price picture for a screen of products and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosCounterPriceInput"
      responses:
        "200":
          description: The resolved price rows and the customer type they were priced for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosCounterPrices"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/quick-picks:
    get:
      operationId: posQuickPicks
      tags: [staff-pos]
      summary: Read the counter's quick-pick tap grid
      description: >-
        The handful of products this yard sells all day, curated through the
        shared settings kit and priced for the customer on the sale. Every
        parameter is optional; an empty query is a walk-in at the default
        branch. With no curation on file the set is derived from top sellers.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: branch_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The grid, its source, and the customer type the tiles were priced for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosQuickPicks"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/hotkeys:
    get:
      operationId: posHotkeys
      tags: [staff-pos]
      summary: Read the counter's key roster
      description: >-
        Which key does what at this dealer's tills, resolved four levels deep
        (user, dealer, platform, default), each level whole-or-absent. An
        unreadable level ships the level below it, never a fault.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: branch_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The resolved key roster and which level answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosHotkeys"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pos/account-standing:
    get:
      operationId: posAccountStanding
      tags: [staff-pos]
      summary: Read one customer's past-due position for the counter
      description: >-
        A fact, not a gate, and every case answers distinctly. The standing
        word names the case: walk_in (no customer_id), clear (nothing past
        due, no hold), past_due, or on_hold (an active credit hold, whether or
        not anything is past due). The past-due amount, the oldest aging
        bucket and the hold flag ride beside it when they apply. A caller the
        dealer's balance_visibility policy withholds balances from, or whose
        grants do not reach the branch, is a 403; an unknown customer is a 404;
        a malformed customer_id is a 400; a read that could not be made (the
        AR, hold or policy read failed) is a 503. Never an empty 200. Counter
        Till or Quote Desk at read: the Quote Desk's Convert to Order asks it
        before it confirms.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - { name: branch_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: customer_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The standing answer, always carrying its standing word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosAccountStanding"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: The standing could not be read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/pos/payment-grant:
    get:
      operationId: posPaymentGrant
      tags: [staff-pos]
      summary: Read whether the caller holds the grant the till's payment routes require
      description: >-
        One question a client asks before it offers to take a payment: does
        the signed-in user hold the grant the till sale and the payment on a
        converted quote's order both need (Counter Till at Work)? The answer
        is the role gate's own, the same walk over the caller's whole row of
        roles and the dealer's configuration, taken for the access the
        document annotates on those payment routes, so it moves with them.
        The payment door's own not-selling-role rule is folded in, by the
        one predicate the door calls, so a platform role that passes every
        gate level but is refused the convert and pay is answered false.
        A caller holding the Counter Till or the Quote Desk at read is
        answered, true or false; a caller with neither meets the gate's 403.
        It is a fact about grants only, never an authorisation: the payment
        routes still gate every call.
      x-addition: "the grant check the Quote Desk asks before it offers payment; no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
      responses:
        "200":
          description: Whether the caller holds the payment grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosPaymentGrant"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: The grant could not be read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/pos/addon-suggestions:
    get:
      operationId: posAddonSuggestions
      tags: [staff-pos]
      summary: Read suggested add-on tiles for the ticket's products
      description: >-
        product_ids is the ticket's product ids, comma-separated. An empty
        ticket or an empty answer returns an empty list, never an error.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, quote-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: product_ids
          in: query
          required: false
          description: Comma-separated product ids already on the ticket
          schema: { type: string }
      responses:
        "200":
          description: The suggestion strip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosAddonSuggestions"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── POS: policy, workspace ─────────────────────────────────────────────────
  /api/v1/pos/tax-rate:
    get:
      operationId: posGetTaxRate
      tags: [staff-pos]
      summary: Read the tax rate the ring binds and its rounding rule
      description: >-
        The rate the ring binds, read through the same assessor the ring
        assesses with, so at the moment of the read the counter's display and
        the ring's math agree. Through the wired seam this holds for every
        ticket the counter can ring today, a relief ticket too: the relief
        reasons are evidence-gated and the seam carries no evidence, so the
        relief reason rides the ticket while this rate binds.
        MANUAL_TAX_REVIEW resolves its own ungated row, equal to the standard
        today and separately editable, and an effective-dated rate row change
        between the read and the ring moves the ring's rate. jurisdiction and
        reason_code are the standard-rated Ontario facts the read answers.
        The header tax today rounds half-up once at the invoice total;
        round_mode PER_LINE is stored but not yet applied at ring, so the
        word says what is configured, not what the ring does yet.
      x-addition: "the counter-readable tax rate (row 661); no ERP source route"
      x-role: requireStaff
      x-access:
        surfaces: [counter-till]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
      responses:
        "200":
          description: The rate and the rounding rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosTaxRate"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
