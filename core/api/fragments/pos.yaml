          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosParkedTicket"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      operationId: posListParked
      tags: [staff-pos]
      summary: List parked tickets for a branch
      x-role: requireStaff
      x-access:
