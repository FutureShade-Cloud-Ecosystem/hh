  # --- Price-file import (upload, map, preview, apply) ------------------------

  /api/v1/pricing/price-file/vendors:
    get:
      operationId: pricingListPriceFileVendors
      tags: [staff-pricing]
      summary: List the manufacturers the price-file import can run for
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of vendors with their profile state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPriceFileVendorPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/pricing/price-file/preview:
    post:
      operationId: pricingPreviewPriceFile
      tags: [staff-pricing]
      summary: Diff an uploaded price file against the retail anchor, writing nothing
      description: >-
        A read despite being a POST with an upload: the preview is a pure
        function of (file, mapping, catalog, policy) and touches no table. The
        body is multipart/form-data with the file, the vendor, an optional
        column mapping and an optional effective date. Cost columns inside the
        response are gated a second time per caller and are absent entirely for
        a caller without cost visibility.
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
        reason: diffs an uploaded price file against the anchor and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: limit
          in: query
          required: false
          description: Cap on returned line rows; the counts still cover the whole file
          schema: { type: integer, format: int32 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PricingPriceFileForm"
      responses:
        "200":
          description: The preview, with a digest the apply must echo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPriceFilePreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/price-file/apply:
    post:
      operationId: pricingApplyPriceFile
      tags: [staff-pricing]
      summary: Stage the price file as a batch, bound to a preview digest
      description: >-
        The commit: re-derives the whole diff server side from the uploaded
        file rather than trusting the client, and requires the caller to echo
        the preview digest; a mismatched digest conflicts. Same multipart form
        as the preview, with digest required.
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PricingPriceFileForm"
      responses:
        "201":
          description: The staged batch, the run id and the diff counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingPriceFileApplyResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: The file moves no prices, or no manufacturer was picked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/price-file/runs:
    get:
      operationId: pricingListPriceFileRuns
      tags: [staff-pricing]
      summary: List the append-only price-import run history
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      parameters:
