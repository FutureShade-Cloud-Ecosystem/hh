# Fragment: pricing (HardscapeOS backend/internal/pricing).
# 53 routes: the resolver, rules, category policies, customer overrides, the audit
# log, the low-margin reports, quantity breaks, price batches and imports, the
# change log, price files, promotions, clearance, rebates and UOM conversions.
# Guards: readGuard = RequireStaff, writeGuard = RequireManager (cmd/server
# main.go RegisterRoutes and RegisterW4Routes call sites). requirePathUUID is an
# internal guard on every path-parameter route and is listed in x-guards.

paths:
  /api/v1/pricing/resolve:
    post:
      operationId: pricingResolve
      tags: [staff-pricing]
      summary: Resolve one line price through the precedence waterfall
      description: >-
        The read-only resolver: turns (customer, product, qty, uom) into a
        deterministic pre-tax price. cost_cents is caller supplied and basis
        agnostic, expressed per the product base UOM.
        has_approved_override is a request for a below-floor price, decided
        server side against the caller the guard resolved, never an assertion.
      x-role: requireStaff
      x-access:
        surfaces: [counter-till, quote-desk]
        level: read
        reason: computes one line's price through the waterfall and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingResolveRequest"
      responses:
        "200":
          description: The resolved breakdown, pre-tax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingBreakdown"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: No UOM conversion factor, no retail anchor, or a bad reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/rules:
    get:
      operationId: pricingListRules
      tags: [staff-pricing]
      summary: List pricing rules
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: customer_type
          in: query
          required: false
          schema: { type: string }
        - name: category_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [CUSTOMER_PRODUCT, CUSTOMER_CATEGORY, TIER_CATEGORY, TIER_DEFAULT]
      responses:
        "200":
          description: The page of rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRulePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: pricingCreateRule
      tags: [staff-pricing]
      summary: Create a pricing rule
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRuleWrite"
      responses:
        "201":
          description: The new rule id and its starting version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCreatedRef"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/rules/{id}:
    get:
      operationId: pricingGetRule
      tags: [staff-pricing]
      summary: Read one pricing rule
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: pricingUpdateRule
      tags: [staff-pricing]
      summary: Apply a sparse edit to a pricing rule under its optimistic version
      description: >-
        Pointer semantics: an absent field is left unchanged, a present field is
        set (including priority 0 and is_active false). valid_from and valid_to
        are tri-state: absent leaves the bound, an empty string clears it back
        to null, a value sets it (RFC3339 or date only).
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingRulePatch"
      responses:
        "200":
          description: The rule after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingRule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: pricingDeleteRule
      tags: [staff-pricing]
      summary: Soft-retire a pricing rule under its optimistic version
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
        - name: version
          in: query
          required: true
          description: The version the caller saw; a stale retire conflicts
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The rule was retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingStatusResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/pricing/category-policies:
    get:
      operationId: pricingListCategoryPolicies
      tags: [staff-pricing]
      summary: List the category margin-policy grid
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of category policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryPolicyPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/pricing/category-policies/{categoryId}:
    put:
      operationId: pricingUpsertCategoryPolicy
      tags: [staff-pricing]
      summary: Create or replace the margin policy for one category
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingCategoryPolicyWrite"
      responses:
        "200":
          description: The stored category policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCategoryPolicy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/customers/{customerId}/overrides:
    get:
      operationId: pricingListOverrides
      tags: [staff-pricing]
      summary: List the category overrides for one customer
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingOverridePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: pricingCreateOverride
      tags: [staff-pricing]
      summary: Create a customer category override
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingOverrideWrite"
      responses:
        "201":
          description: The new override id and its starting version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingCreatedRef"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/overrides/{id}:
    put:
      operationId: pricingUpdateOverride
      tags: [staff-pricing]
      summary: Update a customer override under its optimistic version
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingOverrideWrite"
      responses:
        "200":
          description: The override after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingOverride"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: pricingDeleteOverride
      tags: [staff-pricing]
      summary: Delete a customer override under its optimistic version
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      x-guards: [requirePathUUID]
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
        - name: version
          in: query
          required: true
          description: The version the caller saw; a stale delete conflicts
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The override was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingStatusResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/pricing/audit:
    get:
      operationId: pricingListAudit
      tags: [staff-pricing]
      summary: Read the pricing audit log, newest first
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
        list: cost_visibility
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: entity_type
          in: query
          required: false
          schema: { type: string }
        - name: entity_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, BYPASS]
      responses:
        "200":
          description: The page of audit rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingAuditLogPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/pricing/floor-preview:
    post:
      operationId: pricingPreviewFloor
      tags: [staff-pricing]
      summary: Name the products a proposed price would put under the margin floor
      description: >-
        The pricing editors' floor warning (the editors warn and may still
        save). Lays the proposed rule, customer price, category margin policy
        or quantity break over the stored pricing data and grades the existing
        products it can reach through the resolver and its margin gate, as a
        quote line would meet them. A change that names no branch is graded
        at every branch location, each at its own cost with its own
        branch-limited rules, keeping the worst per product and naming that
        branch in the item, so a breach only one yard makes is named. Returns
        the products the new price leaves under the floor, worst first, each
        marked when it was already under the floor before the change. A
        surcharge tier never changes a price under the replace rule, so a
        break of surcharge tiers names nothing. A change that names a customer
        is graded at that customer's own pricing type, so the price today is
        what the customer pays. Products with no cost on file (at the named
        branch when the change names one, else at any branch) are counted in
        no_cost, and products the resolver has no price to grade (no list
        price, no unit conversion) in not_graded; any other failure of the
        grading is an error answer, never a count. no_cost_branches names the
        yards a branch-less check found no cost on file at, with the product
        count: informational, it never opens the warning on its own. At most
        200 products and a bounded number of product, customer type, quantity
        and branch combinations are graded (a combination is one resolve at
        one branch); the branches are graded dearest cost first, and truncated
        says when more existed, with not_graded_branches counting the branch
        gradings the cap left out. A quantity break has
        at most 20 tiers, and a tier starting at zero is graded at one base
        unit. Writes nothing: no price changes and no row in the pricing
        log. The request trail the server keeps of every POST still records
        the call itself. Refuses what the write itself
        would refuse (an override needs a customer, a category and a price unit).
      x-addition: "the editors' floor warning (plan CP0-6, QD-4); no ERP source route"
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingFloorPreviewRequest"
      responses:
        "200":
          description: The products the proposed price leaves under the floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingFloorPreview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The proposed price is not valid against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/floor-confirmations:
    post:
      operationId: pricingConfirmFloorWarning
      tags: [staff-pricing]
      summary: Record in the pricing log that the editor confirmed a floor warning
      description: >-
        Called after the confirmed save, against the record that save wrote.
        Writes one pricing log row (action UPDATE, field floor_warning_confirmed)
        naming the actor and the products the editor was shown. Unlike the
        writes' own log rows, a failure to write this one is an error answer,
        not a silent drop. A reference pair must be complete, and its id is
        checked only against the two kinds the pricing module can read itself:
        an id that names a product or a customer is refused when the claimed
        kind is the other (a product id sent as a quote reference is a 400).
        That check is partial by design: the kinds pricing has no read for
        (quote, order, category) are never resolved, an id that names nothing
        the module can see is taken as it comes, and the product read drops
        inactive products, so a product reference carrying an inactive
        product's id is accepted.
      x-addition: "records the editor's confirmation of a floor warning (plan CP0-6, QD-4); no ERP source route"
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingFloorConfirmation"
      responses:
        "200":
          description: The confirmation is in the pricing log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingStatusResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pricing/reports/low-margin:
    post:
      operationId: pricingLowMarginReport
      tags: [staff-pricing]
      summary: Classify a caller-supplied batch of line contexts by margin
      description: >-
        Runs each supplied line through the resolver and returns only the
        breaching lines, worst first. Lines that fail validation are surfaced
        with invalid set, never silently dropped.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk]
        level: read
        reason: classifies a caller-supplied batch by margin and writes nothing
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingLowMarginRequest"
      responses:
        "200":
          description: The breaching and invalid lines, worst first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricingLowMarginEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Validation failed against the pricing vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/pricing/reports/low-margin/scan:
    get:
      operationId: pricingLowMarginScan
      tags: [staff-pricing]
      summary: The low margin report, quotes and orders graded against current cost
      description: >-
        The low margin report the managers scan. It grades the price every
        document line holds (a committed order line, or a quote line at the
        quote's own price, net of the line's discount) against current
        per-branch cost and answers the lines below target (warn) or below the
        floor (critical), with lines whose cost is unknown as invalid, as a
        cursor page sorted by margin. Each row names the salesperson, the
        margin against the floor and the target, whether the line was cleared
        below the floor and by whom, and the document's own overall margin.
        from and to are the document's own dates, RFC3339 or date only. Held to
        the managers who clear or decide a floor and the roles above them, and
        to the cost and margin list: a role that may not see cost is refused.
        A caller that is not global scope reads only the documents of the
        branches it is granted; a branch_id outside the grant is a 403.
        Deleted quotes, orders and lines never appear.
      x-role: requireStaff
      x-access:
        surfaces: [quote-desk, money-desk]
        level: read
        list: low_margin_report
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: from
          in: query
          required: false
          description: Lower bound of the document date, RFC3339 or date only (default thirty days back)
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Upper bound of the document date, RFC3339 or date only, inclusive of the named day
          schema: { type: string }
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: doc_type
          in: query
          required: false
          description: Which documents to read, quotes, orders or both (the default)
          schema: { type: string, enum: [quotes, orders, both] }
        - name: salesperson_id
          in: query
          required: false
          description: Only this salesperson's documents (a staff user id)
          schema: { type: string, format: uuid }
        - name: cleared_only
          in: query
          required: false
          description: Only the lines below the floor now that a clearing stamp covers
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          required: false
          description: Order by the line's margin, worst first (margin_asc, the default) or best first; lines with no margin come last either way
          schema: { type: string, enum: [margin_asc, margin_desc], default: margin_asc }
      responses:
        "200":
          description: The page of graded rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingLowMarginScanPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/pricing/quantity-breaks:
    get:
      operationId: pricingListQuantityBreaks
      tags: [staff-pricing]
      summary: List quantity-break schedules with their tiers
      x-role: requireStaff
      x-access:
        surfaces: [dealer-admin]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The page of quantity-break headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingQuantityBreakPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: pricingCreateQuantityBreak
      tags: [staff-pricing]
      summary: Create a quantity-break schedule
      description: >-
        Scope is exactly one of product_id or category_id. Under the replace
        rule a matched break prices as one single figure off the retail anchor
        and replaces the resolved price only when strictly cheaper; it never
        stacks on the tier-resolved base, and a surcharge tier can never win.
      x-role: requireManager
      x-access:
        surfaces: [dealer-admin]
        level: manage
        list: pricing_editors
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
