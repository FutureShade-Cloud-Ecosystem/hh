paths:
  # --- billing: the receivables register (DIB-510). Reads and per-invoice acts
  # are staff; the collections campaign is manager; the dealer policy is admin.
  # Mounted by finstmt/dib510_register_mount.go, which receives
  # (RequireStaff, RequireManager, RequireAdmin) at the finstmt call site.
  /api/v1/ar/register:
    get:
      operationId: billingListRegister
      tags: [staff-billing]
      summary: Read the invoice register, open documents first
      description: >-
        The staff-side invoice book. The account position column on each row is
        gated by policy and is byte-absent for a caller the policy refuses.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          required: false
          description: Search over invoice no, customer name, account no, order no, customer PO
          schema: { type: string }
        - name: chip
          in: query
          required: false
          description: Filter to one derived register status
          schema:
            type: string
            enum: [OPEN, DUE_SOON, OVERDUE, PARTIALLY_PAID, PAID, DISPUTED, CREDIT_HOLD, DRAFT, VOID, CREDIT]
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: customer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: salesperson_id
          in: query
          required: false
          schema: { type: string }
        - name: show_credits
          in: query
          required: false
          schema: { type: boolean }
        - name: issued_from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: issued_to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: The register page with its chip counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRegisterPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/register/policy:
    get:
      operationId: billingGetRegisterPolicy
      tags: [staff-billing]
      summary: Read the register policy for a branch
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The effective register policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRegisterPolicy"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: billingPutRegisterPolicy
      tags: [staff-billing]
      summary: Write the register policy for a branch
      x-role: requireAdmin
      x-access:
        surfaces: [money-desk]
        level: admin
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingRegisterPolicy"
      responses:
        "200":
          description: Policy stored
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/register/selection:
    post:
      operationId: billingRegisterSelection
      tags: [staff-billing]
      summary: Total the caller-owned selection of invoices for the bulk bar
      description: >-
        A POST because the selection is a list of ids the caller owns. It
        changes nothing; it answers the count and the summed balance from the
        same place the bulk actions read.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingRegisterSelectionRequest"
      responses:
        "200":
          description: The selection count and summed balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRegisterSelectionResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/register/export:
    get:
      operationId: billingExportRegister
      tags: [staff-billing]
      summary: Download the current register view as CSV
      description: >-
        The same filter and the same figures as the register read. The body is
        CSV text with a Content-Disposition attachment filename, not JSON; the
        wire shape is raw text rather than a struct.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: chip
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, DUE_SOON, OVERDUE, PARTIALLY_PAID, PAID, DISPUTED, CREDIT_HOLD, DRAFT, VOID, CREDIT]
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: customer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: salesperson_id
          in: query
          required: false
          schema: { type: string }
        - name: show_credits
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: The register as a CSV download
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/register/invoices/{id}:
    get:
      operationId: billingGetRegisterInvoice
      tags: [staff-billing]
      summary: Read the full invoice detail panel in one call
      description: >-
        Lines, totals, customer block, delivery proof, the interleaved activity
        timeline, the live promise and dispute, and the reminder tones the
        caller may send. The account position is byte-absent for a caller the
        policy refuses.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The invoice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInvoiceDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/register/invoices/{id}/document:
    get:
      operationId: billingGetRegisterInvoiceDocument
      tags: [staff-billing]
      summary: Render the printable invoice document
      description: >-
        The body is rendered HTML (Content-Type text/html, Cache-Control
        no-store), not JSON. Rendering does not mark the invoice opened.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The printable invoice as HTML
          content:
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/register/invoices/{id}/payments:
    post:
      operationId: billingRecordInvoicePayment
      tags: [staff-billing]
      summary: Record an off-gateway payment against one invoice
      description: >-
        Idempotent on idempotency_key: a replayed key returns the first result
        with replayed true and posts nothing. balance_cents in the response is
        read back from the ledger after the settle.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingReceiptInput"
      responses:
        "200":
          description: The recorded receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingReceiptResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/payments/apply:
    post:
      operationId: paymentsApplyReceived
      tags: [staff-billing]
      summary: Record one received payment across the account's open invoices
      description: >-
        The caller names the money (amount, method, reference) and a list of the
        account's open invoices; the server allocates it oldest first in one
        transaction: one payment row, its payment_allocations, one journal by the
        idempotency key (a retry posts once). An amount over the selected
        invoices' payable, an invoice of another account, an invoice outside the
        caller's branch reach and a not open invoice are all refused in words
        with nothing applied. preview true answers the same split without
        writing anything. The branch reach refusal answers as not found, the
        same 404 as a missing invoice. A replayed key is judged like a first
        attempt, and then against its own body: an invoice it paid that is
        outside the caller's branch reach answers 404, a key that recorded a
        payment for another account, or for a different payment (another
        amount, method, reference or invoice list), is refused 422, and the
        same body under the same key answers the first result and writes
        nothing.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingApplyPaymentInput"
      responses:
        "200":
          description: The payment and the server's split per invoice, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingApplyPaymentAnswer"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: >-
            The payment is refused in words with nothing applied: an amount over
            the selected invoices' payable, an invoice that is not open, an empty
            or oversized list, the same invoice named twice, or a key already
            spent on another account's payment or on a different payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/ar/register/invoices/{id}/send:
    post:
      operationId: billingSendInvoice
      tags: [staff-billing]
      summary: Send one invoice to its account
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingInvoiceSendRequest"
      responses:
        "200":
          description: What the send did, including skipped documents and why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingReminderResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/register/invoices/{id}/promise:
    post:
      operationId: billingAddPromise
      tags: [staff-billing]
      summary: Record a promise to pay against one invoice
      description: >-
        One live promise per invoice. When one already exists the route
        answers 409 with the live promise attached beside the error string.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingPromiseInput"
      responses:
        "200":
          description: The recorded promise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPromiseView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ar/register/invoices/{id}/dispute:
    post:
      operationId: billingOpenDispute
      tags: [staff-billing]
      summary: Open a dispute on one invoice
      description: >-
        One open dispute per invoice. When one is already open the route
        answers 409 with the open dispute attached beside the error string.
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDisputeInput"
      responses:
        "200":
          description: The opened dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDisputeView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/ar/register/invoices/{id}/dispute/resolve:
    post:
      operationId: billingResolveDispute
      tags: [staff-billing]
      summary: Resolve the open dispute on one invoice
      x-role: requireStaff
      x-access:
        surfaces: [money-desk]
        level: work
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDisputeResolveRequest"
      responses:
        "200":
          description: Whether a dispute was resolved
          content:
            application/json:
              schema:
                type: object
                required: [resolved]
                properties:
                  resolved: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/register/reminders:
    post:
      operationId: billingSendRegisterReminders
      tags: [staff-billing]
      summary: Send a reminder run over a selection of invoices
      description: >-
        A deliberate collections campaign against the selected accounts, which
        is why it is manager-gated while the per-invoice send is staff.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingReminderInput"
      responses:
        "200":
          description: What the run sent, replayed, and skipped with reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingReminderResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/register/statements:
    post:
      operationId: billingCreateRegisterStatements
      tags: [staff-billing]
      summary: Create one interim statement per distinct account in a selection
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingRegisterStatementsRequest"
      responses:
        "200":
          description: What the batch produced, including skipped accounts and why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatementBatch"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/public/v1/ar/invoice-opened/{deliveryID}:
    get:
      operationId: billingTrackInvoiceOpened
      tags: [public]
      summary: Record an invoice open from the recipient's mail client
      description: >-
        Pre-auth, credentialed by the unguessable delivery id in the path. It
        accepts no input, appends one open record, and returns the same
        single-pixel GIF on every outcome so it is not an existence oracle.
      x-role: public
      security: []
      parameters:
        - name: deliveryID
          in: path
          required: true
          description: The delivery row id, the credential for this route
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A single-pixel GIF, whatever happened
          content:
            image/gif:
              schema: { type: string, format: binary }

  # --- billing: the AR console (aging, credit holds, the auto-hold switch,
  # the dispatch gate, statement runs). Manager for the reads and the acts,
  # admin for hold override, hold release, the credit sweep, and the switch.
  /api/v1/ar/aging:
    get:
      operationId: billingGetAging
      tags: [staff-billing]
      summary: Read the AR aging worklist
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: as_of
          in: query
          required: false
          description: Backdate the aging to this calendar date
          schema: { type: string, format: date }
      responses:
        "200":
          description: The aging page, one row per account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAgingPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/holds:
    get:
      operationId: billingListHolds
      tags: [staff-billing]
      summary: List credit holds
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, RELEASED]
      responses:
        "200":
          description: The holds page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCreditHoldPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/holds/{id}/override:
    post:
      operationId: billingOverrideHold
      tags: [staff-billing]
      summary: Permit transacting against a hold that stays in place, until an explicit expiry
      description: >-
        Override is not release: the hold stays ACTIVE and the audit trail
        names who allowed it. The reason is mandatory and the expiry is
        bounded; a longer permit must go through release instead.
      x-role: requireAdmin
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingHoldOverrideRequest"
      responses:
        "200":
          description: The override as recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingHoldOverrideResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/holds/{id}/ar-release:
    post:
      operationId: billingReleaseHold
      tags: [staff-billing]
      summary: Release a credit hold placed by the AR gates, with a mandatory reason
      description: >-
        Refuses NSF holds: those carry a stricter release requirement that
        lives on the till's own path, and this module does not lift them.
      x-role: requireAdmin
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingHoldReleaseRequest"
      responses:
        "200":
          description: The hold was released
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/ar/credit-sweep:
    post:
      operationId: billingRunCreditSweep
      tags: [staff-billing]
      summary: Run the credit evaluation on demand
      description: >-
        The same evaluation the scheduled job runs. With the auto-hold switch
        off it is a dry run: would_hold and customers report the blast radius
        and nothing is placed.
      x-role: requireAdmin
      x-access:
        surfaces: [money-desk]
        level: manage
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: What the evaluation did or would have done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingEvaluationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/auto-hold:
    get:
      operationId: billingGetAutoHold
      tags: [staff-billing]
      summary: Read the auto-hold switch and the read-only thresholds behind it
      x-role: requireAdmin
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: branch_id
          in: query
          required: false
          description: Absent reads the org default
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The effective setting, with switch_wired naming whether the write seam exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAutoHoldSetting"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: billingPutAutoHold
      tags: [staff-billing]
      summary: Flip the auto-hold master switch
      description: >-
        enabled is required and must be explicit: a body that omits it is a
        bad request, never a silent false. Every flip is audited in both
        directions. Re-asserting the current value is not an error.
      x-role: requireAdmin
      x-access:
        surfaces: [money-desk]
        level: admin
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingAutoHoldRequest"
      responses:
        "200":
          description: The setting as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingAutoHoldSetting"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/dispatch-gate/{orderID}:
    get:
      operationId: billingGetDispatchGate
      tags: [staff-billing]
      summary: Answer whether this order's goods may leave, with the reason when not
      description: >-
        The AR dispatch predicate exposed as a read. It fails closed: an
        unknown order or an internal failure answers allowed false with a
        reason that names the failure, never a 404.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
        level: read
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: orderID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The gate answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDispatchGateResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/ar/statement-runs:
    post:
      operationId: billingCreateStatementRun
      tags: [staff-billing]
      summary: Generate a statement run
      description: >-
        MASS covers every account in scope; INTERIM covers one account and
        requires customer_id. Statements are generated and the sendable ones
        marked QUEUED; delivery happens only through a wired outbox.
      x-role: requireManager
      x-access:
        surfaces: [money-desk]
