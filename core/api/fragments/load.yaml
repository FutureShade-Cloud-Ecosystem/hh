# Fragment: the load doors (HH-LOAD-1 items LD-1, LD-4 and LD-11).
#
# The machine surface FB Move's loads arrive through. This fragment
# carries the frame's own two operations (the batch read and the legacy
# key resolution), the four reference and supplier doors (the branch
# map, the user map, the category upsert and the supplier upsert) and
# LD-11's open receivables door, a money door under the all-or-nothing
# batch rule.
#
# One body shape for every load door (the plan's operation list): the
# source system, the caller's batch id, and a bounded list of items,
# each with its legacy key, the derived key, the record, and the
# references named by legacy key. One answer shape: one outcome per item
# and the batch's counts. The outcome vocabulary is created, attached,
# updated, unchanged and refused: the map doors record names against rows
# that already exist and answer attached for an item whose name was not
# yet recorded and now binds to the pre existing row; a replay of an
# already recorded name answers unchanged or updated as usual.
#
# Gate: x-role machine, MachineBearer alone (ADR-0024): the machine word
# and the scheme name each other, and the machine credential never
# dual-lists with a platform scheme. The machine principal's own door
# list is the whole authority; the routes register only where a
# deployment's configuration switches the load doors on (CORE_LOAD_DOORS,
# off by default), behind the machine gate. X-Org is required and must
# name the principal's own org: a missing, repeated, malformed or foreign
# X-Org, like every other wrong caller answer on this surface, is the one
# machine leg's 403 body, so no answer here splits the refusals into a
# directory.
#
# Read semantics: loadResolveKeys and loadGetBatch write nothing;
# loadResolveKeys exists so callers can name references by legacy key and
# the reconcile can count, and loadGetBatch returns what a batch first
# recorded. The four PUT doors are the keyed upserts: the maps create
# nothing (branches and staff rows are attached, never created), the
# categories upsert a tree whose parent is named by legacy key with
# cycles refused, and the suppliers upsert the vendor record with its
# contact through the purchasing module's own contact store.
paths:
  /api/v1/load/batches/{id}:
    get:
      operationId: loadGetBatch
      tags: [load]
      summary: Read one load batch by the caller's batch id
      description: >-
        The counts by outcome and the per item outcomes the batch first
        recorded, so a replayed submission can be answered from the
        record. The id is the caller's own batch id, not an HH uuid.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The recorded batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadBatchView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The batch id is recorded under more than one source system in this org; the read refuses rather than guess
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/keys/resolve:
    post:
      operationId: loadResolveKeys
      tags: [load]
      summary: Resolve legacy keys to HH ids
      description: >-
        A list body of legacy keys in, one resolution per item out: the
        HH row the key names within the org and source system, or null
        where the name is not yet recorded, with the found and missing
        counts. Read semantics; writes nothing. A list over the bound
        refuses with 400.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadKeysResolveRequest"
      responses:
        "200":
          description: One resolution per item, with the counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadKeysResolveResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/load/branches:
    put:
      operationId: loadMapBranches
      tags: [load]
      summary: Attach the dealer's branch keys to HH's existing branches
      description: >-
        One item per legacy branch key. The record names one field, the
        yard code of an existing branch row; a name not yet recorded
        binds to that row and answers attached, a replay answers
        unchanged, and a record that would re-point a recorded name at a
        second row refuses as a key conflict. A code that answers no
        branch row refuses naming the field. No branch is ever created.
        The read assumes one deployment per dealer: it carries no org
        predicate (the single org assumption of the plan's reading 3).
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/users:
    put:
      operationId: loadMapUsers
      tags: [load]
      summary: Attach the dealer's user and sales rep keys to existing staff rows
      description: >-
        One item per legacy user key. The record names one field, the
        verified login email of an existing staff row; a name not yet
        recorded binds to that row and answers attached, a replay answers
        unchanged. An email that answers no staff row refuses naming the
        field, never a value. No user is ever created. Any staff row
        that is not deleted attaches, suspended and deactivated staff
        included, so a former rep's key still resolves; the attach
        grants nothing. The read assumes one deployment per dealer: it
        carries no org predicate (the plan's reading 3).
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/categories:
    put:
      operationId: loadUpsertCategories
      tags: [load]
      summary: Upsert product categories, the parent named by legacy key
      description: >-
        One item per category. The record names the code and the name;
        the parent, named by legacy key, arrives as a reference of kind
        category and resolves against the registry before any write, so
        a parent not yet loaded refuses naming the kind and the key. A
        parent chain that would return to the row the item names refuses
        as a cycle, and one deeper than the bound the catalogue serves
        refuses as too deep, each with nothing of the write standing. A
        code a staff member already made attaches to that row and takes
        the load's stamps. A changed code on a recorded legacy key
        updates that row in place; a code another row carries refuses as
        a key conflict naming both keys. A row another org owns refuses
        naming the kind and the key; its org is never overwritten.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/suppliers:
    put:
      operationId: loadUpsertSuppliers
      tags: [load]
      summary: Upsert the supplier record with its terms, remit address and ordering contact
      description: >-
        One item per supplier. The legacy id is the vendor number, the
        source's natural key; the record names the supplier name and,
        named, the payment terms in days, the EDI flag, the remit
        address, the active flag, the metadata, and the ordering contact
        (contact name, email, phone) through the purchasing module's own
        contact store. A contact that names neither an email nor a phone
        refuses naming the field, as do negative payment terms. A reload
        whose record names no contact removes the loaded contact: the
        record is the whole truth. A row another org owns refuses naming
        the kind and the key; its org is never overwritten.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/receivables:
    put:
      operationId: loadUpsertReceivables
      tags: [load]
      summary: Load one batch of open receivable items
      description: >-
        The open receivables door (HH-LOAD-1 LD-11): each open item of
        the caller's AR extract lands as an imported invoice or credit
        memo, with the source document number beside HH's own, the issue
        and due dates as recorded, and the open amount in whole cents,
        one receivables ledger row per item in date order per customer
        so aging survives. Unapplied cash loads as a negative item and
        lands as a credit memo. The batch is all or nothing: one
        refused item refuses the batch and nothing lands, and the
        refusing item is named in the 422 body. A replayed batch id
        returns the outcomes it first recorded and writes nothing; a
        replay carrying a changed or added item refuses with 409; a
        batch that contended with another batch on shared names rolled
        back whole and answers 503 with Retry-After: resubmit the whole
        batch (money batches re-run whole; the id was never recorded).
        An item restated on a later batch updates its document in
        place, with three refusals that name their own reason: sign_changed
        (the restated amount changed sign; a source item that changed
        sign is a different document), target_worked_in_hh (HH has worked
        the loaded document since it loaded, so a reload never overwrites
        it), and update_target_missing (the registry names a document
        that is truly gone). One worked item refuses the whole reload, so
        FB Move's reload must exclude items HH has worked. No journal, no
        finalized event, no customer message, reminder or credit sweep
        is triggered by a load: the imported document emits none of the
        events those paths hang off. Money is integer cents, never a
        float: an open amount that is not exact whole cents refuses with
        400 naming the item and the field.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 LD-11 open receivables; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadReceivablesUpsertRequest"
      responses:
        "200":
          description: The batch's counts by outcome and one outcome per item, in the body's own item order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadReceivablesResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door, or the replay carries an item the played batch never recorded or whose content differs from what it recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The batch refused whole; the refusing item's legacy id, reason, field and detail ride the Error envelope, keys and fields only, never a record value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The batch contended with another in flight batch and rolled back whole, nothing landed and the id was never recorded; Retry-After names the pause, and the caller resubmits the whole batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    LoadReceivablesRecord:
      type: object
      description: >-
        One open item's record, the carried facts only, never
        recomputed: source_doc_no (the source document number, one to
        128 characters, required), issue_date and due_date (strict
        calendar days as YYYY-MM-DD, both required, landed as recorded),
        open_amount_cents (the open amount in whole cents, required,
        non-zero: a negative amount is unapplied cash and lands as a
        credit memo; a value that is not an exact integer refuses the
        batch naming the item), and the optional source_job_key and
        source_address_key (the source job and address legacy keys,
        which ride on the record until their homes exist). The record is
        closed: a field outside these six refuses, so two records that
        differ anywhere the door cannot land also cannot hash alike.
      additionalProperties: true
    LoadReceivablesItem:
      type: object
      required: [legacy_id, requires, record]
      properties:
        legacy_id: { type: string, minLength: 1, maxLength: 512 }
        derived_key:
          type: [string, "null"]
          format: uuid
          description: The caller's name-based uuid over the same four parts; empty leaves the row's idempotency column untouched
        requires:
          type: array
          description: >-
            The item's references by legacy key: exactly one customer
            and one branch. The source job and address keys ride on the
            record instead; they have no registry homes yet.
          items:
            $ref: "#/components/schemas/LoadKeyRef"
        record:
          $ref: "#/components/schemas/LoadReceivablesRecord"
    LoadReceivablesUpsertRequest:
      type: object
      required: [source_system, batch_id, items]
      properties:
        source_system: { type: string, minLength: 1, maxLength: 64 }
        batch_id: { type: string, minLength: 1, maxLength: 128 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LoadReceivablesItem"
    LoadReceivablesResult:
      type: object
      required: [batch_id, counts, items]
      properties:
        batch_id: { type: string }
        counts:
          $ref: "#/components/schemas/LoadBatchCounts"
        items:
          type: array
          description: One outcome per item, in the request body's own item order
          items:
            $ref: "#/components/schemas/LoadBatchItemOutcome"
    LoadKeyRef:
      type: object
      required: [kind, legacy_id]
      properties:
        kind: { type: string, minLength: 1, maxLength: 64 }
        legacy_id: { type: string, minLength: 1, maxLength: 512 }
    LoadKeysResolveRequest:
      type: object
      required: [source_system, items]
      properties:
        source_system: { type: string, minLength: 1, maxLength: 64 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LoadKeyRef"
    LoadKeyResolution:
      type: object
      required: [kind, legacy_id, hh_id]
      properties:
        kind: { type: string }
        legacy_id: { type: string }
        hh_id: { type: [string, "null"], format: uuid }
    LoadKeysResolveCounts:
      type: object
      required: [found, missing]
      properties:
        found: { type: integer, format: int32 }
        missing: { type: integer, format: int32 }
    LoadKeysResolveResult:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoadKeyResolution"
        counts:
          $ref: "#/components/schemas/LoadKeysResolveCounts"
    LoadBatchItemOutcome:
      type: object
      required: [legacy_id, status]
      properties:
        legacy_id: { type: string }
        status:
          type: string
          enum: [created, attached, updated, unchanged, refused]
        hh_id: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        field: { type: [string, "null"] }
        detail: { type: [string, "null"] }
    LoadBatchCounts:
      type: object
      required: [created, attached, updated, unchanged, refused]
      properties:
        created: { type: integer, format: int32 }
        attached: { type: integer, format: int32 }
        updated: { type: integer, format: int32 }
        unchanged: { type: integer, format: int32 }
        refused: { type: integer, format: int32 }
    LoadSubmitItem:
      type: object
      required: [legacy_id, record]
      properties:
        legacy_id: { type: string, minLength: 1, maxLength: 512 }
        derived_key: { type: [string, "null"], format: uuid }
        record:
          type: object
          additionalProperties: true
        requires:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LoadKeyRef"
    LoadSubmitRequest:
      type: object
      required: [source_system, batch_id, items]
      properties:
        source_system: { type: string, minLength: 1, maxLength: 64 }
        batch_id: { type: string, minLength: 1, maxLength: 128 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LoadSubmitItem"
    LoadSubmitResult:
      type: object
      required: [batch_id, counts, items]
      properties:
        batch_id: { type: string }
        counts:
          $ref: "#/components/schemas/LoadBatchCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoadBatchItemOutcome"
    LoadBatchView:
      type: object
      required: [batch_id, source_system, kind, caller, state, counts, items, created_at]
      properties:
        batch_id: { type: string }
        source_system: { type: string }
        kind: { type: string }
        caller: { type: string }
        state:
          type: string
          enum: [RECORDED]
        counts:
          $ref: "#/components/schemas/LoadBatchCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoadBatchItemOutcome"
        created_at: { type: string, format: date-time }
