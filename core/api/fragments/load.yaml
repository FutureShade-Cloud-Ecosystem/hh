      summary: Upsert contacts under their customer by legacy key
      description: >-
        One item per contact. The record names the contact name and, named, the
        email, the phone, the role, the primary flag and the active flag; the one
        reference of kind customer names the customer the contact belongs under.
        A contact has no org column of its own: its org rides through its
