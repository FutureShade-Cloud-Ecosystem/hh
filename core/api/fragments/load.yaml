        source codes to unique HH codes (the plan's reading 4); a
        dimension the catalogue does not carry refuses naming the field;
        a row another org owns refuses naming the kind and the key, its
        org never overwritten. No unit is ever deleted. The catalogue is
        the deployment wide vocabulary (the plan's reading 3): the
        unit's identity is its code, the catalogue carries no uuid
