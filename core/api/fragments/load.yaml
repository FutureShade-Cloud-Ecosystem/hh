# Fragment: the load doors (HH-LOAD-1 items LD-1, LD-4 and LD-6).
#
# The machine surface FB Move's loads arrive through. This fragment
# carries the frame's own two operations (the batch read and the legacy
# key resolution), the four reference and supplier doors (the branch map,
# the user map, the category upsert and the supplier upsert) and the three
# customer doors (the customer, contact and job upserts).
#
# One body shape for every load door (the plan's operation list): the
# source system, the caller's batch id, and a bounded list of items,
# each with its legacy key, the derived key, the record, and the
# references named by legacy key. One answer shape: one outcome per item
# and the batch's counts. The outcome vocabulary is created, attached,
# updated, unchanged and refused: the map doors, and the customer door for
# a staff made row its account number names, record names against rows
# that already exist and answer attached for an item whose name was not
# yet recorded and now binds to the pre existing row; a replay of an
# already recorded name answers unchanged or updated as usual. A landed
# item (created or updated) may carry a note in the same reason, field and
# detail properties a refusal uses: the customer door's address that failed
# validation is left out and noted, naming the field, never a value.
#
# Gate: x-role machine, MachineBearer alone (ADR-0024): the machine word
# and the scheme name each other, and the machine credential never
# dual-lists with a platform scheme. The machine principal's own door
# list is the whole authority; the routes register only where a
# deployment's configuration switches the load doors on (CORE_LOAD_DOORS,
# off by default), behind the machine gate. X-Org is required and must
# name the principal's own org: a missing, repeated, malformed or foreign
# X-Org, like every other wrong caller answer on this surface, is the one
# machine leg's 403 body, so no answer here splits the refusals into a
# directory.
#
# Read semantics: loadResolveKeys and loadGetBatch write nothing;
# loadResolveKeys exists so callers can name references by legacy key and
# the reconcile can count, and loadGetBatch returns what a batch first
# recorded. The four PUT doors are the keyed upserts: the maps create
# nothing (branches and staff rows are attached, never created), the
# categories upsert a tree whose parent is named by legacy key with
# cycles refused, and the suppliers upsert the vendor record with its
# contact through the purchasing module's own contact store.
paths:
  /api/v1/load/batches/{id}:
    get:
      operationId: loadGetBatch
      tags: [load]
      summary: Read one load batch by the caller's batch id
      description: >-
        The counts by outcome and the per item outcomes the batch first
        recorded, so a replayed submission can be answered from the
        record. The id is the caller's own batch id, not an HH uuid.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The recorded batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadBatchView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The batch id is recorded under more than one source system in this org; the read refuses rather than guess
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/keys/resolve:
    post:
      operationId: loadResolveKeys
      tags: [load]
      summary: Resolve legacy keys to HH ids
      description: >-
        A list body of legacy keys in, one resolution per item out: the
        HH row the key names within the org and source system, or null
        where the name is not yet recorded, with the found and missing
        counts. Read semantics; writes nothing. A list over the bound
        refuses with 400.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadKeysResolveRequest"
      responses:
        "200":
          description: One resolution per item, with the counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadKeysResolveResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/load/branches:
    put:
      operationId: loadMapBranches
      tags: [load]
      summary: Attach the dealer's branch keys to HH's existing branches
      description: >-
        One item per legacy branch key. The record names one field, the
        yard code of an existing branch row; a name not yet recorded
        binds to that row and answers attached, a replay answers
        unchanged, and a record that would re-point a recorded name at a
        second row refuses as a key conflict. A code that answers no
        branch row refuses naming the field. No branch is ever created.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/users:
    put:
      operationId: loadMapUsers
      tags: [load]
      summary: Attach the dealer's user and sales rep keys to existing staff rows
      description: >-
        One item per legacy user key. The record names one field, the
        verified login email of an existing staff row; a name not yet
        recorded binds to that row and answers attached, a replay answers
        unchanged. An email that answers no staff row refuses naming the
        field, never a value. No user is ever created.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/categories:
    put:
      operationId: loadUpsertCategories
      tags: [load]
      summary: Upsert product categories, the parent named by legacy key
      description: >-
        One item per category. The record names the code and the name;
        the parent, named by legacy key, arrives as a reference of kind
        category and resolves against the registry before any write, so
        a parent not yet loaded refuses naming the kind and the key. A
        parent chain that would return to the row the item names refuses
        as a cycle with nothing of the write standing. A code a staff
        member already made attaches to that row and takes the load's
        stamps.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/suppliers:
    put:
      operationId: loadUpsertSuppliers
      tags: [load]
      summary: Upsert the supplier record with its terms, remit address and ordering contact
      description: >-
        One item per supplier. The legacy id is the vendor number, the
        source's natural key; the record names the supplier name and,
        named, the payment terms in days, the EDI flag, the remit
        address, the active flag, the metadata, and the ordering contact
        (contact name, email, phone) through the purchasing module's own
        contact store. A contact that names neither an email nor a phone
        refuses naming the field.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/customers:
    put:
      operationId: loadUpsertCustomers
      tags: [load]
      summary: Upsert customers by legacy key, through the customer module's own validation
      description: >-
        One item per customer. The legacy id is the account number unless the
        record names another; the record names the customer name and, named, the
        customer type, the payment terms in days, the credit limit in cents, the
        active flag and the billing address. The address runs the Canadian
        normalisation the staff write runs: one that fails is left out and the
        item still lands, its outcome carrying the reason address_left_out and
        the field billing_address, never a value. The home branch (a reference of
        kind branch) and the reps (references of kind user) are named by legacy
        key and resolve against the registry before any write, so a reference not
        yet loaded refuses naming the kind and the key. A credit hold or a tax
        exemption in the record refuses naming the field: both wait for the
        receivables load. A row the account number already names attaches and
        takes the load's org, sequence and key; a second legacy key claiming it,
        or a recorded key re-pointing at another customer's, refuses as a key
        conflict naming both legacy ids (the staff row, when no key names the
        holder). A first bind to a staff made row answers attached, and the
        row's existing metadata keys are kept. A reload that names no account
        number keeps the stored one; the legacy id serves only a first load
        that names none. A row another org owns refuses as org_mismatch
        naming the kind and the key; its org is never overwritten.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/contacts:
    put:
      operationId: loadUpsertContacts
      tags: [load]
      summary: Upsert contacts under their customer by legacy key
      description: >-
        One item per contact. The record names the contact name and, named, the
        email, the phone, the role, the primary flag and the active flag; the one
        reference of kind customer names the customer the contact belongs under.
        A contact has no org column of its own: its org rides through its
        customer, so a customer another org owns refuses as org_mismatch
        naming the kind and the key.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/load/jobs:
    put:
      operationId: loadUpsertJobs
      tags: [load]
      summary: Upsert jobs as project records under their customer by legacy key
      description: >-
        One item per job. The record names the job name and, named, the job
        address; the one reference of kind customer names the customer the job
        belongs to. The job is the record only: balances, statements and
        receivables attribution are not loaded here. The project row has no org
        column, so its org rides through its customer, and the writer stamps the
        tenant, the sync sequence and the derived key; a customer another org
        owns refuses as org_mismatch naming the kind and the key.
      x-role: machine
      security:
        - MachineBearer: []
      x-addition: "HH-LOAD-1 load doors; no ERP source route"
      parameters:
        - $ref: "#/components/parameters/XOrg"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadSubmitRequest"
      responses:
        "200":
          description: One outcome per item and the batch's counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadSubmitResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The batch id is recorded under another door; the submission is a collision of two doors' batch namespaces, not a replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The batch contended with another in flight batch on shared
            names and Postgres rolled it back whole: nothing of it stands,
            and resubmitting the whole batch is safe. The one answer a
            caller may retry the batch on, never a per item outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    LoadKeyRef:
      type: object
      required: [kind, legacy_id]
      properties:
        kind: { type: string, minLength: 1, maxLength: 64 }
        legacy_id: { type: string, minLength: 1, maxLength: 512 }
    LoadKeysResolveRequest:
      type: object
      required: [source_system, items]
      properties:
        source_system: { type: string, minLength: 1, maxLength: 64 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LoadKeyRef"
    LoadKeyResolution:
      type: object
      required: [kind, legacy_id, hh_id]
      properties:
        kind: { type: string }
        legacy_id: { type: string }
        hh_id: { type: [string, "null"], format: uuid }
    LoadKeysResolveCounts:
      type: object
      required: [found, missing]
      properties:
        found: { type: integer, format: int32 }
        missing: { type: integer, format: int32 }
    LoadKeysResolveResult:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoadKeyResolution"
        counts:
          $ref: "#/components/schemas/LoadKeysResolveCounts"
    LoadBatchItemOutcome:
      type: object
      required: [legacy_id, status]
      properties:
        legacy_id: { type: string }
        status:
          type: string
          enum: [created, attached, updated, unchanged, refused]
        hh_id: { type: [string, "null"], format: uuid }
        reason: { type: [string, "null"] }
        field: { type: [string, "null"] }
        detail: { type: [string, "null"] }
    LoadBatchCounts:
      type: object
      required: [created, attached, updated, unchanged, refused]
      properties:
        created: { type: integer, format: int32 }
        attached: { type: integer, format: int32 }
        updated: { type: integer, format: int32 }
        unchanged: { type: integer, format: int32 }
        refused: { type: integer, format: int32 }
    LoadSubmitItem:
      type: object
      required: [legacy_id, record]
      properties:
        legacy_id: { type: string, minLength: 1, maxLength: 512 }
        derived_key: { type: [string, "null"], format: uuid }
        record:
          type: object
          additionalProperties: true
        requires:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LoadKeyRef"
    LoadSubmitRequest:
      type: object
      required: [source_system, batch_id, items]
      properties:
        source_system: { type: string, minLength: 1, maxLength: 64 }
        batch_id: { type: string, minLength: 1, maxLength: 128 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/LoadSubmitItem"
    LoadSubmitResult:
      type: object
      required: [batch_id, counts, items]
      properties:
        batch_id: { type: string }
        counts:
          $ref: "#/components/schemas/LoadBatchCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoadBatchItemOutcome"
    LoadBatchView:
      type: object
      required: [batch_id, source_system, kind, caller, state, counts, items, created_at]
      properties:
        batch_id: { type: string }
        source_system: { type: string }
        kind: { type: string }
        caller: { type: string }
        state:
          type: string
          enum: [RECORDED]
        counts:
          $ref: "#/components/schemas/LoadBatchCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/LoadBatchItemOutcome"
        created_at: { type: string, format: date-time }
