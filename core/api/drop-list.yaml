# Route parity ledger for core/api/tools/parity.mjs.
#
# The parity check lists every literal "<METHOD> /api..." route registered in
# hardscapeos_dibbits/backend/internal (the same grep
# analysis/hardscapeos-inventory.md section 2.6 used, non-test Go only),
# applies the portal rename (/api/portal/v1/X -> /api/v1/tenant/X), and diffs
# the result against the routes in core/api/openapi.yaml. Every ERP route
# absent from the document must appear under drops: with a reason; every
# document route with no ERP source must appear under additions: with a
# reason. An unexplained line on either side fails the check.
#
# House rules: no em or en dashes; no dates.

drops:
  - route: "POST /api/v1/orders/…"
    reason: "Not a route: a comment line in order/activity.go:27 quoting an API framing the surface exists to hide. The literal grep cannot tell comments from registrations."

additions:
  - route: "GET /api/v1/sync/{scope}"
    reason: "Context 4.5 sync protocol, one pull per manifest offline scope; the ERP has no sync endpoint."
  - route: "POST /api/v1/sync/{scope}"
    reason: "Context 4.5 sync protocol, the outbox replay; the ERP has no sync endpoint."
  - route: "POST /api/v1/attachments"
    reason: "D10 canonical attachment entity (metadata record; bytes in Appwrite Storage); the ERP has only per-owner file routes."
  - route: "GET /api/v1/attachments/{id}"
    reason: "D10 canonical attachment entity; the ERP has only per-owner file routes."
  - route: "POST /api/v1/attachments/{id}/links"
    reason: "D10 polymorphic attachment_link; replaces per-owner attachment columns."
  - route: "GET /api/v1/tenants/{tenantId}/brand"
    reason: "D12 tenant_brand staff read; the ERP keeps dealer branding in portal config only."
  - route: "PUT /api/v1/tenants/{tenantId}/brand"
    reason: "D12 tenant_brand staff write for the dealer-admin surface; no ERP source."
  - route: "GET /api/v1/operator/platform-keys"
    reason: "D4 operator read for the launcher (the platform key roster); source hh_pro_dibbits/server/admin-store.ts, not the ERP."
  - route: "PUT /api/v1/operator/platform-keys/{key}"
    reason: "D4 operator write for the launcher; the server marks the write; no ERP source."
  - route: "PUT /api/v1/operator/dealer-credential"
    reason: "D4 write-only dealer credential route (validated before stored, never returned); source hh_pro_dibbits/server/admin-store.ts storeKey."
  - route: "GET /api/v1/operator/usage"
    reason: "D4 per-account usage counter read for the launcher; source hh_pro_dibbits/server/admin-store.ts."
  - route: "POST /api/v1/demo/session"
    reason: "Registered via string concatenation (demo/handler.go RouteSession constant), so the literal grep cannot see it; source hardscapeos_dibbits/backend/internal/demo/handler.go."
  - route: "GET /api/v1/demo/flows"
    reason: "Registered via string concatenation (demo/handler.go RouteFlows constant), so the literal grep cannot see it; source hardscapeos_dibbits/backend/internal/demo/handler.go."
  - route: "GET /api/v1/bistrack/status"
    reason: "Registered from a route-descriptor table (bistrack/handler.go:45), so the literal grep cannot see it; staff-gated read-only status."
  - route: "POST /api/v1/customer-quotes/{id}/send"
    reason: "G1 customer-quote send (D8): the dealer-side mint of the homeowner magic link; the raw token appears in this response only; no ERP source route."
  - route: "GET /api/public/v1/customer-quotes/{token}"
    reason: "G1 customer-quote public view, modelled on the dealer public quote pair; the D10 and D12 token ruling lands here; no ERP source route."
  - route: "POST /api/public/v1/customer-quotes/{token}/accept"
    reason: "G1 customer-quote public acceptance (D8, D10, D12): typed-name attestation with the 404, 410 and 409 semantics; no ERP source route."
  - route: "GET /api/v1/pos/tax-rate"
    reason: "Row 661: the counter-readable tax rate; the rate the ring binds, read through the ring's own assessor, with the stored round rule beside it; no ERP source route."
  - route: "GET /api/v1/payments/card-attempts"
    reason: "Row 813, the card charge design section 4: the manager's reconciliation list over card_charge_attempts (what needs a person, plus the range's ref-carrying rows that are not BOUND); no ERP source route."
  - route: "POST /api/v1/payments/card-attempts/{id}/resolve"
    reason: "Row 813, the card charge design section 4: the manager's reason-required audited close of an attempt that needed a person; no ERP source route."
  - route: "GET /api/v1/load/batches/{id}"
    reason: "HH-LOAD-1 load doors: the machine batch read behind the load doors deployment switch; no ERP source route."
  - route: "POST /api/v1/load/keys/resolve"
    reason: "HH-LOAD-1 load doors: the machine legacy key resolution behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/receivables"
    reason: "HH-LOAD-1 LD-11 open receivables load door: the machine money batch behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/branches"
    reason: "HH-LOAD-1 load doors: the branch map, names against existing branch rows, behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/users"
    reason: "HH-LOAD-1 load doors: the user map, names against existing staff rows by verified email, behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/categories"
    reason: "HH-LOAD-1 load doors: the product category upsert, the parent named by legacy key, behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/suppliers"
    reason: "HH-LOAD-1 load doors: the supplier upsert with its contact through the purchasing contact store, behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/units"
    reason: "HH-LOAD-1 load doors (LD-3): the unit catalogue upsert, a unit that already stands with the same code and dimension attached, behind the load doors deployment switch; no ERP source route."
  - route: "PUT /api/v1/load/products/unit-sets"
    reason: "HH-LOAD-1 load doors (LD-3): the product unit set replace, the product named by legacy key, behind the load doors deployment switch; no ERP source route."
  - route: "GET /api/v1/uoms"
    reason: "HH-LOAD-1 load doors (LD-3): the staff read of the unit catalogue, Dealer Admin at read; no ERP source route."
  - route: "POST /api/v1/quotes/{id}/lines/{lineNo}/floor-approval"
    reason: "The quote floor's request door (plan 1.1): files one approval request bound to that quote, that line and that discount; the ERP's margin request was a generic identity filing with no line binding; no ERP source route."
  - route: "POST /api/v1/quotes/{id}/order-payment"
    reason: "The counter's payment door on a converted quote's order (plan 1.1, QD-5): raises the order's invoice at the agreed totals and settles the payment through the payments settle; the ERP's one payment route is the register's record-payment against an existing invoice and no route finds the order a quote became; no ERP source route."
  - route: "POST /api/v1/pos/sale-preview"
    reason: "Row 985: the read-only sale preview; the sale's own body without any tender priced through the ring's own resolver, so the counter sees the subtotal, each tax line and the total before the ring; no ERP source route."
  - route: "GET /api/v1/customers/{id}"
    reason: "The staff read of one customer account by id, credit limit and current balance included, behind the picker's grants (the Quote Desk server reads); the ERP has the picker's search and the portal's own resolve but no staff read by id; no ERP source route."
  - route: "GET /api/v1/pos/payment-grant"
    reason: "The grant check a client asks before it offers to take a payment (the Quote Desk server reads): whether the caller holds the grant the till sale and the payment on a converted quote's order both require, answered by the role gate's own walk; the ERP has no read of the caller's grants; no ERP source route."
  - route: "GET /api/v1/product-categories"
    reason: "The staff read of the product categories (id, code, name, is_active) for the pricing screens, Dealer Admin at read like the pricing reads; the ERP has the category list only inside its product filters; no ERP source route."
  - route: "GET /api/v1/quotes/{id}/customer-view"
    reason: "The staff preview of the customer's quote page: the public view built by the same code path, never minting a link, moving the status, scheduling a follow-up or logging a view, with acceptable false and preview true; no ERP source route."
  - route: "POST /api/v1/quotes/{id}/accept"
    reason: "Staff accepting a quote on the customer's behalf after a phone, text, email or in person yes: the same selling-role rule as convert, the channel, a note and the quantity statement recorded in the audit and the change history; the ERP's only accept is the contractor portal's own; no ERP source route."
  - route: "POST /api/v1/quotes/{id}/reject"
    reason: "Staff marking a quote lost on the customer's behalf after a phone, text, email or in person no: a reason code and note, the same selling-role rule as convert, the soft holds released and the follow-ups stopped; the ERP's only reject is the contractor portal's own; no ERP source route."
